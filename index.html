<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TBD</title>
<meta name="description" content="TBD — checklists and to-do items, stored on this device.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='28' height='28' rx='8' fill='%234f46e5'/><path d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/></svg>">

<!-- Icons: external webfont (never inline svg). jsDelivr, then unpkg, then no glyphs at all —
     every icon button also carries a text label, so the app stays usable if both CDNs fail. -->
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk"
  crossorigin="anonymous"
  onerror="this.onerror=null;this.href='https://unpkg.com/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css'"
>

<script>
// Theme before first paint, so a dark system never flashes white.
// Mirrors settings.theme + applyTheme() below; keep the two in sync.
document.documentElement.dataset.theme = (() => {
  let mode = "system";
  try {
    mode = JSON.parse(localStorage.getItem("tbd.settings") || "{}").theme || "system";
  } catch (_error) {
    mode = "system";
  }
  if (mode === "dark") return "dark";
  if (mode === "light") return "light";
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
})();
</script>

<style>
/* ===== tokens ===== */

:root {
  --bg: #f5f6f8;
  --surface: #fff;
  --surface-2: #ebedf2;
  --text: #14161a;
  --muted: #667080;
  --border: #dfe2e9;
  --accent: #4f46e5;
  --accent-contrast: #fff;
  --ring: rgb(79 70 229 / 0.35);
  --shadow-1: 0 1px 2px rgb(14 18 27 / 0.06);
  --shadow-2: 0 12px 32px rgb(14 18 27 / 0.16);
  --radius: 14px;
  --radius-sm: 10px;
  --gutter: clamp(12px, 4vw, 24px);
  --col: 720px;
  --pad: 10px;
  --tap: 44px;
  --panel-w: 44px;
  --panel-gap: 14px;

  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #0e1015;
  --surface: #171a21;
  --surface-2: #21262f;
  --text: #e8eaf0;
  --muted: #949fb1;
  --border: #2a3038;
  --accent: #8079ff;
  --accent-contrast: #0e1015;
  --ring: rgb(128 121 255 / 0.4);
  --shadow-1: 0 1px 2px rgb(0 0 0 / 0.4);
  --shadow-2: 0 12px 32px rgb(0 0 0 / 0.55);

  color-scheme: dark;
}

/* ===== base ===== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: rgb(0 0 0 / 0);
}

h1,
h2,
p,
ul {
  margin: 0;
  padding: 0;
}

button {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.skip-link {
  position: fixed;
  inset-block-start: var(--gutter);
  inset-inline-start: var(--gutter);
  z-index: 60;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  box-shadow: var(--shadow-2);
  color: var(--text);
  transform: translateY(-200%);
  transition: transform 120ms ease, opacity 120ms ease;
  opacity: 0;
  pointer-events: none;
}

.skip-link:focus {
  transform: none;
  opacity: 1;
  pointer-events: auto;
}

/* ===== header ===== */

.topbar {
  position: sticky;
  inset-block-start: 0;
  z-index: 30;
  padding-block: max(6px, env(safe-area-inset-top)) 6px;
  /* Solid first, then the translucent layer: without color-mix (old Safari) the header stays solid instead of transparent. */
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px) saturate(160%);
}

.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: min(100% - var(--gutter) * 2, var(--col));
  margin-inline: auto;
  padding-block: 6px;
  border-bottom: 1px solid var(--border);
}

.brand {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.06em;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 2px;
}

.menu-anchor {
  position: relative;
}

/* ===== icon buttons ===== */

.iconbtn {
  display: inline-grid;
  place-items: center;
  inline-size: var(--tap);
  block-size: var(--tap);
  padding: 0;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: none;
  cursor: pointer;
  transition: background-color 120ms ease, transform 120ms ease;
}

.iconbtn:active {
  transform: scale(0.95);
}

.iconbtn[disabled] {
  opacity: 0.4;
  cursor: default;
  pointer-events: none;
}

.iconbtn .bi {
  font-size: 18px;
}

@media (hover: hover) {
  .iconbtn:hover {
    background: var(--surface-2);
  }
}

/* ===== settings dropdown ===== */

.menu {
  position: absolute;
  inset-block-start: calc(100% + 8px);
  inset-inline-end: 0;
  z-index: 40;
  width: min(330px, calc(100vw - var(--gutter) * 2));
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-2);
}

.field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
}

.field-label {
  flex: 1;
  min-width: 0;
  font-size: 14px;
}

.field select {
  min-inline-size: 132px;
  max-inline-size: 160px;
  padding: 7px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: inherit;
  font: inherit;
  font-size: 16px; /* Safari zooms the page into focused fields smaller than 16px */
}

.sep {
  height: 1px;
  margin: 6px 8px;
  background: var(--border);
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  inline-size: 100%;
  padding: 9px 8px;
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  cursor: pointer;
  text-align: start;
}

@media (hover: hover) {
  .menu-item:hover {
    background: var(--surface-2);
  }
}

/* ===== lists ===== */

.main {
  width: min(100% - var(--gutter) * 2, var(--col));
  margin-inline: auto;
  padding: 12px 0 calc(28px + env(safe-area-inset-bottom));
}

.cl {
  margin-block-end: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-1);
}

.cl-head {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 6px 6px 4px;
}

.cl-heading {
  flex: 1;
  min-width: 0;
  font-size: inherit;
  font-weight: 600;
}

.cl-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  inline-size: 100%;
  padding: 7px 6px;
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  cursor: pointer;
  text-align: start;
}

.cl-toggle .bi {
  flex: none;
  font-size: 13px;
  color: var(--muted);
}

.cl-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.is-muted {
  color: var(--muted);
}

.items {
  list-style: none;
  padding: 0 var(--pad) 8px;
}

.item {
  min-height: 44px;
  padding-inline: 2px;
  border-radius: var(--radius-sm);
}

.item-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding-inline: 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
}

.item-row input[type="checkbox"] {
  inline-size: 19px;
  block-size: 19px;
  flex: none;
  accent-color: var(--accent);
  cursor: pointer;
}

.item-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.item.is-done .item-text {
  color: var(--muted);
}

@media (hover: hover) {
  .cl-toggle:hover,
  .item-row:hover {
    background: var(--surface-2);
  }
}

.cl-empty,
.empty-hint {
  color: var(--muted);
  font-size: 14px;
}

.cl-empty {
  padding: 0 calc(var(--pad) + 8px) 12px;
}

.empty {
  padding: 40px 20px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  text-align: center;
}

.empty-title {
  font-weight: 600;
}

.empty-hint {
  margin-block-start: 4px;
}

.noscript {
  width: min(100% - var(--gutter) * 2, var(--col));
  margin: 16px auto;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}

.notice {
  margin-block-end: 10px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  font-size: 14px;
}

/* ===== inline editor ===== */

.editor {
  flex: 1;
  min-width: 0;
  inline-size: 100%;
  padding: 7px 10px;
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: inherit;
  font: inherit;
  font-size: 16px; /* Safari zooms the page into focused fields smaller than 16px */
}

.editor:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px var(--ring);
}

/* ===== mini panel ===== */

.panel {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  gap: 6px;
  padding-inline-end: max(var(--gutter), env(safe-area-inset-right));
  pointer-events: none;
}

.panel .iconbtn {
  pointer-events: auto;
  inline-size: var(--panel-w);
  block-size: var(--panel-w);
  border-color: var(--border);
  background: var(--surface);
  box-shadow: var(--shadow-1);
}

@media (width >= 840px) {
  /* Past the lists on wide screens: 720px column + room for the panel. */
  .panel {
    padding-inline-end: max(var(--panel-gap), calc((100vw - var(--col)) / 2 - var(--panel-w) - var(--panel-gap)));
  }
}

/* ===== dialogs ===== */

dialog {
  position: fixed;
  inset: 0;
  margin: auto;
  width: min(440px, calc(100vw - var(--gutter) * 2));
  max-height: 80vh;
  max-height: 80svh;
  padding: 20px;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: inherit;
  box-shadow: var(--shadow-2);
}

dialog::backdrop {
  background: rgb(8 10 14 / 0.55);
}

.dialog-title {
  margin-block-end: 8px;
  font-size: 17px;
  font-weight: 700;
}

.dialog-body {
  white-space: pre-line;
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-block-start: 16px;
}

.btn {
  padding: 9px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  cursor: pointer;
}

.btn--accent {
  border-color: transparent;
  background: var(--accent);
  color: var(--accent-contrast);
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: 1ms !important;
    animation-duration: 1ms !important;
  }
}
</style>
</head>

<a class="skip-link" href="#lists">Skip to lists</a>

<header class="topbar">
  <div class="topbar-inner">
    <h1 class="brand">TBD</h1>
    <div class="topbar-actions">
      <button id="btn-add" class="iconbtn" type="button" aria-label="Add checklist" title="Add checklist"><i class="bi bi-plus-lg" aria-hidden="true"></i></button>
      <div class="menu-anchor">

        <div id="settings" class="menu" role="dialog" aria-label="Settings" hidden>

<noscript><p class="noscript">TBD needs JavaScript to run.</p></noscript>

<dialog id="dlg-note" aria-labelledby="note-title">

  <form method="dialog" class="dialog-actions">
    <button class="btn btn--accent" type="submit">Close</button>
  </form>
</dialog>

<script>
/* ===========================================================================
   TBD — one-file todo app. docs/spec.md
   1. utils  2. storage + store  3. data model  4. settings  5. render
   6. actions  7. wiring
   UI strings are English literals; task 2 replaces them with the i18n engine.
   =========================================================================== */
(() => {
  "use strict";

  const doc = document;
  const root = doc.documentElement;
  const $ = (selector, scope = doc) => scope.querySelector(selector);

  /* ---------------------------------------------------------------- utils */

  /* Every node is built in code and every piece of user text goes through
     textContent — user data can never become markup. */
  function setProp(node, key, value) {
    if (key === "class") {
      node.className = [value].flat(1).filter(Boolean).join(" ");
      return;
    }
    if (key === "text") {
      node.textContent = String(value);
      return;
    }
    if (key === "value" || key === "checked" || key === "disabled") {
      node[key] = value;
      return;
    }
    node.setAttribute(key, value === true ? "" : String(value));
  }

  function el(tag, props, ...kids) {
    const node = doc.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value !== null && value !== undefined && value !== false) setProp(node, key, value);
    }
    node.append(...kids.flat().filter((kid) => kid !== null && kid !== undefined && kid !== false)
      .map((kid) => (kid instanceof Node ? kid : doc.createTextNode(String(kid)))));
    return node;
  }

  const icon = (name) => el("i", { class: `bi bi-${name}`, "aria-hidden": "true" });

  function uid() {
    if (window.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
    return `x${Date.now().toString(36)}${Math.random().toString(36).slice(2, 10)}`;
  }

  function asText(value) {
    if (typeof value === "string") return value;
    if (typeof value === "number" && Number.isFinite(value)) return String(value);
    return "";
  }

  function asStamp(value) {
    return typeof value === "number" && Number.isFinite(value) && value > 0 ? value : null;
  }

  /* ---------------------------------------------------- storage + store */

  const KEYS = { data: "tbd.data", settings: "tbd.settings", probe: "tbd.probe" };
  const SCHEMA = 1;

  /* Safari private mode and some file:// contexts throw on localStorage. */
  const memory = new Map();
  const memoryStorage = {
    getItem: (key) => (memory.has(key) ? memory.get(key) : null),
    setItem: (key, value) => { memory.set(key, String(value)); },
    removeItem: (key) => { memory.delete(key); },
  };

  const storage = (() => {
    try {
      const { localStorage } = window;
      localStorage.setItem(KEYS.probe, "1");
      localStorage.removeItem(KEYS.probe);
      return localStorage;
    } catch (error) {
      console.warn("TBD: storage is blocked, this session is kept in memory only.", error);
      return memoryStorage;
    }
  })();

  const memoryOnly = storage === memoryStorage;

  /* Data schema bumps, oldest first. Settings never run these. */
  const DATA_MIGRATIONS = {
    /* 2: (db) => { db.checklists.forEach((cl) => { cl.pinned = false; }); return db; }, */
  };

  function migrate(raw, blank, migrations) {
    if (raw === null || typeof raw !== "object") return blank();
    const from = Number.isFinite(raw.schema) ? raw.schema : 0;
    if (from > SCHEMA) return raw; // newer data: boot() marks the store read-only; the on-screen line says so
    let db = raw;
    for (let version = from + 1; version <= SCHEMA; version += 1) {
      const step = migrations[version];
      if (step) db = step(db) || db;
    }
    db.schema = SCHEMA;
    return db;
  }

  /* Reactive wrapper over storage: read with get(), write with update()/patch(). */
  function createStore(key, blank, normalize, migrations) {
    const listeners = new Set();
    let readOnly = false;
    let writeFailed = false;
    let db = boot();

    function boot() {
      let raw = null;
      try {
        raw = JSON.parse(storage.getItem(key));
      } catch (error) {
        console.warn(`TBD: unreadable ${key}, starting from an empty store.`, error);
      }
      /* Written by a newer build: usable in memory, never written back by this one. */
      readOnly = raw !== null && typeof raw === "object" && raw.schema > SCHEMA;
      try {
        return normalize(migrate(raw, blank, migrations));
      } catch (error) {
        console.warn(`TBD: ${key} could not be repaired, starting from an empty store.`, error);
        return normalize(blank());
      }
    }

    function persist() {
      if (readOnly) return; // never downgrade newer data
      try {
        storage.setItem(key, JSON.stringify(db));
      } catch (error) {
        writeFailed = true;
        console.warn("TBD: could not write to storage, changes stay in this session.", error);
      }
    }

    function commit() {
      persist();
      for (const listener of listeners) listener(db);
    }

    return {
      get: () => db,
      readOnly: () => readOnly,
      blocked: () => writeFailed,
      update(mutate) {
        mutate(db);
        commit();
      },
      /* Like update(), but listeners stay asleep: the caller has already applied
         this change to the DOM itself (see the checkbox handler in bindLists). */
      updateQuiet(mutate) {
        const result = mutate(db);
        persist();
        return result;
      },
      patch(values) {
        Object.assign(db, values);
        commit();
      },
      subscribe(listener) {
        listeners.add(listener);
        return () => listeners.delete(listener);
      },
      reload() {
        db = boot();
        for (const listener of listeners) listener(db);
      },
    };
  }

  /* --------------------------------------------------------- data model */

  /* archivedAt === null means active. An item is hidden while its checklist is
     archived (whole list hidden); items archived before their checklist keep a
     lower archivedAt, so they return only with the checklist (task 5). */
  function blankDB() {
    return { schema: SCHEMA, checklists: [] };
  }

  function makeChecklist() {
    return { id: uid(), title: "", open: true, createdAt: Date.now(), updatedAt: null, archivedAt: null, items: [] };
  }

  function makeItem() {
    return { id: uid(), text: "", done: false, createdAt: Date.now(), updatedAt: null, archivedAt: null };
  }

  function validId(value, ids) {
    const id = asText(value);
    if (id && !ids.has(id)) return id;
    return uid();
  }

  function normalizeItem(raw, ids) {
    if (raw === null || typeof raw !== "object") return null;
    const id = validId(raw.id, ids);
    ids.add(id);
    return {
      id,
      text: asText(raw.text),
      done: raw.done === true,
      createdAt: asStamp(raw.createdAt),
      updatedAt: asStamp(raw.updatedAt),
      archivedAt: asStamp(raw.archivedAt),
    };
  }

  function normalizeChecklist(raw, ids) {
    if (raw === null || typeof raw !== "object") return null;
    const id = validId(raw.id, ids);
    ids.add(id);
    const checklist = {
      id,
      title: asText(raw.title),
      open: raw.open !== false,
      createdAt: asStamp(raw.createdAt),
      updatedAt: asStamp(raw.updatedAt),
      archivedAt: asStamp(raw.archivedAt),
      items: [],
    };
    if (Array.isArray(raw.items)) {
      for (const rawItem of raw.items) {
        const item = normalizeItem(rawItem, ids);
        if (item) checklist.items.push(item);
      }
    }
    return checklist;
  }

  /* Stored data is untrusted: rebuild the shape, drop what is not an entity. */
  function normalizeDB(raw) {
    const db = blankDB();
    const ids = new Set();
    if (raw !== null && typeof raw === "object" && Array.isArray(raw.checklists)) {
      for (const rawChecklist of raw.checklists) {
        const checklist = normalizeChecklist(rawChecklist, ids);
        if (checklist) db.checklists.push(checklist);
      }
    }
    return db;
  }

  /* ----------------------------------------------------------- settings */

  const LANGS = ["ru", "bg", "en", "fr", "es", "ro", "zh", "ja", "eo", "ia", "tok"];
  const SETTING_SPECS = {
    theme: { default: "system", values: ["system", "dark", "light"] },
    language: { default: "auto", values: ["auto", ...LANGS] },
    checklistPosition: { default: "top", values: ["top", "bottom"] },
    itemPosition: { default: "bottom", values: ["top", "bottom"] },
    // shortcut: pageSize is stored but not applied yet, task 2 adds pagination.
    pageSize: { default: 20, numeric: true, values: ["all", 10, 20, 30, 50, 80, 130, 210] },
  };

  /* Captions for the <option>s, which are built from SETTING_SPECS; task 2 moves these into i18n. */
  const POSITION_LABELS = { top: "Above all", bottom: "Below all" };
  const OPTION_LABELS = {
    theme: { system: "System", dark: "Dark", light: "Light" },
    language: { auto: "Auto", ru: "Русский", bg: "Български", en: "English", fr: "Français", es: "Español", ro: "Română", zh: "中文", ja: "日本語", eo: "Esperanto", ia: "Interlingua", tok: "toki pona" },
    checklistPosition: POSITION_LABELS,
    itemPosition: POSITION_LABELS,
    pageSize: { all: "All" },
  };

  function castSetting(name, value) {
    const spec = SETTING_SPECS[name];
    if (!spec) return value;
    let next = asText(value);
    if (spec.numeric && next !== "all") next = Number(value);
    if (spec.values.includes(next)) return next;
    return spec.default;
  }

  function blankSettings() {
    const out = { schema: SCHEMA };
    for (const name of Object.keys(SETTING_SPECS)) out[name] = SETTING_SPECS[name].default;
    return out;
  }

  function normalizeSettings(raw) {
    const source = raw !== null && typeof raw === "object" ? raw : {};
    const out = { schema: SCHEMA };
    for (const name of Object.keys(SETTING_SPECS)) out[name] = castSetting(name, source[name]);
    return out;
  }

  const data = createStore(KEYS.data, blankDB, normalizeDB, DATA_MIGRATIONS);
  const settingsStore = createStore(KEYS.settings, blankSettings, normalizeSettings, {});

  const db = () => data.get();
  const settings = () => settingsStore.get();
  const activeChecklists = () => db().checklists.filter((checklist) => checklist.archivedAt === null);

  /* Transient UI state, never persisted. */
  const ui = { editing: null, focusEditor: false, settingsOpen: false };

  /* ------------------------------------------------------- dom handles */

  const mainEl = $("#lists");
  const listsEl = $("#list-items");
  const storageWarnEl = $("#storage-warning");
  const settingsBtn = $("#btn-settings");
  const settingsMenu = $("#settings");
  const noteDialog = $("#dlg-note");
  const expandBtn = $("#btn-expand-all");
  const collapseBtn = $("#btn-collapse-all");
  const selects = {
    theme: $("#set-theme"),
    language: $("#set-language"),
    checklistPosition: $("#set-checklist"),
    itemPosition: $("#set-item"),
    pageSize: $("#set-page-size"),
  };
  const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");

  /* ----------------------------------------------------------- render */

  const UNTITLED = "Untitled";

  function editorNode(edit, value, label) {
    const input = el("input", {
      class: "editor", type: "text", value, maxlength: "4000", enterkeyhint: "done",
      spellcheck: "false", autocomplete: "off", "aria-label": label,
    });
    input.addEventListener("keydown", (event) => {
      if (event.isComposing) return; // Enter commits an IME candidate (zh/ja), not the text
      if (event.key === "Enter") {
        event.preventDefault();
        endEdit(edit, input.value, false, true);
      } else if (event.key === "Escape") {
        event.preventDefault();
        endEdit(edit, "", true, false);
      }
    });
    /* The click that moved focus away was aimed at the DOM from before the save.
       Committing after it has landed keeps that click from missing its button.
       endEdit ignores the second call when both the click and the timer fire. */
    input.addEventListener("blur", () => {
      const commit = () => {
        doc.removeEventListener("click", commit, true);
        endEdit(edit, input.value, false, false);
      };
      doc.addEventListener("click", commit, { capture: true, once: true });
      setTimeout(commit, 600); // blur without a click (Tab, re-render); slack for a slow synthesized tap
    });
    return input;
  }

  const editingFor = (kind, id) => (ui.editing && ui.editing.kind === kind && ui.editing.id === id ? ui.editing : null);

  const allDone = (checklist) => checklist.items.length > 0 && checklist.items.every((item) => item.done);

  function checklistHeading(checklist) {
    const edit = editingFor("checklist", checklist.id);
    if (edit) return editorNode(edit, checklist.title, "Checklist title");
    const muted = allDone(checklist);
    const chevron = el("i", { class: `bi bi-chevron-${checklist.open ? "up" : "right"}`, "aria-hidden": "true" });
    const title = el("span", { class: ["cl-title", muted && "is-muted"], text: checklist.title || UNTITLED });
    return el("button", {
      class: "cl-toggle",
      type: "button",
      "data-act": "toggle",
      "aria-expanded": checklist.open ? "true" : "false",
      title: checklist.title || UNTITLED,
    }, chevron, title);
  }

  function itemRow(checklist, item) {
    const edit = editingFor("item", item.id);
    if (edit) return el("li", { class: "item", "data-id": item.id }, editorNode(edit, item.text, "Item text"));
    const box = el("input", { type: "checkbox", checked: item.done, "aria-label": item.text || UNTITLED });
    const text = el("span", { class: "item-text", title: item.text || UNTITLED, text: item.text || UNTITLED });
    return el("li", { class: ["item", item.done && "is-done"], "data-id": item.id },
      el("label", { class: "item-row" }, box, text));
  }

  /* A brand-new item shows here as an editor row before it exists in the store. */
  function visibleItems(checklist) {
    const items = checklist.items.filter((item) => item.archivedAt === null);
    const edit = ui.editing;
    if (edit && edit.kind === "item" && edit.parentId === checklist.id) {
      if (settings().itemPosition === "top") items.unshift(edit.entity);
      else items.push(edit.entity);
    }
    return items;
  }

  function checklistBody(checklist) {
    const items = visibleItems(checklist);
    if (!items.length) return el("p", { class: "cl-empty", text: "No items yet." });
    return el("ul", { class: "items" }, items.map((item) => itemRow(checklist, item)));
  }

  function checklistNode(checklist) {
    const addBtn = checklist.open
      ? el("button", { class: "iconbtn", type: "button", "data-act": "add-item", "aria-label": "Add item", title: "Add item" }, icon("plus-lg"))
      : null;
    const head = el("div", { class: "cl-head" }, el("h2", { class: "cl-heading" }, checklistHeading(checklist)), addBtn);
    return el("section", { class: "cl", "data-id": checklist.id }, head, checklist.open ? checklistBody(checklist) : null);
  }

  function emptyState() {
    const title = el("p", { class: "empty-title", text: "Nothing here yet" });
    const hint = el("p", { class: "empty-hint", text: "Press + in the header to create your first checklist." });
    return el("div", { class: "empty" }, title, hint);
  }

  /* Re-rendering swaps nodes, so remember what had focus and put it back. */
  function captureFocus() {
    const active = doc.activeElement;
    const holder = active && active.closest("[data-id]");
    if (!holder || !listsEl.contains(holder)) return null;
    return { id: holder.dataset.id, checkbox: active.matches('input[type="checkbox"]') };
  }

  function restoreFocus(target) {
    if (!target) return;
    const holder = listsEl.querySelector(`[data-id="${CSS.escape(target.id)}"]`);
    if (!holder) {
      mainEl.focus(); // its row is gone: keep the keyboard in the page, not in <body>
      return;
    }
    const node = target.checkbox ? holder.querySelector('input[type="checkbox"]') : holder.querySelector("button, input");
    if (node) node.focus();
  }

  function renderLists() {
    const previous = captureFocus();
    const checklists = activeChecklists();
    const edit = ui.editing;
    if (edit && edit.kind === "checklist") {
      /* A brand-new checklist: drawn at its settings position, but not stored yet. */
      if (settings().checklistPosition === "bottom") checklists.push(edit.entity);
      else checklists.unshift(edit.entity);
    }
    listsEl.replaceChildren(...(checklists.length ? checklists.map(checklistNode) : [emptyState()]));
    if (ui.focusEditor) {
      ui.focusEditor = false;
      const input = $(".editor", listsEl);
      if (input) {
        input.focus();
        input.select();
        return;
      }
    }
    restoreFocus(previous);
  }

  function renderToolbar() {
    const checklists = activeChecklists();
    const open = checklists.filter((checklist) => checklist.open).length;
    const focused = [expandBtn, collapseBtn].find((btn) => doc.activeElement === btn);
    expandBtn.disabled = open === checklists.length;
    collapseBtn.disabled = open === 0;
    /* Disabling the focused button drops the keyboard to <body>; hand it to the sibling. */
    if (focused && focused.disabled) (focused === expandBtn ? collapseBtn : expandBtn).focus();
  }

  function syncSettingsForm() {
    for (const [name, select] of Object.entries(selects)) select.value = String(settings()[name]);
  }

  /* Without a visible line, changes that silently never reach storage would just vanish. */
  const SAVE_MSG = {
    newer: "This data was saved by a newer version of TBD. Changes made here cannot be saved.",
    blocked: "TBD cannot save changes. Anything you add or edit will be gone when you close this tab.",
  };

  function renderStorageWarning() {
    let msg = "";
    if (data.readOnly() || settingsStore.readOnly()) msg = SAVE_MSG.newer;
    else if (memoryOnly || data.blocked() || settingsStore.blocked()) msg = SAVE_MSG.blocked;
    storageWarnEl.textContent = msg;
    storageWarnEl.hidden = !msg;
  }

  function render() {
    renderLists();
    renderToolbar();
    syncSettingsForm();
    renderStorageWarning();
  }

  /* --------------------------------------------------------- appearance */

  function applyTheme() {
    const mode = settings().theme;
    let dark;
    if (mode === "dark") dark = true;
    else if (mode === "light") dark = false;
    else dark = darkQuery.matches;
    root.dataset.theme = dark ? "dark" : "light";
    // One source for the color: the --bg token of the theme just switched to.
    $('meta[name="theme-color"]').content = getComputedStyle(root).getPropertyValue("--bg").trim();
  }

  function applyLanguage() {
    const wanted = settings().language;
    if (wanted !== "auto") {
      root.lang = wanted;
      return;
    }
    const tags = (window.navigator.languages || []).concat(window.navigator.language || []);
    for (const tag of tags) {
      const code = String(tag).toLowerCase().split("-")[0];
      if (LANGS.includes(code)) {
        root.lang = code;
        return;
      }
    }
    root.lang = "en";
  }

  /* ----------------------------------------------------------- actions */

  /* A brand-new entity lives in memory until its first text, so an abandoned
     "+" leaves nothing behind — not even after a reload. */
  function addChecklist() {
    const entity = makeChecklist();
    ui.editing = { kind: "checklist", id: entity.id, fresh: true, entity };
    ui.focusEditor = true;
    render();
  }

  function addItem(checklistId) {
    if (!db().checklists.some((row) => row.id === checklistId)) return; // e.g. a new checklist abandoned a moment ago
    const entity = makeItem();
    ui.editing = { kind: "item", id: entity.id, fresh: true, parentId: checklistId, entity };
    ui.focusEditor = true;
    render();
  }

  function toggleChecklist(checklistId) {
    data.update((store) => {
      const checklist = store.checklists.find((row) => row.id === checklistId);
      if (!checklist) return;
      checklist.open = !checklist.open;
      checklist.updatedAt = Date.now();
    });
  }

  /* Quiet on purpose: the click handler ticks the box and swaps the classes in
     place, so marking done does not pay for a full re-render.
     shortcut: re-measure when pagination (task 2) lands. */
  function toggleItem(itemId) {
    return data.updateQuiet((store) => {
      for (const checklist of store.checklists) {
        const item = checklist.items.find((row) => row.id === itemId);
        if (item) {
          item.done = !item.done;
          item.updatedAt = Date.now();
          return { item, checklist };
        }
      }
      return null;
    });
  }

  function setAllOpen(open) {
    data.update((store) => {
      const stamp = Date.now();
      for (const checklist of store.checklists) {
        if (checklist.archivedAt !== null || checklist.open === open) continue;
        checklist.open = open;
        checklist.updatedAt = stamp;
      }
    });
  }

  function locate(store, edit) {
    if (edit.kind === "checklist") {
      return { list: store.checklists, index: store.checklists.findIndex((row) => row.id === edit.id) };
    }
    for (const checklist of store.checklists) {
      const index = checklist.items.findIndex((row) => row.id === edit.id);
      if (index !== -1) return { list: checklist.items, index };
    }
    return { list: null, index: -1 };
  }

  function insertFresh(edit, text) {
    const entity = edit.entity;
    entity[edit.kind === "checklist" ? "title" : "text"] = text;
    entity.updatedAt = Date.now();
    data.update((store) => {
      if (edit.kind === "checklist") {
        if (settings().checklistPosition === "bottom") store.checklists.push(entity);
        else store.checklists.unshift(entity);
        return;
      }
      const checklist = store.checklists.find((row) => row.id === edit.parentId);
      if (!checklist) return; // its checklist disappeared in another tab
      if (settings().itemPosition === "top") checklist.items.unshift(entity);
      else checklist.items.push(entity);
    });
  }

  /* Enter/blur save, Escape discards. Enter on a brand-new item opens the next
     one right away, so a whole list can be typed without reaching for "+". */
  function endEdit(edit, value, discard, keep) {
    if (edit.settled) return; // the deferred blur save of an already-closed editor
    edit.settled = true;
    if (ui.editing === edit) ui.editing = null;
    if (discard) {
      render(); // Escape cancels: the stored text is neither read nor overwritten
      return;
    }
    const text = value.trim();
    if (edit.fresh) {
      if (!text) {
        render(); // nothing was ever stored, the editor simply goes away
        return;
      }
      if (keep && edit.kind === "item") {
        const next = makeItem();
        ui.editing = { kind: "item", id: next.id, fresh: true, parentId: edit.parentId, entity: next };
        ui.focusEditor = true;
      }
      insertFresh(edit, text);
      return;
    }
    data.update((store) => {
      const { list, index } = locate(store, edit);
      if (!list || index === -1) return;
      const entity = list[index];
      entity[edit.kind === "checklist" ? "title" : "text"] = text;
      entity.updatedAt = Date.now();
    });
  }

  /* ------------------------------------------------------------ dialogs */

  function showDialog(dialog) {
    if (typeof dialog.showModal === "function") {
      dialog.showModal();
      return;
    }
    dialog.setAttribute("open", ""); // old Safari: visible, non-modal
    dialog.scrollIntoView({ block: "center" });
  }

  function openNote(title, body) {
    $("#note-title").textContent = title;
    $("#note-body").textContent = body;
    showDialog(noteDialog);
  }

  const HELP_TEXT = [
    "TBD keeps your lists in this browser — nothing is uploaded anywhere.",
    "Press + in the header to add a checklist, then type its name and press Enter.",
    "Press the + at the right of an open checklist to add items.",
    "Tick an item when it is done; finished things turn grey.",
    "Use the buttons on the right to open or close every checklist at once.",
    "The gear holds theme, language, where new things are added, and page size.",
  ].join("\n");

  /* ------------------------------------------------------------ wiring */

  function setSettingsOpen(open) {
    ui.settingsOpen = open;
    settingsMenu.hidden = !open;
    settingsBtn.setAttribute("aria-expanded", open ? "true" : "false");
    /* aria-controls only while the menu is open: pointing it at a hidden node trips axe. */
    if (open) settingsBtn.setAttribute("aria-controls", "settings");
    else settingsBtn.removeAttribute("aria-controls");
    if (open) selects.theme.focus();
  }

  function bindHeader() {
    $("#btn-add").addEventListener("click", () => addChecklist());
    settingsBtn.addEventListener("click", () => setSettingsOpen(!ui.settingsOpen));
    $("#btn-help").addEventListener("click", () => openNote("How to use TBD", HELP_TEXT));
    $("#btn-archive").addEventListener("click", () => {
      setSettingsOpen(false);
      // shortcut: the archive screen is task 5; until then the button says so.
      openNote("Archive", "The archive is not in this build yet. It will arrive in a later version of TBD.");
    });
    /* The open menu is a dialog: Tab must circle inside it, not leak to the header —
       listener on the document, because focus can escape to body via a click on a gap. */
    doc.addEventListener("keydown", (event) => {
      if (event.key !== "Tab" || !ui.settingsOpen) return;
      const nodes = [...settingsMenu.querySelectorAll("select, button")];
      const first = nodes[0];
      const last = nodes[nodes.length - 1];
      if (!settingsMenu.contains(doc.activeElement)) {
        event.preventDefault(); // focus slipped out (gear, gap click): pull it back in
        (event.shiftKey ? last : first).focus();
        return;
      }
      if (!event.shiftKey && doc.activeElement === last) {
        event.preventDefault();
        first.focus();
      } else if (event.shiftKey && doc.activeElement === first) {
        event.preventDefault();
        last.focus();
      }
    });
    doc.addEventListener("click", (event) => {
      if (!ui.settingsOpen || event.target.closest("#settings, #btn-settings")) return;
      setSettingsOpen(false);
    });
    doc.addEventListener("keydown", (event) => {
      if (event.key !== "Escape" || !ui.settingsOpen) return;
      setSettingsOpen(false);
      settingsBtn.focus();
    });
  }

  function bindToolbar() {
    expandBtn.addEventListener("click", () => setAllOpen(true));
    collapseBtn.addEventListener("click", () => setAllOpen(false));
  }

  function bindLists() {
    /* Click, not change: a click already in flight while the list re-renders
       still reaches this handler; the change event it fires would not. */
    listsEl.addEventListener("click", (event) => {
      const box = event.target.closest('input[type="checkbox"]');
      if (box) {
        const row = box.closest("[data-id]");
        if (!row) return;
        const changed = toggleItem(row.dataset.id);
        if (!changed) return;
        if (!listsEl.contains(row)) {
          render(); // this very click's blur-commit rebuilt the list: show the just-saved state
          return;
        }
        /* The browser already ticked the box and only classes follow, so set
           them in place instead of re-rendering every list (the hot path). */
        row.classList.toggle("is-done", changed.item.done);
        const title = row.closest(".cl")?.querySelector(".cl-title");
        if (title) title.classList.toggle("is-muted", allDone(changed.checklist));
        if (data.blocked()) renderStorageWarning(); // a write failure must still get its line
        return;
      }
      const trigger = event.target.closest("[data-act]");
      if (!trigger) return;
      const holder = trigger.closest("[data-id]");
      if (!holder) return;
      if (trigger.dataset.act === "toggle") toggleChecklist(holder.dataset.id);
      else if (trigger.dataset.act === "add-item") addItem(holder.dataset.id);
    });
  }

  function bindSettings() {
    for (const [name, select] of Object.entries(selects)) {
      /* Options come from SETTING_SPECS alone: a value the cast accepts can
         never be missing from the <select> (and vice versa). */
      const labels = OPTION_LABELS[name];
      select.replaceChildren(...SETTING_SPECS[name].values.map((value) => el("option", {
        value: String(value), text: labels?.[value] ?? String(value),
      })));
      select.addEventListener("change", () => settingsStore.patch({ [name]: castSetting(name, select.value) }));
    }
  }

  function init() {
    bindHeader();
    bindToolbar();
    bindLists();
    bindSettings();
    settingsStore.subscribe(() => {
      applyTheme();
      applyLanguage();
      syncSettingsForm();
      renderStorageWarning();
    });
    data.subscribe(render);
    darkQuery.addEventListener("change", () => {
      if (settings().theme === "system") applyTheme();
    });
    /* Keep two open tabs in sync (fires for the other tabs only). */
    window.addEventListener("storage", (event) => {
      /* A data reload rebuilds the lists and destroys the open editor, losing
         the text being typed — a stale view beats lost keystrokes.
         shortcut: task 2's targeted list updates remove this. Settings never
         touch the editor, so they keep syncing live. */
      if (event.key === KEYS.data) {
        if (!ui.editing) data.reload();
      } else if (event.key === KEYS.settings) settingsStore.reload();
    });
    applyTheme();
    applyLanguage();
    render();
  }

  init();
})();
</script>
</body>
</html>
