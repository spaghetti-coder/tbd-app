<!DOCTYPE html>
<html lang="en" data-theme="system" class="icons-off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234a5cff'/><path d='M9 17l5 5 9-11' fill='none' stroke='%23fff' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<title>TBD</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #fff;
    --surface-2: #eceef2;
    --surface-3: #e0e3e9;
    --text: #12151a;
    --muted: #687080;
    --line: #e1e4ea;
    --accent: #4a5cff;
    --accent-soft: rgb(74 92 255 / 0.14);
    --on-accent: #fff;
    --danger: #d1453b;
    --shadow: 0 1px 2px rgb(16 20 28 / 0.07), 0 12px 32px rgb(16 20 28 / 0.10);
    --shadow-drag: 0 2px 6px rgb(16 20 28 / 0.14), 0 18px 44px rgb(16 20 28 / 0.22);
    --gutter: clamp(12px, 4vw, 20px);
    --wrap: 720px;
    --topbar-h: calc(56px + env(safe-area-inset-top));
    --safe-left: env(safe-area-inset-left);
    --safe-right: env(safe-area-inset-right);
    --r: 14px;
    --r-sm: 10px;
    --ic: 20px;
    --dur: 180ms;
    --gap: 10px;

    color-scheme: light;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;

    /* stylelint-disable-next-line property-no-vendor-prefix */
    -webkit-text-size-adjust: 100%;
  }

  [data-theme="dark"] {
    --bg: #0e1116;
    --surface: #171b21;
    --surface-2: #22272f;
    --surface-3: #2c323b;
    --text: #e8eaf0;
    --muted: #8b94a3;
    --line: #262c35;
    --accent: #8091ff;
    --accent-soft: rgb(128 145 255 / 0.20);
    --on-accent: #0e1116;
    --danger: #f0776c;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.5), 0 12px 32px rgb(0 0 0 / 0.45);
    --shadow-drag: 0 2px 6px rgb(0 0 0 / 0.55), 0 20px 48px rgb(0 0 0 / 0.6);

    color-scheme: dark;
  }

  [data-theme="light"] {
    color-scheme: light;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
  }

  /* The viewport edge stays put when a modal locks scrolling and the scrollbar goes away. */
  html {
    scrollbar-gutter: stable;
  }

  body {
    min-height: 100dvh;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }

  html.is-locked {
    overflow: hidden;
  }

  /* No overflow on body: a frozen scroll container there would steal the sticky card heads. */
  html.is-locked body {
    padding-top: var(--topbar-h);
  }

  html.is-locked .topbar {
    inset-inline: 0;
    position: fixed;
    top: 0;
  }

  /* Rows are drag controls; Chrome decides long-press selectability at touchstart, before JS. */
  .lists,
  html.is-dragging,
  html.is-dragging * {
    /* stylelint-disable property-no-vendor-prefix */
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    /* stylelint-enable property-no-vendor-prefix */
    user-select: none;
  }

  h1,
  h2,
  h3,
  p,
  ul,
  ol {
    margin: 0;
  }

  ul {
    list-style: none;
    padding: 0;
  }

  button {
    background: none;
    border: 0;
    color: inherit;
    font: inherit;
    margin: 0;
    padding: 0;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  [hidden] {
    display: none !important;
  }

  input,
  textarea {
    color: inherit;
    font: inherit;
  }

  .ic {
    background: currentcolor;
    display: block;
    flex: none;
    height: var(--ic);
    mask-position: center;
    mask-repeat: no-repeat;
    mask-size: contain;
    width: var(--ic);
  }

  .ic--plus { mask-image: var(--ic-plus, none); }
  .ic--settings { mask-image: var(--ic-settings, none); }
  .ic--logout { mask-image: var(--ic-logout, none); }
  .ic--help { mask-image: var(--ic-help, none); }
  .ic--chevron-right { mask-image: var(--ic-chevron-right, none); }
  .ic--chevron-down { mask-image: var(--ic-chevron-down, none); }
  .ic--chevron-left { mask-image: var(--ic-chevron-left, none); }
  .ic--pencil { mask-image: var(--ic-pencil, none); }
  .ic--menu { mask-image: var(--ic-menu, none); }
  .ic--archive { mask-image: var(--ic-archive, none); }
  .ic--restore { mask-image: var(--ic-restore, none); }
  .ic--trash { mask-image: var(--ic-trash, none); }
  .ic--top { mask-image: var(--ic-top, none); }
  .ic--bottom { mask-image: var(--ic-bottom, none); }
  .ic--expand { mask-image: var(--ic-expand, none); }
  .ic--collapse { mask-image: var(--ic-collapse, none); }
  .ic--check { mask-image: var(--ic-check, none); }
  .ic--close { mask-image: var(--ic-close, none); }
  .ic--bulk { mask-image: var(--ic-bulk, none); }
  .ic--grip-vertical { mask-image: var(--ic-grip-vertical, none); }
  .ic--grip-horizontal { mask-image: var(--ic-grip-horizontal, none); }

  /* Fallback glyphs. The document starts at .icons-off, so these show until a CDN answers. */
  .ic-alt {
    display: block;
    font-size: 18px;
    line-height: 1;
    text-align: center;
    width: var(--ic);
  }

  .icons-off .ic {
    display: none;
  }

  .icons-on .ic-alt {
    display: none;
  }

  .btn {
    align-items: center;
    border-radius: 50%;
    display: inline-flex;
    height: 40px;
    justify-content: center;
    transition: background var(--dur) ease;
    width: 40px;
  }

  .btn:disabled,
  .menu-list__item:disabled {
    color: var(--muted);
    opacity: 0.4;
    pointer-events: none;
  }

  .btn--danger {
    color: var(--danger);
  }

  .topbar {
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    height: var(--topbar-h);
    padding: env(safe-area-inset-top) var(--gutter) 0;
    position: sticky;
    top: 0;
    z-index: 30;
  }

  .topbar__inner {
    align-items: center;
    display: flex;
    gap: 6px;
    height: 56px;
    margin-inline: auto;
    /* Same box as the card content inside .wrap, so header and cards share edges. */
    max-width: calc(var(--wrap) - var(--gutter) * 2);
  }

  .topbar__title {
    flex: 1;
    font-size: 20px;
    font-weight: 650;
    letter-spacing: 0.04em;
    min-width: 0;
  }

  .wrap {
    margin-inline: auto;
    max-width: var(--wrap);
    padding: var(--gap) var(--gutter) 40px;
  }

  .lists {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  .card__empty,
  .empty {
    border: 1px dashed var(--line);
    color: var(--muted);
    text-align: center;
  }

  .empty {
    border-radius: var(--r);
    padding: 22px 18px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
  }

  .card__head {
    border-radius: var(--r);
    position: sticky;
    top: var(--topbar-h);
    touch-action: pan-y;
    z-index: 2;
  }

  .card__row,
  .item__row {
    align-items: center;
    background: var(--surface);
    display: flex;
    gap: 2px;
    position: relative;
    transition: transform var(--dur) ease;
    z-index: 1;
  }

  .card__row {
    border-radius: inherit;
    min-height: 52px;
    padding: 2px 4px 2px 6px;
  }

  .card.is-open > .card__head {
    border-radius: var(--r) var(--r) 0 0;
  }

  .card__title {
    cursor: pointer;
    flex: 1;
    font-weight: 600;
    min-width: 0;
    overflow: hidden;
    padding-block: 6px;
    text-overflow: ellipsis;
    white-space: nowrap;

    /* The target spans the whole field, so WebKit's gray tap flash reads as a glitch. */
    -webkit-tap-highlight-color: transparent;
  }

  .card.is-muted > .card__head .card__title {
    color: var(--muted);
  }

  .card__body {
    border-top: 1px solid var(--line);
    padding: 4px;
  }

  .card__empty {
    border-radius: var(--r-sm);
    padding: 14px;
  }

  .items {
    display: flex;
    flex-direction: column;
  }

  .item {
    position: relative;
    touch-action: pan-y;
  }

  .item__row {
    border-radius: var(--r-sm);
    min-height: 44px;
    padding: 0 4px 0 6px;
  }

  .item__text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    padding-block: 4px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .item.is-done .item__text {
    color: var(--muted);
  }

  .swipe-bg {
    align-items: center;
    border-radius: var(--r-sm);
    bottom: 2px;
    color: var(--muted);
    display: flex;
    opacity: 0;
    padding-inline: 14px;
    position: absolute;
    top: 2px;
  }

  .swipe-bg--left {
    right: 0;
  }

  .swipe-bg--right {
    left: 0;
  }

  .act,
  .mark {
    align-items: center;
    display: inline-flex;
    flex: none;
    height: 44px;
    justify-content: center;
    width: 44px;
  }

  .mark__box {
    align-items: center;
    border: 2px solid var(--muted);
    border-radius: 6px;
    color: var(--on-accent);
    display: inline-flex;
    height: 20px;
    justify-content: center;
    width: 20px;
  }

  .mark__box .ic,
  .mark__box .ic-alt {
    --ic: 14px;
  }

  .mark--bulk .mark__box {
    border-color: var(--accent);
  }

  .is-on .mark__box {
    background: var(--accent);
    border-color: var(--accent);
  }

  .is-on.mark--check .mark__box {
    background: var(--muted);
    border-color: var(--muted);
  }

  .act {
    color: var(--muted);
    transition: color var(--dur) ease;
  }

  .row-edit {
    align-items: center;
    display: flex;
    flex: 1;
    gap: 4px;
    min-width: 0;
    padding-block: 6px;
  }

  .input {
    background: var(--surface-2);
    border: 1px solid transparent;
    border-radius: 8px;
    flex: 1;
    min-width: 0;
    padding: 7px 10px;

    /* stylelint-disable-next-line property-no-vendor-prefix */
    -webkit-user-select: auto;
    user-select: auto;
  }

  .input:focus {
    border-color: var(--accent);
    outline: none;
  }

  .act--save {
    color: var(--accent);
  }

  .drop-gap {
    border: 2px dashed var(--accent);
    border-radius: var(--r-sm);
    flex: none;
  }

  /* Held over a collapsed list: the placeholder keeps its height, so nothing below it jumps. */
  .drop-gap.is-standby {
    border-color: transparent;
  }

  /* Drop state on a collapsed checklist head; the bar shows the hold-to-expand progress. */
  .card.is-drop-hover > .card__head::after {
    animation: fill var(--hover-ms) linear forwards;
    background: var(--accent);
    border-radius: inherit;
    bottom: 0;
    content: "";
    height: 3px;
    left: 0;
    position: absolute;
  }

  .is-drag-src {
    display: none;
  }

  .drag-clone {
    left: 0;
    opacity: 0.95;
    pointer-events: none;
    position: fixed;
    top: 0;
    z-index: 60;
  }

  .drag-clone > * {
    box-shadow: var(--shadow-drag);
    margin: 0;
  }

  .is-flash {
    animation: flash 900ms ease-out;
  }

  @keyframes fill {
    from {
      width: 0;
    }

    to {
      width: 100%;
    }
  }

  @keyframes flash {
    from {
      background: var(--accent-soft);
    }

    to {
      background: transparent;
    }
  }

  .pager {
    align-items: center;
    background: var(--bg);
    bottom: max(0px, env(safe-area-inset-bottom));
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 14px;
    padding-block: 10px;
    position: sticky;
    z-index: 3;
  }

  .pager__nav {
    display: flex;
    gap: 4px;
  }

  .pager__info {
    color: var(--muted);
    font-size: 14px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 5px;
    position: fixed;
    top: 0;
    touch-action: none;
    transition: transform var(--dur) ease;
    /* stylelint-disable property-no-vendor-prefix */
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    /* stylelint-enable property-no-vendor-prefix */
    user-select: none;
    z-index: 25;
  }

  .panel.is-hidden {
    display: none;
  }

  .panel.is-collapsed .btn {
    width: 26px;
  }

  .panel__group {
    align-items: center;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .panel__sep {
    background: var(--line);
    flex-shrink: 0;
    height: 1px;
    margin: 2px 8px;
  }

  .panel.is-dragging {
    transition: none;
  }

  .panel-ghost {
    background: var(--accent);
    border-radius: 999px;
    opacity: 0.28;
    pointer-events: none;
    position: fixed;
    z-index: 24;
  }

  /* The pill lies down only when the vertical band cannot hold it. */
  .panel.is-row {
    flex-direction: row;
  }

  .panel.is-row .panel__group {
    flex-direction: row;
  }

  /* Centered cross axis would collapse an auto-sized separator to nothing. */
  .panel.is-row .panel__sep {
    align-self: stretch;
    height: auto;
    margin: 8px 2px;
    width: 1px;
  }

  .modal {
    animation: pop 160ms ease-out;
    background: var(--surface);
    border: 0;
    border-radius: var(--r);
    box-shadow: var(--shadow);
    color: var(--text);
    height: fit-content;
    inset: 0;
    margin: auto;
    max-width: min(460px, calc(100vw - 28px));
    padding: 18px;
    position: fixed;
    width: max-content;
  }

  .modal::backdrop {
    animation: fade 140ms ease-out;
    background: rgb(8 10 14 / 0.5);
  }

  /* The inline top/left set after showModal place the popup; the auto edges keep the base centering from fighting them. */
  .modal--anchored {
    bottom: auto;
    max-height: calc(100dvh - 16px);
    overflow-y: auto;
    right: auto;
  }

  .modal--anchored::backdrop {
    animation: none;
    background: none;
  }

  .modal--sheet {
    border-radius: 0;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    inset: 0;
    margin: 0;
    max-height: none;
    max-width: none;
    overflow: auto;
    padding: max(18px, env(safe-area-inset-top)) var(--gutter) 0;
    width: 100vw;
  }

  .modal--picker {
    border: 1px solid var(--line);
    max-width: min(320px, calc(100vw - 16px));
    padding: 6px;
  }

  .modal__title {
    font-size: 18px;
    font-weight: 650;
    margin-bottom: 12px;
    overflow-wrap: anywhere;
  }

  .modal--sheet .modal__title {
    text-align: center;
  }

  .modal__body {
    color: var(--text);
    overflow-wrap: anywhere;
    white-space: pre-line;
  }

  .modal--sheet .modal__body,
  .sheet-body {
    display: flex;
    flex: 1;
    flex-direction: column;
  }

  .modal__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 18px;
  }

  /* Sticky bottoms sit on the scroller's content box, so the sheet carries no bottom padding of its own. */
  .modal--sheet .modal__actions {
    background: var(--surface);
    bottom: 0;
    margin-top: auto;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    padding-top: 12px;
    position: sticky;
  }

  .menu-list {
    display: flex;
    flex-direction: column;
  }

  .menu-list__item,
  .rows__row {
    align-items: center;
    border-radius: var(--r-sm);
    display: flex;
    gap: 10px;
    text-align: start;
  }

  .menu-list__item {
    padding: 11px 10px;
    width: 100%;
  }

  .menu-list__sep {
    background: var(--line);
    height: 1px;
    margin-block: 6px;
  }

  .picker__option[aria-selected="true"] {
    color: var(--accent);
  }

  .tabs {
    background: var(--surface-2);
    border-radius: 999px;
    display: inline-flex;
    gap: 2px;
    margin-bottom: 14px;
    padding: 3px;
  }

  .tabs__tab {
    border-radius: 999px;
    padding: 7px 16px;
  }

  .tabs__tab.is-active {
    background: var(--surface);
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.12);
  }

  .rows {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: 18px;
  }

  .rows__row {
    padding: 8px 6px;
  }

  .modal--dropdown {
    border: 1px solid var(--line);
    padding: 12px 14px 14px;
    width: min(320px, calc(100vw - 16px));
  }

  /* One grid for the whole settings panel: labels share the first column, controls the second,
     so every closed picker gets the same width. */
  .fields {
    align-items: center;
    display: grid;
    gap: 14px 10px;
    grid-template-columns: minmax(0, 1fr) auto;
    padding-block: 7px;
  }

  .field {
    display: contents;
  }

  .field__label {
    color: var(--muted);
    font-size: 14px;
  }

  .picker {
    align-items: center;
    background: var(--surface-2);
    border-radius: var(--r-sm);
    display: inline-flex;
    gap: 6px;
    justify-content: space-between;
    min-height: 40px;
    padding: 6px 10px;
  }

  .picker > :first-child,
  .picker__option > :first-child,
  .rows__label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .picker__option > :first-child,
  .rows__label {
    flex: 1;
  }

  .seg {
    background: var(--surface-2);
    border-radius: 999px;
    display: inline-flex;
    justify-self: end;
    min-width: 0;
    padding: 2px;
    position: relative;
  }

  .seg label {
    position: relative;
  }

  .seg input {
    appearance: none;
    inset: 0;
    position: absolute;
  }

  .seg span {
    border-radius: 999px;
    display: block;
    padding: 5px 12px;
  }

  .seg input:checked + span {
    background: var(--accent);
    color: var(--on-accent);
  }

  .seg input:focus-visible + span {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .banner {
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    bottom: calc(max(14px, env(safe-area-inset-bottom)) + var(--pager-h, 0px));
    box-shadow: var(--shadow);
    color: var(--muted);
    display: flex;
    font-size: 14px;
    gap: 10px;
    left: 50%;
    /* bottom is per breakpoint: above the pager on mobile, under the header on desktop. */
    max-width: min(460px, calc(100vw - 24px));
    padding: 12px 14px;
    position: fixed;
    transform: translateX(-50%);
    transition: opacity var(--dur) ease;
    z-index: 45;
  }

  .banner__text {
    flex: 1;
    text-align: start;
  }

  .banner__close {
    color: var(--muted);
    flex: none;
    height: 32px;
    width: 32px;
  }

  /* The live region stays in the a11y tree for good: the fade and the button come and go, the region does not. */
  .banner:not(.is-shown) {
    opacity: 0;
    pointer-events: none;
  }

  .banner:not(.is-shown) .banner__close {
    visibility: hidden;
  }

  .btn--wide {
    background: var(--surface-2);
    border-radius: var(--r-sm);
    gap: 10px;
    grid-column: 1 / -1;
    height: auto;
    justify-content: flex-start;
    padding: 11px 14px;
    width: 100%;
  }

  /* Hold-to-enter: the fill clips to the button; no selection or callout on a long press. */
  .btn--hold {
    overflow: hidden;
    position: relative;
    user-select: none;
    /* stylelint-disable property-no-vendor-prefix */
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    /* stylelint-enable property-no-vendor-prefix */
  }

  .hold {
    background: var(--accent);
    bottom: 0;
    left: 0;
    opacity: 0.22;
    position: absolute;
    top: 0;
    width: 0;
  }

  /* The fill duration comes from DEMO_HOLD, so JS owns the one timing. */
  .hold.is-run {
    width: 100%;
  }

  .btn--primary {
    background: var(--accent);
    color: var(--on-accent);
  }

  .btn--pill {
    border-radius: 999px;
    gap: 8px;
    padding-inline: 16px;
    width: auto;
  }

  .help {
    list-style: disc;
    padding-inline-start: 22px;

    }

    .act--edit:focus-visible {
      opacity: 1;
      pointer-events: auto;
    }
  }

  @media (width <= 560px) {

      left: 0;
      max-width: none;
      top: auto;
      transform: none;
      width: 100vw;
      bottom: 0;
      padding-bottom: max(20px, env(safe-area-inset-bottom));

      flex-wrap: nowrap;

      flex: 1 1 auto;
      font-size: 14px;

      padding-inline: 10px;

      text-overflow: ellipsis;
      white-space: nowrap;
    }

  @media (width > 560px) {
    .modal--sheet {

      height: auto;
      inset: auto;
      left: 50%;
      max-height: min(80dvh, 680px);
      overflow: hidden;
      padding: 20px 22px;
      top: 50%;

      min-height: 0;
      overflow-y: auto;
    }

    .modal--sheet .modal__actions {
      margin-top: 18px;

      transform: none;
    }

    from {

    }

    to {

    }
  }

      opacity: 0;
      transform: scale(0.98);

const LUCIDE_VERSION = "1.59.0";

const ICON_HOSTS = [
  `https://cdn.jsdelivr.net/npm/lucide-static@${LUCIDE_VERSION}/icons`,
  `https://unpkg.com/lucide-static@${LUCIDE_VERSION}/icons`,
  `https://cdn.statically.io/npm/lucide-static@${LUCIDE_VERSION}/icons`,
];

// The icons the style sheet masks with --ic-<name>.
const ICON_NAMES = [
  "archive", "bottom", "bulk", "check", "chevron-down", "chevron-left", "chevron-right", "close",
  "collapse", "expand", "grip-horizontal", "grip-vertical", "help", "logout", "menu", "pencil",
  "plus", "restore", "settings", "top", "trash",
];

// Lucide file names that differ from the icon name.
const ICON_FILES = {
  bottom: "arrow-down-to-line",
  bulk: "list-checks",
  close: "x",
  collapse: "chevrons-down-up",
  expand: "chevrons-up-down",
  help: "circle-help",
  logout: "log-out",
  menu: "ellipsis-vertical",
  restore: "archive-restore",
  top: "arrow-up-to-line",
  trash: "trash-2",
};

/* ---------- icons ---------- */

function loadIcons() {
  const root = document.documentElement;
  const apply = (base) => {
    for (const name of ICON_NAMES) {
      root.style.setProperty(`--ic-${name}`, `url("${base}/${ICON_FILES[name] ?? name}.svg")`);
    }
    root.classList.remove("icons-off");
    root.classList.add("icons-on");
  };
  const probe = (index) => {
    if (index >= ICON_HOSTS.length) {
      root.classList.remove("icons-on");
      root.classList.add("icons-off");
      return;
    }
    const img = new Image();
    img.onload = () => apply(ICON_HOSTS[index]);
    img.onerror = () => probe(index + 1);
    img.src = `${ICON_HOSTS[index]}/check.svg`;
  };
  probe(0);
}

/* ---------- store & persistence ---------- */

const DB_NAME = "varlog.tbd";
const DEMO_DB = "varlog.tbd.stand";
const DEMO_KEY = "varlog.tbd.stand";
const UI_KEY = "ui";
const STORES = ["checklists", "items", "doc"];

/* Order lives in one doc per list plus one for the lists themselves; a row carries no ordinal. */
const orderKey = (listId) => `order:${listId}`;

/* Decided before anything touches storage: a demo session never opens the real database. */
function demoFlag() {
  try {
    return localStorage.getItem(DEMO_KEY) === "1";
  } catch {
    return false;
  }
}

/* False when the origin cannot keep the flag, which would drop the stand on the next reload. */
function demoSet(on) {
  try {
    if (on) {
      localStorage.setItem(DEMO_KEY, "1");
    } else {
      localStorage.removeItem(DEMO_KEY);
    }
    return true;
  } catch {
    return false;
  }
}

const demo = demoFlag();

// Demo tabs hear only each other, so a stand write never reloads a real tab.
const CHANNEL = demo ? DEMO_DB : DB_NAME;

let db = null;
let storageBroken = false;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function byId(id) {
  return document.getElementById(id);
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

const B36 = "0123456789abcdefghijklmnopqrstuvwxyz";

function uid() {
  return [...crypto.getRandomValues(new Uint8Array(12))].map((byte) => B36[byte % 36]).join("");
}

function langCode() {
  if (state.ui.lang !== "auto") {
    return Object.hasOwn(DICTS, state.ui.lang) ? state.ui.lang : "en";
  }
  const nav = String(navigator.language || "en").toLowerCase().split("-")[0];
  return Object.hasOwn(DICTS, nav) ? nav : "en";
}

function t(key, params) {
  const dict = DICTS[langCode()] ?? EN;
  const raw = dict[key] ?? EN[key] ?? key;
  if (!params) return raw;
  return raw.replace(/\{(\w+)\}/g, (_m, name) => String(params[name] ?? ""));
}

function defaults() {
  return {
    version: 1,
    checklists: [],
    items: [],
    ui: {
      theme: "system",
      lang: "auto",
      newChecklist: "top",
      newItem: "bottom",
      pageSize: 20,
      page: 1,
      panel: { side: "right", topPct: 0.35, collapsed: false },
      editing: null,
      bulk: { kind: null, ids: [] },
    },
  };
}

/* A restored selection is only usable when its kind is known and its ids are a list. */
function validBulk(bulk) {
  return Boolean(bulk)
    && (bulk.kind === "list" || bulk.kind === "item")
    && Array.isArray(bulk.ids);
}

function normalize(data) {
  const out = defaults();
  if (!data || data.version !== 1) {
    return out;
  }
  out.checklists = (Array.isArray(data.checklists) ? data.checklists : [])
    .filter((c) => c && typeof c.id === "string")
    .map((c) => ({
      id: c.id,
      title: typeof c.title === "string" ? c.title : "",
      expanded: c.expanded !== false,
      createdAt: Number(c.createdAt) || Date.now(),
      archived: c.archived === true,
    }));
  const known = new Set(out.checklists.map((c) => c.id));
  out.items = (Array.isArray(data.items) ? data.items : [])
    .filter((i) => i && typeof i.id === "string" && known.has(i.checklistId))
    .map((i) => ({
      id: i.id,
      checklistId: i.checklistId,
      text: typeof i.text === "string" ? i.text : "",
      done: i.done === true,
      createdAt: Number(i.createdAt) || Date.now(),
      archived: i.archived === true,
      archivedBy: i.archivedBy === "user" ? "user" : "list",
    }));
  Object.assign(out.ui, data.ui && typeof data.ui === "object" ? data.ui : {});
  out.ui.editing = null;
  if (!out.ui.panel || typeof out.ui.panel !== "object") {
    out.ui.panel = { side: "right", topPct: 0.35, collapsed: false };
  }
  out.ui.panel.topPct = clamp(Number(out.ui.panel.topPct) || 0, 0, 1);
  out.ui.panel.collapsed = out.ui.panel.collapsed === true;
  if (!validBulk(out.ui.bulk)) {
    out.ui.bulk = { kind: null, ids: [] };
  }
  if (!["system", "dark", "light"].includes(out.ui.theme)) {
    out.ui.theme = "system";
  }
  if (!PAGE_SIZES.includes(out.ui.pageSize)) {
    out.ui.pageSize = 20;
  }
  return out;
}

function openDb(name) {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(name);
    req.onupgradeneeded = () => {
      const idb = req.result;
      idb.createObjectStore("checklists", { keyPath: "id" });
      idb.createObjectStore("items", { keyPath: "id" }).createIndex("checklistId", "checklistId");
      idb.createObjectStore("doc", { keyPath: "key" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/* One transaction over all stores, resolved when it commits. */
function withTx(connection, mode, work) {
  return new Promise((resolve, reject) => {
    const tx = connection.transaction(STORES, mode);
    work(tx);
    tx.oncomplete = resolve;
    const fail = () => reject(tx.error);
    tx.onerror = fail;
    tx.onabort = fail;
  });
}

function clearStores(connection) {
  return withTx(connection, "readwrite", (tx) => {
    for (const name of STORES) {
      tx.objectStore(name).clear();
    }
  });
}

async function readAll() {
  let reqs;
  await withTx(db, "readonly", (tx) => { reqs = STORES.map((name) => tx.objectStore(name).getAll()); });
  return reqs.map((req) => req.result);
}

/* The whole store, read once at boot; from then on the app works on `state` in memory. */
async function load() {
  try {
    db = await openDb(demo ? DEMO_DB : DB_NAME);
    let [checklists, items, docRows] = await readAll();
    if (demo && !checklists.length) {
      // Eviction can leave the flag standing and the stores empty: a stand never starts empty, and
      // whatever settings survived are still its own.
      await seedRows(db, docRows.find((doc) => doc.key === UI_KEY)?.value);
      [checklists, items, docRows] = await readAll();
    }
    const docs = Object.fromEntries(docRows.map((doc) => [doc.key, doc.value]));
    return applyOrder(normalize({ version: 1, checklists, items, ui: docs[UI_KEY] }), docs);
  } catch {
    storageBroken = true;
    return defaults();
  }
}

let state = defaults();
const dark = matchMedia("(prefers-color-scheme: dark)");
const wide = matchMedia("(width > 560px)");
let saveTimer = 0;

/* Set once this tab is on its way out with storage already decided (reset, or reloading for another
   tab's write); the visibilitychange and pagehide flushes must not put an older state back. */
let stopSaving = false;

/* What changed since the last transaction. A move marks an order doc, not the rows it moved. */
const dirty = {
  lists: new Set(), items: new Set(), order: new Set(), goneLists: new Set(), goneItems: new Set(), ui: false,
};

/* The one small ui doc: queueSave marks it, so no ui path has to remember a mark of its own. */
function markUi() {
  dirty.ui = true;
}

function markDirty(kind, id) {
  dirty[kind === "list" ? "lists" : "items"].add(id);
}

function markGone(kind, id) {
  if (kind === "list") {
    dirty.goneLists.add(id);
    dirty.lists.delete(id);
    dirty.order.delete(id);
  } else {
    dirty.goneItems.add(id);
    dirty.items.delete(id);
  }
}

function markOrder(listId) {
  dirty.order.add(listId);
}

/* The rows behind the marks, owned by this batch alone. A marked row that state lost in the meantime
   has nothing left to write; its gone mark, if any, travels in the same batch. */
function takeBatch() {
  const batch = {
    lists: [],
    items: [],
    order: [...dirty.order],
    goneLists: [...dirty.goneLists],
    goneItems: [...dirty.goneItems],
    ui: dirty.ui,
  };
  for (const row of state.checklists) {
    if (dirty.lists.has(row.id)) batch.lists.push(row);
  }
  for (const row of state.items) {
    if (dirty.items.has(row.id)) batch.items.push(row);
  }
  dirty.lists.clear();
  dirty.items.clear();
  dirty.order.clear();
  dirty.goneLists.clear();
  dirty.goneItems.clear();
  dirty.ui = false;
  return batch;
}

function emptyBatch(batch) {
  return !batch.lists.length && !batch.items.length && !batch.order.length
    && !batch.goneLists.length && !batch.goneItems.length && !batch.ui;
}

function requeue(batch) {
  for (const row of batch.lists) dirty.lists.add(row.id);
  for (const row of batch.items) dirty.items.add(row.id);
  for (const id of batch.order) dirty.order.add(id);
  for (const id of batch.goneLists) dirty.goneLists.add(id);
  for (const id of batch.goneItems) dirty.goneItems.add(id);
  dirty.ui = dirty.ui || batch.ui;
}

let flushing = false;
let pendingFlush = false;
let inflight = Promise.resolve();

/* One transaction at a time; edits made while one is running wait for the next. A save with nothing
   dirty stays out of the store, so the other tabs are not told to reload for nothing. */
function save() {
  if (stopSaving || !db) return Promise.resolve();
  const batch = takeBatch();
  if (emptyBatch(batch)) return Promise.resolve();
  if (flushing) {
    requeue(batch);
    pendingFlush = true;
    return inflight.then(() => save());
  }
  flushing = true;
  inflight = writeBatch(batch)
    .then(() => channel?.postMessage(tabId))
    .catch(() => {
      requeue(batch);
      storageBroken = true;
      showToast(t("storage_error"));
    })
    .finally(() => {
      flushing = false;
      if (pendingFlush) {
        pendingFlush = false;
        queueSave();
      }
    });
  return inflight;
}

/* One transaction: rows, order docs, the ui doc and the deletes together, so a half-written batch
   is never readable. A deleted list takes its items and its order doc with it. */
function writeBatch(batch) {
  return withTx(db, "readwrite", (tx) => {
    const lists = tx.objectStore("checklists");
    const items = tx.objectStore("items");
    const docs = tx.objectStore("doc");
    for (const row of batch.lists) lists.put(row);
    for (const row of batch.items) items.put(row);
    for (const id of batch.order) docs.put({ key: orderKey(id), value: orderValue(id) });
    if (batch.ui) docs.put({ key: UI_KEY, value: state.ui });
    for (const id of batch.goneItems) items.delete(id);
    for (const id of batch.goneLists) {
      lists.delete(id);
      docs.delete(orderKey(id));
      const keys = items.index("checklistId").getAllKeys(id);
      keys.onsuccess = () => keys.result.forEach((key) => items.delete(key));
    }
  });
}

function queueSave() {
  markUi();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveTimer = 0;
    save();
  }, 150);
}

function flushSave() {
  clearTimeout(saveTimer);
  saveTimer = 0;
  return save();
}

/* Every commit echoes this tab's own id, so a tab never reloads over its own write. On file:// the
   origin is opaque and a channel can be missing or deaf: those tabs simply leave each other alone. */
const tabId = uid();
let channel = null;
try {
  channel = new BroadcastChannel(CHANNEL);
} catch {
  // no channel for this origin
}

/* Another tab wrote; reload as soon as this tab has nothing unsaved on screen. */
let externalWrite = false;

function safeToReload() {
  return !state.ui.editing && !gesture && !drag && !modalOpen();
}

async function maybeReload() {
  if (!externalWrite || !safeToReload()) {
    return;
  }
  externalWrite = false;
  // A pending save is newer than the other tab's write; flushing an old state would bury that write.
  if (saveTimer) {
    await flushSave();
  }
  stopSaving = true;
  location.reload();
}

function commit() {
  queueSave();
  render();
  maybeReload();
}

/* ---------- pure ordering helpers ---------- */

/* Rows in the order doc's order; rows the doc does not name keep the order they came in. */
function byOrder(rows, ids) {
  const rest = new Map(rows.map((row) => [row.id, row]));
  const out = [];
  for (const id of Array.isArray(ids) ? ids : []) {
    const row = rest.get(id);
    if (row) {
      out.push(row);
      rest.delete(id);
    }
  }
  return [...out, ...rest.values()];
}

/* Items are ordered inside their own list, lists in one doc of their own. */
function applyOrder(data, docs) {
  data.checklists = byOrder(data.checklists, docs[orderKey("lists")]);
  const groups = new Map();
  for (const item of data.items) {
    const group = groups.get(item.checklistId) ?? [];
    group.push(item);
    groups.set(item.checklistId, group);
  }
  data.items = data.checklists.flatMap((cl) => byOrder(groups.get(cl.id) ?? [], docs[orderKey(cl.id)]));
  return data;
}

/* The ids a list holds now: state is the only authority on order, a doc merely mirrors it. */
function orderValue(listId) {
  return listId === "lists"
    ? state.checklists.map((c) => c.id)
    : state.items.filter((i) => i.checklistId === listId).map((i) => i.id);
}

/* Where a group taken out of `list` lands: before refId; after prevId when the gap sits at the end
   of the page (so a drop at the bottom of a page stays on it); at the end when neither is there. */
function refIndex(list, ids, refId, prevId) {
  const picked = new Set(ids);
  const rest = list.filter((x) => !picked.has(x.id));
  const at = rest.findIndex((x) => x.id === refId);
  if (at !== -1) {
    return at;
  }
  const prev = rest.findIndex((x) => x.id === prevId);
  return prev === -1 ? rest.length : prev + 1;
}

function moveGroup(list, ids, index) {
  const picked = new Set(ids);
  const group = list.filter((x) => picked.has(x.id));
  const rest = list.filter((x) => !picked.has(x.id));
  rest.splice(clamp(index, 0, rest.length), 0, ...group);
  return rest;
}

/* With last: after the last peer; otherwise before the first; at the end when there are none. */
function joinIndex(rest, peers, last) {
  if (!peers.length) {
    return rest.length;
  }
  return last ? rest.indexOf(peers.at(-1)) + 1 : rest.indexOf(peers[0]);
}

/* True when moving this group to `where` would leave its visible siblings in the same order. */
function atEdge(kind, ids, where) {
  const peers = kind === "list"
    ? visibleChecklists()
    : withoutArchived(state.items, (findItem(ids[0]) ?? {}).checklistId);
  const moved = moveGroup(peers, ids, where === "top" ? 0 : peers.length);
  return moved.every((row, index) => row.id === peers[index].id);
}

function withoutArchived(items, checklistId) {
  return items.filter((i) => i.checklistId === checklistId && !i.archived);
}

function visibleChecklists() {
  return state.checklists.filter((c) => !c.archived);
}

function pageCount(total) {
  const size = state.ui.pageSize;
  if (size === "all") return 1;
  return Math.max(1, Math.ceil(total / size));
}

function pagedChecklists() {
  const all = visibleChecklists();
  const size = state.ui.pageSize;
  if (size === "all") return all;
  const start = (clamp(state.ui.page, 1, pageCount(all.length)) - 1) * size;
  return all.slice(start, start + size);
}

function indexOfVisible(id) {
  return visibleChecklists().findIndex((c) => c.id === id);
}

function findList(id) {
  return state.checklists.find((c) => c.id === id);
}

function findItem(id) {
  return state.items.find((i) => i.id === id);
}

function entityText(kind, id) {
  const row = kind === "list" ? findList(id) : findItem(id);
  if (!row) return "";
  return kind === "list" ? row.title : row.text;
}

/* ---------- entities ---------- */

let scrollTarget = null;

function addChecklist() {
  const cl = { id: uid(), title: "", expanded: true, createdAt: Date.now(), archived: false };
  if (state.ui.newChecklist === "top") {
    state.checklists.unshift(cl);
  } else {
    state.checklists.push(cl);
  }
  markDirty("list", cl.id);
  markOrder("lists");
  state.ui.editing = { kind: "list", id: cl.id };
  jumpTo(cl.id);
  commit();
}

function addItem(checklistId) {
  const cl = findList(checklistId);
  if (!cl) return;
  cl.expanded = true;
  markDirty("list", cl.id);
  const item = {
    id: uid(),
    checklistId,
    text: "",
    done: false,
    createdAt: Date.now(),
    archived: false,
    archivedBy: "user",
  };
  const peers = state.items.filter((i) => i.checklistId === checklistId);
  state.items.splice(joinIndex(state.items, peers, state.ui.newItem !== "top"), 0, item);
  markDirty("item", item.id);
  markOrder(checklistId);
  state.ui.editing = { kind: "item", id: item.id };
  scrollTarget = { kind: "item", id: item.id };
  commit();
}

function removeEntity(kind, id) {
  if (kind === "list") {
    state.checklists = state.checklists.filter((c) => c.id !== id);
    state.items = state.items.filter((i) => i.checklistId !== id);
    markGone("list", id);
    markOrder("lists");
  } else {
    const item = findItem(id);
    state.items = state.items.filter((i) => i.id !== id);
    markGone("item", id);
    if (item) markOrder(item.checklistId);
  }
  pruneSelection();
}

function commitText(kind, id, raw) {
  const text = raw.trim();
  if (!text && entityText(kind, id)) {
    // Renaming to empty is a rollback, not a delete; only nameless new entities are discarded.
    cancelEdit();
    return;
  }
  if (!text) {
    removeEntity(kind, id);
    state.ui.editing = null;
    commit();
    return;
  }
  if (kind === "list") {
    const cl = findList(id);
    if (cl) cl.title = text;
  } else {
    const item = findItem(id);
    if (item) item.text = text;
  }
  state.ui.editing = null;
  markDirty(kind, id);
  // Repaint only this row: rebuilding would destroy the button that just took focus away, and its click with it.
  flushSave();
  repaintRow(kind, id);
}

function cancelEdit() {
  const editing = state.ui.editing;
  if (!editing) return;
  if (!entityText(editing.kind, editing.id)) {
    removeEntity(editing.kind, editing.id);
  }
  state.ui.editing = null;
  commit();
}

function archiveItemQuiet(id) {
  const item = findItem(id);
  if (!item) return;
  item.archived = true;
  item.archivedBy = "user";
  markDirty("item", id);
}

function archiveMany(kind, ids) {
  const archive = kind === "list" ? archiveChecklistQuiet : archiveItemQuiet;
  for (const id of ids) {
    archive(id);
  }
  pruneSelection();
  commit();
  showToast(t("toast_archived"));
}

function archiveChecklistQuiet(id) {
  const cl = findList(id);
  if (!cl) return;
  cl.archived = true;
  markDirty("list", id);
  for (const item of state.items) {
    if (item.checklistId === id && !item.archived) {
      item.archived = true;
      item.archivedBy = "list";
      markDirty("item", item.id);
    }
  }
}

function deleteMany(kind, ids) {
  for (const id of ids) {
    removeEntity(kind, id);
  }
  commit();
  showToast(t("toast_deleted"));
}

function moveTo(kind, ids, where) {
  if (!ids.length) return;
  if (kind === "list") {
    state.checklists = moveGroup(state.checklists, ids, where === "top" ? 0 : state.checklists.length);
    markOrder("lists");
    const count = pageCount(visibleChecklists().length);
    state.ui.page = where === "top" ? 1 : count;
  } else {
    moveItemsTo(ids, where);
  }
  commit();
}

function moveItemsTo(ids, where) {
  const picked = new Set(ids);
  const group = state.items.filter((i) => picked.has(i.id));
  if (!group.length) return;
  const rest = state.items.filter((i) => !picked.has(i.id));
  const peers = rest.filter((i) => i.checklistId === group[0].checklistId);
  state.items = moveGroup(state.items, ids, joinIndex(rest, peers, where !== "top"));
  for (const checklistId of new Set(group.map((i) => i.checklistId))) {
    markOrder(checklistId);
  }
}

function jumpTo(id) {
  const index = indexOfVisible(id);
  if (index < 0) return;
  const size = state.ui.pageSize;
  if (size !== "all") {
    state.ui.page = Math.floor(index / size) + 1;
  }
  scrollTarget = { kind: "list", id };
}

function setExpandedAll(open) {
  for (const cl of visibleChecklists()) {
    cl.expanded = open;
    markDirty("list", cl.id);
  }
  commit();
}

/* ---------- bulk ---------- */

/* An empty id list is no selection: kind goes with it. */
function setBulk(kind, ids) {
  state.ui.bulk = { kind: ids.length > 0 ? kind : null, ids };
}

function startBulk(kind, id) {
  setBulk(kind, [id]);
  state.ui.editing = null;
  state.ui.panel.collapsed = false;
  commit();
}

function cancelBulk() {
  setBulk(null, []);
  commit();
}

/* A picked row that is gone — deleted or archived — leaves the selection; the rest survives. */
function pruneSelection() {
  const bulk = state.ui.bulk;
  if (!bulk.ids.length) return;
  const find = bulk.kind === "list" ? findList : findItem;
  setBulk(bulk.kind, bulk.ids.filter((id) => {
    const row = find(id);
    return Boolean(row) && !row.archived;
  }));
}

/* Items live in one list each: a selection spread over lists has no single top or bottom. */
function spansLists(bulk) {
  return bulk.kind === "item" && new Set(bulk.ids.map((id) => (findItem(id) ?? {}).checklistId)).size > 1;
}

function togglePick(kind, id) {
  const bulk = state.ui.bulk;
  const inBulk = bulk.kind === kind && bulk.ids.length > 0;
  if (bulk.kind !== kind) {
    state.ui.panel.collapsed = false;
  }
  const ids = inBulk ? bulk.ids : [];
  const picked = ids.includes(id) ? ids.filter((x) => x !== id) : [...ids, id];
  setBulk(kind, picked);
  // Inside a running selection only this row and the panel change; starting or ending one repaints every row.
  if (inBulk && state.ui.bulk.kind === kind) {
    queueSave();
    repaintRow(kind, id);
  } else {
    commit();
  }
}

/* ---------- render ---------- */

let needFocus = false;

/* Icon-only buttons get their aria-label as a tooltip too: the fallback glyphs are not self-explanatory. */
function labelNode(node, key) {
  const text = t(key);
  node.setAttribute("aria-label", text);
  node.title = text;
}

let focusWanted = null;

function captureFocus() {
  focusWanted = null;
  const node = document.activeElement;
  if (!node || node === document.body || node.tagName === "INPUT" || node.tagName === "SELECT") {
    return;
  }
  const act = node.getAttribute("data-act");
  if (!act) return;
  if (node.closest("#panel")) {
    focusWanted = { scope: "panel", act };
    return;
  }
  const row = node.closest("#lists [data-kind][data-id]");
  if (!row) {
    return;
  }
  const card = row.parentElement ? row.parentElement.closest("[data-kind='list']") : null;
  focusWanted = {
    scope: "lists",
    kind: row.dataset.kind,
    id: row.dataset.id,
    act,
    listId: card ? card.dataset.id : null,
    index: [...row.parentElement.children].indexOf(row),
  };
}

function usable(node) {
  return node && !node.disabled && node.getClientRects().length > 0 ? node : null;
}

function rowZone(row) {
  return row.querySelector(":scope > .card__head, :scope > .item__row") ?? row;
}

function listRowFocus(want) {
  const row = document.querySelector(`#lists [data-kind="${want.kind}"][data-id="${CSS.escape(want.id)}"]`);
  if (row) {
    return rowZone(row).querySelector(`[data-act="${want.act}"]`);
  }
  const host = want.listId
    ? document.querySelector(`#lists [data-kind="list"][data-id="${CSS.escape(want.listId)}"] .items`)
    : byId("lists");
  const successor = host ? host.children[want.index] : null;
  return successor ? rowZone(successor).querySelector(`[data-act="${want.act}"]`) : null;
}

function restoreFocus() {
  const want = focusWanted;
  focusWanted = null;
  if (!want) return;
  const node = usable(want.scope === "panel"
    ? document.querySelector(`#panel [data-act="${want.act}"]`)
    : listRowFocus(want));
  (node ?? byId("lists")).focus({ preventScroll: true });
}

function render() {
  captureFocus();
  renderChrome();
  renderLists();
  renderPager();
  renderPanel();
  afterRender();
}

function renderChrome() {
  document.documentElement.lang = langCode();
  const system = dark.matches ? "dark" : "light";
  document.documentElement.dataset.theme = state.ui.theme === "system" ? system : state.ui.theme;
  labelNode(byId("btn-add"), "add_list");
  labelNode(byId("btn-settings"), "settings");
  labelNode(byId("btn-demo"), "demo_exit");
  labelNode(byId("btn-help"), "help");
  labelNode(byId("page-prev"), "prev_page");
  labelNode(byId("page-next"), "next_page");
  labelNode(byId("banner-close"), "a_dismiss");
}

function renderLists() {
  // Reused nodes survive the render, so the drag styling has to be dropped here and re-applied by applyDragState.
  for (const row of byId("lists").querySelectorAll(".is-drag-src")) {
    row.classList.remove("is-drag-src");
  }
  const existing = new Map([...byId("lists").children].map((node) => [node.dataset.id, node]));
  const rows = pagedChecklists().map((cl) => {
    const node = existing.get(cl.id) || byId("tpl-checklist").content.firstElementChild.cloneNode(true);
    paintChecklist(node, cl);
    return node;
  });
  byId("lists").replaceChildren(...rows);
  const emptyNode = byId("empty");
  emptyNode.textContent = t("empty");
  emptyNode.hidden = visibleChecklists().length > 0;
}

function isMuted(items) {
  return items.length > 0 && items.every((i) => i.done);
}

/* True when the host already mirrors items 1:1; anything else needs a real rebuild. */
function sameRows(host, items) {
  return host.children.length === items.length
    && [...host.children].every((child, index) => child.dataset.id === items[index].id);
}

function paintChecklist(node, cl) {
  const items = withoutArchived(state.items, cl.id);
  const open = Boolean(cl.expanded);
  node.dataset.kind = "list";
  node.dataset.id = cl.id;
  node.classList.toggle("is-open", open);
  node.classList.toggle("is-muted", isMuted(items));
  paintHead(node, cl, open);
  const body = node.querySelector(".card__body");
  body.hidden = !open;
  if (!open) return;
  const hint = body.querySelector(".card__empty");
  hint.hidden = items.length > 0;
  hint.textContent = t("empty_items");
  const host = body.querySelector(".items");
  if (!sameRows(host, items)) {
    host.replaceChildren(...items.map(buildItem));
    return;
  }
  for (const [index, item] of items.entries()) {
    paintItem(host.children[index], item);
  }
}

function paintHead(node, cl, open) {
  const toggle = node.querySelector(".mark--toggle");
  const icon = toggle.querySelector(".ic");
  const alt = toggle.querySelector(".ic-alt");
  icon.classList.toggle("ic--chevron-down", open);
  icon.classList.toggle("ic--chevron-right", !open);
  alt.textContent = open ? "▾" : "▸";
  toggle.setAttribute("aria-expanded", open ? "true" : "false");
  toggle.setAttribute("aria-label", cl.title || t("new_list_ph"));
  const add = node.querySelector(".act--add");
  labelNode(add, "add_item");
  add.hidden = !open;
  labelNode(node.querySelector(".act--edit"), "a_edit");
  labelNode(node.querySelector(".act--menu"), "a_menu");
  node.querySelector(".card__title").textContent = cl.title || t("new_list_ph");
  paintHeadBulk(node, cl);
  paintRowEditor(node, "list", cl.id, cl.title);
}

function paintHeadBulk(node, cl) {
  const bulk = state.ui.bulk;
  const pick = node.querySelector(".mark--bulk");
  const toggle = node.querySelector(".mark--toggle");
  if (bulk.kind !== "list") {
    toggle.hidden = false;
    pick.hidden = true;
    return;
  }
  toggle.hidden = true;
  pick.hidden = false;
  checkBox(pick, bulk.ids.includes(cl.id), cl.title || t("new_list_ph"));
}

function checkBox(node, on, label) {
  node.setAttribute("role", "checkbox");
  node.setAttribute("aria-checked", on ? "true" : "false");
  node.setAttribute("aria-label", label);
  node.classList.toggle("is-on", on);
  const box = node.querySelector(".mark__box");
  box.replaceChildren();
  if (on) box.append(...iconPair("check"));
}

function paintRowEditor(node, kind, id, text) {
  const editing = state.ui.editing;
  if (editing && editing.kind === kind && editing.id === id) {
    paintEditor(node, text, text ? `edit_${kind}_ph` : `new_${kind}_ph`);
    needFocus = true;
  } else {
    paintEditor(node, text, null);
  }
}

/* phKey === null closes the editor: the row goes back to its plain state. */
function paintEditor(row, text, phKey) {
  const editor = row.querySelector(".row-edit");
  const label = row.querySelector(".card__title, .item__text");
  const editAct = row.querySelector(".act--edit");
  if (!editor || !label) {
    return;
  }
  if (phKey === null) {
    editor.hidden = true;
    label.hidden = false;
    if (editAct) editAct.hidden = false;
    return;
  }
  label.hidden = true;
  if (editAct) editAct.hidden = true;
  editor.hidden = false;
  const input = editor.querySelector("input");
  input.value = text;
  input.placeholder = t(phKey);
  input.setAttribute("aria-label", t(phKey));
  labelNode(editor.querySelector(".act--save"), "a_save");
}

function buildItem(item) {
  const node = byId("tpl-item").content.firstElementChild.cloneNode(true);
  paintItem(node, item);
  return node;
}

function paintItem(node, item) {
  node.dataset.kind = "item";
  node.dataset.id = item.id;
  node.classList.toggle("is-done", item.done);
  node.querySelector(".item__text").textContent = item.text || t("new_item_ph");
  const check = node.querySelector(".mark--check");
  checkBox(check, item.done, item.text || t("new_item_ph"));
  labelNode(node.querySelector(".act--menu"), "a_menu");
  const bulk = state.ui.bulk;
  const pick = node.querySelector(".mark--bulk");
  if (bulk.kind === "item") {
    check.hidden = true;
    pick.hidden = false;
    checkBox(pick, bulk.ids.includes(item.id), item.text || t("new_item_ph"));
  } else {
    check.hidden = false;
    pick.hidden = true;
  }
  paintRowEditor(node, "item", item.id, item.text);
}

function renderPager() {
  const total = visibleChecklists().length;
  const pages = pageCount(total);
  const pager = byId("pager");
  pager.hidden = state.ui.pageSize === "all" || pages <= 1;
  document.documentElement.style.setProperty("--pager-h", pager.hidden ? "0px" : `${pager.offsetHeight}px`);
  if (pager.hidden) return;
  const page = clamp(state.ui.page, 1, pages);
  state.ui.page = page;
  byId("page-info").textContent = t("page_of", { n: page, m: pages });
  byId("page-prev").disabled = page <= 1;
  byId("page-next").disabled = page >= pages;
}

/* Fallback glyphs, keyed by icon name: shown when the icon hosts are unreachable. */
const GLYPHS = {
  archive: "▣",
  bottom: "↓",
  bulk: "☰",
  "chevron-down": "⌄",
  check: "✓",
  collapse: "−",
  close: "←",
  expand: "+",
  "grip-horizontal": "⋯",
  "grip-vertical": "⋮",
  restore: "↺",
  top: "↑",
  trash: "✕",
};

function iconPair(icon) {
  const alt = el("span", "ic-alt", GLYPHS[icon]);
  alt.setAttribute("aria-hidden", "true");
  return [el("span", `ic ic--${icon}`), alt];
}

function panelButton(icon, labelKey, act, disabled) {
  const button = el("button", "btn");
  button.type = "button";
  button.dataset.act = act;
  labelNode(button, labelKey);
  button.disabled = disabled;
  button.append(...iconPair(icon));
  return button;
}

function panelSeparator() {
  const sep = el("div", "panel__sep");
  sep.setAttribute("role", "separator");
  return sep;
}

function panelGroup(labelKey, buttons) {
  const group = el("div", "panel__group");
  group.setAttribute("role", "group");
  group.setAttribute("aria-label", t(labelKey));
  group.append(...buttons);
  return group;
}

function renderPanel() {
  const bulk = state.ui.bulk;
  const all = visibleChecklists();
  const collapsed = state.ui.panel.collapsed;
  const grip = panelButton(collapsed ? "grip-vertical" : "grip-horizontal",
    collapsed ? "panel_expand" : "panel_collapse", "panel-toggle", false);
  grip.setAttribute("aria-expanded", String(!collapsed));
  const nodes = [grip];
  if (!collapsed) {
    nodes.push(panelSeparator(), panelGroup("panel_group_lists", [
      panelButton("expand", "expand_all", "expand-all", !all.some((c) => !c.expanded)),
      panelButton("collapse", "collapse_all", "collapse-all", !all.some((c) => c.expanded)),
    ]));
    if (bulk.kind !== null) {
      const any = bulk.ids.length > 0;
      const remove = panelButton("trash", "a_delete", "bulk-delete", !any);
      remove.classList.add("btn--danger");
      nodes.push(panelSeparator(), panelGroup("panel_group_remove", [
        remove,
        panelButton("archive", "a_archive", "bulk-archive", !any),
      ]));
      const mixed = spansLists(bulk);
      nodes.push(panelSeparator(), panelGroup("panel_group_move", [
        panelButton("top", "a_top", "bulk-top", !any || mixed || atEdge(bulk.kind, bulk.ids, "top")),
        panelButton("bottom", "a_bottom", "bulk-bottom", !any || mixed || atEdge(bulk.kind, bulk.ids, "bottom")),
      ]));
      nodes.push(panelSeparator(), panelButton("close", "a_cancel", "bulk-cancel", false));
    }
  }
  const panel = byId("panel");
  panel.replaceChildren(...nodes);
  panel.classList.toggle("is-collapsed", collapsed);
  panel.classList.toggle("is-hidden", all.length === 0 && bulk.kind === null);
  positionPanel();
}

function repaintRow(kind, id) {
  const row = rowById(kind, id);
  if (!row || !paintRow(row, kind, id)) {
    render();
    return;
  }
  renderPanel();
  maybeReload();
}

/* Repaint one row in place: no node is destroyed, so focus, scroll and animations survive.
   False when the row no longer matches the data it stands for, which needs a real rebuild. */
function paintRow(row, kind, id) {
  if (kind === "list") {
    const cl = findList(id);
    if (!cl) return false;
    paintChecklist(row, cl);
    return true;
  }
  const item = findItem(id);
  const card = row.closest(".card");
  const cl = card ? findList(card.dataset.id) : null;
  if (!item || !cl || item.checklistId !== cl.id) {
    return false;
  }
  paintItem(row, item);
  card.classList.toggle("is-muted", isMuted(withoutArchived(state.items, cl.id)));
  return true;
}

function afterRender() {
  restoreFocus();
  if (needFocus && state.ui.editing) {
    focusEditor(state.ui.editing.id);
  }
  needFocus = false;
  if (scrollTarget) applyScrollTarget();
  applyDragState();
}

function focusEditor(id) {
  const row = document.querySelector(`#lists [data-id="${CSS.escape(id)}"]`);
  const input = row && row.querySelector(":scope > .card__head .input, :scope > .item__row .input");
  if (!input) return;
  input.focus();
  const end = input.value.length;
  input.setSelectionRange(end, end);
}

function applyScrollTarget() {
  const target = scrollTarget;
  scrollTarget = null;
  const row = document.querySelector(`#lists [data-id="${CSS.escape(target.id)}"]`);
  if (!row) return;
  row.scrollIntoView({ block: "center", behavior: "smooth" });
  row.classList.add("is-flash");
  setTimeout(() => row.classList.remove("is-flash"), 900);
}

/* ---------- modal layer ---------- */

function modalOpen() {
  return Boolean(document.querySelector("#layer dialog[open]"));
}

/* Dialog order in the DOM is open order, so the last one is the one the top layer shows. */
function closeModal() {
  const open = document.querySelectorAll("#layer dialog[open]");
  const top = open[open.length - 1];
  if (top) {
    top.close();
  }
}

function fillModal(box, opts) {
  const body = el("div", "modal__body");
  if (typeof opts.body === "string") {
    body.textContent = opts.body;
  } else if (opts.body) {
    body.append(opts.body);
  }
  const label = opts.label ?? opts.title ?? (typeof opts.body === "string" ? opts.body : null);
  if (label) {
    box.setAttribute("aria-label", label);
  }
  if (opts.title) {
    box.append(el("h2", "modal__title", opts.title));
  }
  box.append(body);
  return body;
}

function openModal(opts) {
  let cls = "modal";
  if (opts.sheet) {
    cls = "modal modal--sheet";
  } else if (opts.picker) {
    cls = "modal modal--picker";
  } else if (opts.dropdown) {
    cls = "modal modal--dropdown";
  }
  const box = el("dialog", cls);
  const body = fillModal(box, opts);
  if (opts.actions && opts.actions.length) {
    box.append(actionRow(opts.actions));
  }
  // showModal remembers the focused element and restores it on close, so the trigger goes first.
  (opts.anchor ?? document.activeElement)?.focus({ preventScroll: true });
  box.addEventListener("click", (event) => {
    if (event.target === box) {
      closeModal();
    }
  });
  // Escape: Chrome cancels every open dialog at once; onKey closes one at a time.
  box.addEventListener("cancel", (event) => event.preventDefault());
  box.addEventListener("close", () => {
    box.remove();
    if (!modalOpen()) {
      document.documentElement.classList.remove("is-locked");
    }
    if (opts.onClosed) {
      opts.onClosed();
    }
  });
  byId("layer").append(box);
  document.documentElement.classList.add("is-locked");
  box.showModal();
  /* Positioning runs after showModal: the scroll lock can move the viewport edge.
     Pickers and dropdowns are menus at every width; the rest stay sheets below the breakpoint. */
  if (opts.anchor && (opts.picker || opts.dropdown || wide.matches)) {
    box.classList.add("modal--anchored");
    box.anchor = opts.anchor;
    positionPopup(box, opts.anchor);
  }
  return { box, body, close: closeModal };
}

/* Dropdown placement: below the trigger, right-aligned to it. A popup never drifts off its trigger —
   when the list fits neither below nor above, it takes the roomier side and scrolls there. */
function anchoredBox(rect, width, height) {
  const minLeft = 8 + cssVarPx("--safe-left");
  const maxLeft = Math.max(minLeft, innerWidth - width - 8 - cssVarPx("--safe-right"));
  const spaceBelow = innerHeight - rect.bottom - 20;
  const spaceAbove = rect.top - 16;
  const up = height > spaceBelow && (height <= spaceAbove || spaceAbove > spaceBelow);
  return {
    left: Math.round(clamp(rect.right - width, minLeft, maxLeft)),
    maxHeight: up ? spaceAbove : spaceBelow,
    top: Math.max(8, up ? rect.top - 8 - height : rect.bottom + 8),
  };
}

function positionPopup(node, anchor) {
  const pos = anchoredBox(anchor.getBoundingClientRect(), node.offsetWidth, node.offsetHeight);
  node.style.maxHeight = `${pos.maxHeight}px`;
  node.style.top = `${pos.top}px`;
  node.style.left = `${pos.left}px`;
}

function positionAnchored() {
  for (const box of document.querySelectorAll("#layer dialog.modal--anchored[open]")) {
    positionPopup(box, box.anchor);
  }
}

// A sheet opened under the other breakpoint would be misplaced; closing beats re-anchoring it.
function closePopovers() {
  for (const box of document.querySelectorAll("#layer dialog[open]")) {
    box.close();
  }
}

function actionRow(actions) {
  const row = el("div", "modal__actions");
  for (const action of actions) {
    const button = el("button", `btn btn--pill ${action.cls ?? ""}`);
    button.type = "button";
    if (action.icon) button.append(...iconPair(action.icon));
    button.append(el("span", null, action.label));
    // data-count: the archive sheet enables these itself once something is picked.
    if (action.count) button.dataset.count = "1";
    button.addEventListener("click", action.onClick);
    row.append(button);
  }
  return row;
}

/* Tab bars are kept, not rebuilt on click: rebuilding would drop focus back to the dialog. */
function tabBar(pairs, onSelect) {
  const bar = el("div", "tabs");
  const buttons = pairs.map(([key, labelKey]) => {
    const button = el("button", "tabs__tab", t(labelKey));
    button.type = "button";
    button.dataset.key = key;
    button.addEventListener("click", () => onSelect(key));
    bar.append(button);
    return button;
  });
  const paint = (key) => buttons.forEach((button, i) => {
    const on = pairs[i][0] === key;
    button.classList.toggle("is-active", on);
    button.setAttribute("aria-pressed", String(on));
  });
  return { bar, paint };
}

function confirmModal(message, yesLabel, onYes, anchor) {
  openModal({
    anchor,
    body: message,
    actions: [
      { label: t("a_cancel"), onClick: closeModal },
      {

/* ---------- settings ---------- */

function field(labelKey, control) {
  const row = el("div", "field");
  control.setAttribute("aria-label", t(labelKey));
  row.append(el("span", "field__label", t(labelKey)), control);
  return row;
}

// Next index for a nav key: arrows step and stop at the ends, Home/End jump.
function optionKeyIndex(index, key, count) {
  if (key === "ArrowDown") {
    return Math.min(index + 1, count - 1);
  }
  if (key === "ArrowUp") {
    return Math.max(index - 1, 0);
  }
  if (key === "Home") {
    return 0;
  }
  if (key === "End") {
    return count - 1;
  }
  return index;
}

// Next label after `from` starting with `char`, wrapping past the end; `from` when none.
function prefixMatchIndex(labels, char, from) {
  const needle = char.normalize("NFC").toLowerCase();
  for (let step = 1; step <= labels.length; step += 1) {
    const index = (from + step) % labels.length;
    if (labels[index].normalize("NFC").toLowerCase().startsWith(needle)) {
      return index;
    }
  }
  return from;
}

function openPicker(labelKey, items, value, onPick, anchor) {
  const labels = items.map(([, text]) => String(text));
  const selected = items.findIndex(([item]) => String(item) === String(value));
  const rows = items.map(([item, text], index) => {
    const row = el("button", "menu-list__item picker__option");
    row.type = "button";
    row.setAttribute("role", "option");
    row.setAttribute("aria-selected", String(index === selected));
    row.append(el("span", null, String(text)));
    if (index === selected) {
      row.append(...iconPair("check"));
    }
    row.addEventListener("click", () => {
      handle.close();
      onPick(item);
    });
    return row;
  });
  const list = el("div", "menu-list");
  list.setAttribute("role", "listbox");
  list.setAttribute("aria-label", t(labelKey));
  list.append(...rows);
  list.addEventListener("keydown", (event) => {
    const from = rows.indexOf(document.activeElement);
    if (from < 0 || event.ctrlKey || event.metaKey || event.altKey) {
      return;
    }
    const typed = event.key.length === 1 && event.key !== " ";
    const next = typed ? prefixMatchIndex(labels, event.key, from) : optionKeyIndex(from, event.key, rows.length);
    if (next === from) {
      return;
    }
    event.preventDefault();
    rows[next].focus();
  });
  const handle = openModal({
    picker: true,
    label: t(labelKey),
    body: list,
    anchor,
    onClosed: () => anchor.setAttribute("aria-expanded", "false"),
  });
  anchor.setAttribute("aria-expanded", "true");
  (rows[selected] ?? rows[0])?.focus();
  return handle;
}

function pickerControl(labelKey, items, value, onChange) {
  // A stored value that is no longer offered shows the first option instead of breaking the dialog.
  const labelFor = (val) => String((items.find(([item]) => String(item) === String(val)) ?? items[0])[1]);
  let current = value;
  const trigger = el("button", "picker");
  trigger.type = "button";
  trigger.setAttribute("aria-haspopup", "listbox");
  trigger.setAttribute("aria-expanded", "false");
  const paint = () => trigger.replaceChildren(el("span", null, labelFor(current)), ...iconPair("chevron-down"));
  trigger.addEventListener("click", () => openPicker(labelKey, items, current, (next) => {
    current = next;
    paint();
    onChange(next);
  }, trigger));
  paint();
  return trigger;
}

function segmentControl(name, value, pairs, onChange) {
  const box = el("div", "seg");
  box.setAttribute("role", "radiogroup");
  for (const [val, label] of pairs) {
    const wrap = el("label");
    const input = el("input");
    input.type = "radio";
    input.name = name;
    input.value = val;
    input.checked = String(value) === val;
    input.addEventListener("change", () => onChange(val));
    wrap.append(input, el("span", null, label));
    box.append(wrap);
  }
  return box;
}

/* ---------- archive ---------- */

function archivedLists() {
  return state.checklists.filter((c) => c.archived);
}

function archivedItems() {
  return state.items.filter((i) => {
    if (!i.archived || i.archivedBy !== "user") {
      return false;
    }
    const cl = findList(i.checklistId);
    return !cl || !cl.archived;
  });
}

function restoreLists(ids) {
  const picked = new Set(ids);
  const moved = [];
  const rest = [];
  for (const cl of state.checklists) {
    if (picked.has(cl.id)) {
      cl.archived = false;
      markDirty("list", cl.id);
      moved.push(cl);
    } else {
      rest.push(cl);
    }
  }
  state.checklists = [...moved, ...rest];
  markOrder("lists");
  for (const item of state.items) {
    if (picked.has(item.checklistId) && item.archived && item.archivedBy === "list") {
      item.archived = false;
      markDirty("item", item.id);
    }
  }
}

function restoreItems(ids) {
  const picked = new Set(ids);
  const moved = [];
  state.items = state.items.filter((item) => {
    if (!picked.has(item.id)) return true;
    item.archived = false;
    markDirty("item", item.id);
    moved.push(item);
    return false;
  });
  for (const item of [...moved].reverse()) {
    const peers = state.items.filter((i) => i.checklistId === item.checklistId);
    state.items.splice(joinIndex(state.items, peers, false), 0, item);
  }
  for (const checklistId of new Set(moved.map((i) => i.checklistId))) {
    markOrder(checklistId);
  }
}

function archiveRow(text, on, onChange) {
  const row = el("label", "rows__row");

  return row;
}

  const focusTab = () => bar.querySelector(`[data-key="${view.tab}"]`)?.focus({ preventScroll: true });
  const paint = () => {
    const rows = view.tab === "lists" ? archivedLists() : archivedItems();
    paintTabs(view.tab);

    list.replaceChildren(...rows.map((row) => {
      const text = view.tab === "lists" ? row.title || t("new_list_ph") : row.text || t("new_item_ph");
      return archiveRow(text, false, (on) => {

  };
  const { bar, paint: paintTabs } = tabBar([["lists", "tab_lists"], ["items", "tab_items"]], (key) => {
    view.tab = key;
    view.sel.clear();

  });
  host.append(bar, empty, list, actionRow([
    { icon: "close", label: t("a_cancel"), onClick: () => handle.close() },
    {
      icon: "restore",

      count: true,
      onClick: () => {
        const ids = selected();
        if (!ids.length) return;
        if (view.tab === "lists") restoreLists(ids);
        else restoreItems(ids);
        view.sel.clear();
        commit();
        paint();
      },
    },
    {
      icon: "trash",
      label: t("a_delete"),
      cls: "btn--danger",
      count: true,
      onClick: (event) => {
        const ids = selected();
        if (!ids.length) return;
        const kind = view.tab === "lists" ? "list" : "item";
        ask(kind, ids, "delete", event.currentTarget, () => {
          view.sel.clear();
          paint();
          focusTab();
        });
      },
    },
  ]));
  const paintActions = () => {
    const count = view.sel.size;
    for (const button of host.querySelectorAll("[data-count]")) {
      button.disabled = count === 0;
    }
  };
  paint();
}

function demoList(id, title, archived = false) {
  return { id, title, expanded: true, createdAt: Date.now(), archived };
}

function demoItem(id, checklistId, text, done = false, archivedBy = null) {

    id,
    checklistId,
    text,
    done,
    createdAt: Date.now(),
    archived: archivedBy !== null,

}

/* Padded ids carry the order: a fresh stand database holds no order docs, so getAll hands the rows
   back sorted by key. */
function demoData() {
  const checklists = [];
  const items = [];
  DEMO_LISTS.forEach((title, index) => {
    const id = `l${String(index + 1).padStart(2, "0")}`;
    const size = DEMO_SIZES[index % DEMO_SIZES.length];
    checklists.push(demoList(id, title));
    for (let n = 0; n < size; n += 1) {
      const done = size > 1 && n % 3 === 0;
      items.push(demoItem(`${id}i${String(n + 1).padStart(3, "0")}`, id, DEMO_TASKS[n], done));
    }
  });
  checklists.push(demoList("l26", "Garage sale", true));
  for (let n = 0; n < 3; n += 1) {
    items.push(demoItem(`l26i00${n + 1}`, "l26", DEMO_TASKS[n], false, "list"));
  }
  // Out of live lists, and on top of their declared size, so every list still shows its own.
  items.push(demoItem("l03i901", "l03", DEMO_TASKS[10], false, "user"));
  items.push(demoItem("l04i901", "l04", DEMO_TASKS[11], false, "user"));
  items.push(demoItem("l04i902", "l04", DEMO_TASKS[12], true, "user"));
  return { checklists, items };
}

/* One transaction over a wiped stand, so a half-seeded or previously edited stand is never
   readable. The stand takes the given settings but never a selection: the selected ids live in
   whichever database the settings came from. */
function seedRows(conn, ui) {
  return withTx(conn, "readwrite", (tx) => {
    const data = demoData();
    const lists = tx.objectStore("checklists");
    const items = tx.objectStore("items");
    for (const name of STORES) {
      tx.objectStore(name).clear();
    }
    for (const row of data.checklists) lists.put(row);
    for (const row of data.items) items.put(row);
    if (ui) {
      tx.objectStore("doc").put({ key: UI_KEY, value: { ...ui, bulk: { kind: null, ids: [] } } });
    }
  });
}

async function seedStand(ui) {
  const conn = await openDb(DEMO_DB);
  try {
    await seedRows(conn, ui);
  } finally {
    conn.close();
  }
}

/* Hold-to-enter wiring for a button. Returns whether the last activation was a hold - run to the
   end, or let go once the fill had started - so the caller swallows the trailing click. A short
   press runs `onTap` from the click, or from keyup for keyboard activation. */
function demoHold(button, bar, onTap, onDone) {
  let wait = 0;
  let run = 0;
  let filling = false;
  let consumed = false;
  const stop = () => {
    clearTimeout(wait);
    clearTimeout(run);
    wait = 0;
    run = 0;
    filling = false;
    bar.style.transition = "none";
    bar.classList.remove("is-run");
  };
  const start = () => {
    stop();
    consumed = false;
    wait = setTimeout(() => {
      filling = true;
      bar.style.transition = `width ${DEMO_HOLD.total - DEMO_HOLD.wait}ms linear`;
      bar.classList.add("is-run");
      run = setTimeout(() => {
        stop();
        consumed = true;
        onDone();
      }, DEMO_HOLD.total - DEMO_HOLD.wait);
    }, DEMO_HOLD.wait);
  };
  // Letting go mid-fill is a broken hold, not a tap.
  const cancel = () => {
    if (filling) {
      consumed = true;
    }
    stop();
  };
  const key = (event) => event.key === "Enter" || event.key === " ";
  button.addEventListener("pointerdown", start);
  for (const type of ["pointerup", "pointercancel", "pointerleave", "lostpointercapture"]) {
    button.addEventListener(type, cancel);
  }
  // A long press is the hold, never the browser menu.
  button.addEventListener("contextmenu", (event) => event.preventDefault());
  // The browser activates a button on keydown (Enter) or keyup (Space); both are taken over here.
  button.addEventListener("keydown", (event) => {
    if (key(event) && !event.repeat) {
      event.preventDefault();
      start();
    }
  });
  button.addEventListener("keyup", (event) => {
    if (!key(event)) {
      return;
    }
    event.preventDefault();
    if (filling) {
      consumed = true;
      stop();
    } else if (wait) {
      stop();
      onTap();
    }
  });
  return () => {
    const was = consumed;
    consumed = false;
    return was;
  };
}
