<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TBD</title>
<meta name="description" content="TBD — checklists and to-do items, stored on this device.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='28' height='28' rx='8' fill='%234f46e5'/><path d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/></svg>">

<!-- Icons: external webfont (never inline svg). jsDelivr, then unpkg, then no glyphs at all —
     every icon button also carries a text label, so the app stays usable if both CDNs fail. -->
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk"
  crossorigin="anonymous"
  onerror="this.onerror=null;this.href='https://unpkg.com/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css'"
>

<script>
// Theme before first paint, so a dark system never flashes white.
// Mirrors settings.theme + applyTheme() below; keep the two in sync.
document.documentElement.dataset.theme = (() => {
  let mode = "system";
  try {
    mode = JSON.parse(localStorage.getItem("tbd.settings") || "{}").theme || "system";
  } catch (_error) {
    mode = "system";
  }
  if (mode === "dark") return "dark";
  if (mode === "light") return "light";
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
})();
</script>

<style>
/* ===== tokens ===== */

:root {
  --bg: #f5f6f8;
  --surface: #fff;
  --surface-2: #ebedf2;
  --text: #14161a;
  --muted: #667080;
  --border: #dfe2e9;
  --accent: #4f46e5;
  --accent-contrast: #fff;
  --danger: #c92a2a;
  --danger-contrast: #fff;
  --ring: rgb(79 70 229 / 0.35);
  --danger-ring: rgb(201 42 42 / 0.16);
  --shadow-1: 0 1px 2px rgb(14 18 27 / 0.06);
  --shadow-2: 0 12px 32px rgb(14 18 27 / 0.16);
  --radius: 14px;
  --radius-sm: 10px;
  --gutter: clamp(12px, 4vw, 24px);
  --col: 720px;
  --pad: 10px;
  --tap: 44px;
  --panel-w: 44px;
  --panel-gap: 14px;
  --topbar-h: 69px; /* height without safe-area; JS measures the real one at startup */

  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #0e1015;
  --surface: #171a21;
  --surface-2: #21262f;
  --text: #e8eaf0;
  --muted: #949fb1;
  --border: #2a3038;
  --accent: #8079ff;
  --accent-contrast: #0e1015;
  --danger: #ff7b7b;
  --danger-contrast: #1a0f14;
  --ring: rgb(128 121 255 / 0.4);
  --danger-ring: rgb(255 123 123 / 0.16);
  --shadow-1: 0 1px 2px rgb(0 0 0 / 0.4);
  --shadow-2: 0 12px 32px rgb(0 0 0 / 0.55);

  color-scheme: dark;
}

/* ===== base ===== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: rgb(0 0 0 / 0);
}

h1,
h2,
p,
ul {
  margin: 0;
  padding: 0;
}

button {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.skip-link {
  position: fixed;
  inset-block-start: var(--gutter);
  inset-inline-start: var(--gutter);
  z-index: 60;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  box-shadow: var(--shadow-2);
  color: var(--text);
  transform: translateY(-200%);
  transition: transform 120ms ease, opacity 120ms ease;
  opacity: 0;
  pointer-events: none;
}

.skip-link:focus {
  transform: none;
  opacity: 1;
  pointer-events: auto;
}

/* ===== header ===== */

.topbar {
  position: sticky;
  inset-block-start: 0;
  z-index: 30;
  padding-block: max(6px, env(safe-area-inset-top)) 6px;
  /* Solid first, then the translucent layer: without color-mix (old Safari) the header stays solid instead of transparent. */
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px) saturate(160%);
}

.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: min(100% - var(--gutter) * 2, var(--col));
  margin-inline: auto;
  padding-block: 6px;
  border-bottom: 1px solid var(--border);
}

.brand {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.06em;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 2px;
}

.menu-anchor {
  position: relative;
}

/* ===== icon buttons ===== */

.iconbtn {
  display: inline-grid;
  place-items: center;
  inline-size: var(--tap);
  block-size: var(--tap);
  padding: 0;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: none;
  cursor: pointer;
  transition: background-color 120ms ease, transform 120ms ease;
}

.iconbtn:active {
  transform: scale(0.95);
}

.iconbtn[disabled] {
  opacity: 0.4;
  cursor: default;
  pointer-events: none;
}

.iconbtn .bi {
  font-size: 18px;
}

@media (hover: hover) {
  .iconbtn:hover {
    background: var(--surface-2);
  }
}

/* ===== settings dropdown ===== */

.menu {
  position: absolute;
  inset-block-start: calc(100% + 8px);
  inset-inline-end: 0;
  z-index: 40;
  width: min(330px, calc(100vw - var(--gutter) * 2));
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-2);
}

.field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
}

.field-label {
  flex: 1;
  min-width: 0;
  font-size: 14px;
}

.field select {
  min-inline-size: 132px;
  max-inline-size: 160px;
  padding: 7px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: inherit;
  font: inherit;
  font-size: 16px; /* Safari zooms the page into focused fields smaller than 16px */
}

.sep {
  height: 1px;
  margin: 6px 8px;
  background: var(--border);
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  inline-size: 100%;
  padding: 9px 8px;
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  cursor: pointer;
  text-align: start;
}

@media (hover: hover) {
  .menu-item:hover {
    background: var(--surface-2);
  }
}

/* ===== lists ===== */

.main {
  width: min(100% - var(--gutter) * 2, var(--col));
  margin-inline: auto;
  padding: 12px 0 calc(28px + env(safe-area-inset-bottom));
}

.cl {
  margin-block-end: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  /* clip, not hidden: a swiped row stops at the card instead of widening the page,
     and clip keeps the sticky header sticky (hidden would make the card a scroller) */
  overflow-x: clip;
  background: var(--surface);
  box-shadow: var(--shadow-1);
}

.cl-head {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 6px 6px 4px;
  touch-action: pan-y; /* vertical drag scrolls the page; horizontal drag is a gesture */
  transition: transform 150ms ease;
}

/* The header of an open checklist sticks under the app header for as long as its
   own card is on screen; CSS does the tracking, so re-renders cannot desync it. */
.cl.is-open > .cl-head {
  position: sticky;
  inset-block-start: var(--topbar-h);
  z-index: 4; /* above a swiping row (3): a row dragged under the stuck header hides behind it */
  background: var(--surface);
  border-start-start-radius: calc(var(--radius) - 1px);
  border-start-end-radius: calc(var(--radius) - 1px);
}

/* Keep landing points clear of the two sticky bars when the browser scrolls:
   #list-items is where a checklist page change lands, .editor where focus lands,
   section.cl where "to top / to bottom" lands inside a one-page list. */
#list-items,
.editor,
section.cl {
  scroll-margin-block-start: calc(var(--topbar-h) + 8px);
}

.cl-heading {
  flex: 1;
  min-width: 0;
  font-size: inherit;
  font-weight: 600;
}

.cl-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  inline-size: 100%;
  padding: 7px 6px;
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  cursor: pointer;
  text-align: start;
}

.cl-toggle .bi {
  flex: none;
  padding-inline: 7px;
  font-size: 13px;
  color: var(--muted);
}

.cl-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.is-muted {
  color: var(--muted);
}

.items {
  list-style: none;
  padding: 0 var(--pad) 8px;
}

.item {
  display: flex;
  align-items: center;
  gap: 4px;
  position: relative; /* so a swiping row paints over its neighbours */
  min-height: 44px;
  padding-inline: 2px;
  border-radius: var(--radius-sm);
  touch-action: pan-y;
  transition: transform 150ms ease;
}

.item-row {
  display: flex;
  flex: 1;
  align-items: center;
  gap: 10px;
  min-width: 0;
  min-height: 44px;
  padding-inline: 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
}

.item-row input[type="checkbox"] {
  inline-size: 19px;
  block-size: 19px;
  flex: none;
  accent-color: var(--accent);
  cursor: pointer;
}

.item-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.item.is-done .item-text {
  color: var(--muted);
}

/* A row being swiped follows the pointer. The tint — inset shadow, so it lands on
   top of the stuck header's own background too — says which way it will go. */
.is-swiping {
  z-index: 3;
  transition: none; /* the row tracks the finger, no easing behind it */
}

/* Two values each: the plain token for a browser without color-mix (Safari < 16.2),
   the mixed one for every browser that has it. */
.swipe-edit {
  box-shadow: inset 0 0 0 200px var(--ring);
  box-shadow: inset 0 0 0 200px color-mix(in srgb, var(--accent) 14%, transparent);
}

.swipe-archive {
  box-shadow: inset 0 0 0 200px var(--danger-ring);
  box-shadow: inset 0 0 0 200px color-mix(in srgb, var(--danger) 16%, transparent);
}

/* Editor field and its save icon side by side. */
.edit-wrap {
  display: flex;
  flex: 1;
  align-items: center;
  gap: 4px;
  min-width: 0;
}

@media (hover: hover) {
  .cl-toggle:hover,
  .item-row:hover {
    background: var(--surface-2);
  }
}

.cl-empty,
.empty-hint {
  color: var(--muted);
  font-size: 14px;
}

.cl-empty {
  padding: 0 calc(var(--pad) + 8px) 12px;
}

.empty {
  padding: 40px 20px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  text-align: center;
}

.empty-title {
  font-weight: 600;
}

.empty-hint {
  margin-block-start: 4px;
}

/* ===== pager ===== */

.pager {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding-block: 2px 10px;
}

.pager-info {
  /* flex: none + nowrap: a long translated label must not be squeezed under an arrow */
  flex: none;
  min-inline-size: 112px;
  white-space: nowrap;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}

.noscript {
  width: min(100% - var(--gutter) * 2, var(--col));
  margin: 16px auto;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}

.notice {
  margin-block-end: 10px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  font-size: 14px;
}

/* ===== inline editor ===== */

.editor {
  flex: 1;
  min-width: 0;
  inline-size: 100%;
  padding: 7px 10px;
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: inherit;
  font: inherit;
  font-size: 16px; /* Safari zooms the page into focused fields smaller than 16px */
}

.editor:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px var(--ring);
}

/* ===== mini panel ===== */

.panel {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  gap: 6px;
  padding-inline-end: max(var(--gutter), env(safe-area-inset-right));
  pointer-events: none;
}

.panel .iconbtn {
  pointer-events: auto;
  inline-size: var(--panel-w);
  block-size: var(--panel-w);
  border-color: var(--border);
  background: var(--surface);
  box-shadow: var(--shadow-1);
}

@media (width >= 840px) {
  /* Past the lists on wide screens: 720px column + room for the panel. */
  .panel {
    padding-inline-end: max(var(--panel-gap), calc((100vw - var(--col)) / 2 - var(--panel-w) - var(--panel-gap)));
  }
}

/* ===== dialogs ===== */

dialog {
  position: fixed;
  inset: 0;
  margin: auto;
  width: min(440px, calc(100vw - var(--gutter) * 2));
  max-height: 80vh;
  max-height: 80svh;
  padding: 20px;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: inherit;
  box-shadow: var(--shadow-2);
}

dialog::backdrop {
  background: rgb(8 10 14 / 0.55);
}

.dialog-title {
  margin-block-end: 8px;
  font-size: 17px;
  font-weight: 700;
}

.dialog-subject {
  margin-block-end: 8px;
  overflow-wrap: anywhere;
  color: var(--muted);
}

/* Rows of the 3-dot menu; .menu-item is the same row style the settings dropdown uses. */
.dialog-menu {
  display: grid;
  gap: 2px;
}

.dialog-body {
  white-space: pre-line;
  /* URLs and long words must not run past the dialog edge: break only where a
     line would otherwise not fit */
  overflow-wrap: anywhere;
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-block-start: 16px;
}

.btn {
  padding: 9px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  cursor: pointer;
}

.btn--accent {
  border-color: transparent;
  background: var(--accent);
  color: var(--accent-contrast);
}

.btn--danger {
  border-color: transparent;
  background: var(--danger);
  color: var(--danger-contrast);
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: 1ms !important;
    animation-duration: 1ms !important;
  }
}
</style>
</head>
<body>
<a class="skip-link" href="#lists" data-i18n="skip">Skip to lists</a>

<header class="topbar">
  <div class="topbar-inner">
    <h1 class="brand">TBD</h1>
    <div class="topbar-actions">
      <button id="btn-add" class="iconbtn" type="button" data-i18n-label="addChecklist" aria-label="Add checklist" title="Add checklist"><i class="bi bi-plus-lg" aria-hidden="true"></i></button>
      <div class="menu-anchor">
        <button id="btn-settings" class="iconbtn" type="button" data-i18n-label="settings" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false" title="Settings"><i class="bi bi-gear" aria-hidden="true"></i></button>
        <div id="settings" class="menu" role="dialog" data-i18n-aria="settings" aria-label="Settings" hidden>
          <label class="field" for="set-theme">
            <span class="field-label" data-i18n="theme">Theme</span>
            <select id="set-theme"></select>
          </label>
          <label class="field" for="set-language">
            <span class="field-label" data-i18n="language">Language</span>
            <select id="set-language"></select>
          </label>
          <div class="sep"></div>
          <label class="field" for="set-checklist">
            <span class="field-label" data-i18n="newChecklist">New checklist</span>
            <select id="set-checklist"></select>
          </label>
          <label class="field" for="set-item">
            <span class="field-label" data-i18n="newItem">New item</span>
            <select id="set-item"></select>
          </label>
          <label class="field" for="set-page-size">
            <span class="field-label" data-i18n="pageSize">Per page</span>
            <select id="set-page-size"></select>
          </label>
          <div class="sep"></div>
          <button id="btn-archive" class="menu-item" type="button"><i class="bi bi-archive" aria-hidden="true"></i><span data-i18n="archive">Archive</span></button>
        </div>
      </div>
      <button id="btn-help" class="iconbtn" type="button" data-i18n-label="help" aria-label="Help" title="Help"><i class="bi bi-question-lg" aria-hidden="true"></i></button>
    </div>
  </div>
</header>

<noscript><p class="noscript">TBD needs JavaScript to run.</p></noscript>

<main id="lists" class="main" tabindex="-1" data-i18n-aria="lists" aria-label="Lists">
  <p id="storage-warning" class="notice" role="status" hidden></p>
  <div id="list-items"></div>
  <div class="panel" role="toolbar" data-i18n-aria="lists" aria-label="Lists" aria-orientation="vertical">
    <button id="btn-expand-all" class="iconbtn" type="button" data-i18n-label="expandAll" aria-label="Expand all checklists" title="Expand all"><i class="bi bi-arrows-expand" aria-hidden="true"></i></button>
    <button id="btn-collapse-all" class="iconbtn" type="button" data-i18n-label="collapseAll" aria-label="Collapse all checklists" title="Collapse all"><i class="bi bi-arrows-collapse" aria-hidden="true"></i></button>
  </div>
</main>

<dialog id="dlg-note" aria-labelledby="note-title" tabindex="-1">
  <h2 id="note-title" class="dialog-title"></h2>
  <p id="note-body" class="dialog-body"></p>
  <form method="dialog" class="dialog-actions">
    <button class="btn btn--accent" type="submit" data-i18n="close">Close</button>
  </form>
</dialog>

<dialog id="dlg-menu" aria-labelledby="menu-title" aria-describedby="menu-subject" tabindex="-1">
  <h2 id="menu-title" class="dialog-title" data-i18n="actions">Actions</h2>
  <p id="menu-subject" class="dialog-subject"></p>
  <div id="menu-actions" class="dialog-menu"></div>
  <div class="dialog-actions">
    <button id="menu-cancel" class="btn" type="button" data-i18n="cancel">Cancel</button>
  </div>
</dialog>

<dialog id="dlg-confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body" tabindex="-1">
  <h2 id="confirm-title" class="dialog-title"></h2>
  <p id="confirm-body" class="dialog-body"></p>
  <div class="dialog-actions">
    <button id="confirm-cancel" class="btn" type="button" data-i18n="cancel">Cancel</button>
    <button id="confirm-ok" class="btn btn--danger" type="button"></button>
  </div>
</dialog>

<script>
/* ===========================================================================
   TBD — one-file todo app. docs/spec.md
   1. utils  2. storage + store  3. data model  4. settings  5. i18n
   6. render  7. actions  8. wiring
   =========================================================================== */
(() => {
  "use strict";

  const doc = document;
  const root = doc.documentElement;
  const $ = (selector, scope = doc) => scope.querySelector(selector);

  /* ---------------------------------------------------------------- utils */

  /* Every node is built in code and every piece of user text goes through
     textContent — user data can never become markup. */
  function setProp(node, key, value) {
    if (key === "class") {
      node.className = [value].flat(1).filter(Boolean).join(" ");
      return;
    }
    if (key === "text") {
      node.textContent = String(value);
      return;
    }
    if (key === "value" || key === "checked" || key === "disabled") {
      node[key] = value;
      return;
    }
    node.setAttribute(key, value === true ? "" : String(value));
  }

  function el(tag, props, ...kids) {
    const node = doc.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value !== null && value !== undefined && value !== false) setProp(node, key, value);
    }
    node.append(...kids.flat().filter((kid) => kid !== null && kid !== undefined && kid !== false)
      .map((kid) => (kid instanceof Node ? kid : doc.createTextNode(String(kid)))));
    return node;
  }

  const icon = (name) => el("i", { class: `bi bi-${name}`, "aria-hidden": "true" });

  function uid() {
    if (window.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
    return `x${Date.now().toString(36)}${Math.random().toString(36).slice(2, 10)}`;
  }

  function asText(value) {
    if (typeof value === "string") return value;
    if (typeof value === "number" && Number.isFinite(value)) return String(value);
    return "";
  }

  function asStamp(value) {
    return typeof value === "number" && Number.isFinite(value) && value > 0 ? value : null;
  }

  /* ---------------------------------------------------- storage + store */

  const KEYS = { data: "tbd.data", settings: "tbd.settings", probe: "tbd.probe" };
  const SCHEMA = 1;

  /* Safari private mode and some file:// contexts throw on localStorage. */
  const memory = new Map();
  const memoryStorage = {
    getItem: (key) => (memory.has(key) ? memory.get(key) : null),
    setItem: (key, value) => { memory.set(key, String(value)); },
    removeItem: (key) => { memory.delete(key); },
  };

  const storage = (() => {
    try {
      const { localStorage } = window;
      localStorage.setItem(KEYS.probe, "1");
      localStorage.removeItem(KEYS.probe);
      return localStorage;
    } catch (error) {
      console.warn("TBD: storage is blocked, this session is kept in memory only.", error);
      return memoryStorage;
    }
  })();

  const memoryOnly = storage === memoryStorage;

  /* Data schema bumps, oldest first. Settings never run these. */
  const DATA_MIGRATIONS = {
    /* 2: (db) => { db.checklists.forEach((cl) => { cl.pinned = false; }); return db; }, */
  };

  function migrate(raw, blank, migrations) {
    if (raw === null || typeof raw !== "object") return blank();
    const from = Number.isFinite(raw.schema) ? raw.schema : 0;
    if (from > SCHEMA) return raw; // newer data: boot() marks the store read-only; the on-screen line says so
    let db = raw;
    for (let version = from + 1; version <= SCHEMA; version += 1) {
      const step = migrations[version];
      if (step) db = step(db) || db;
    }
    db.schema = SCHEMA;
    return db;
  }

  /* Reactive wrapper over storage: read with get(), write with update()/patch(). */
  function createStore(key, blank, normalize, migrations) {
    const listeners = new Set();
    let readOnly = false;
    let writeFailed = false;
    let db = boot();

    function boot() {
      let raw = null;
      try {
        raw = JSON.parse(storage.getItem(key));
      } catch (error) {
        console.warn(`TBD: unreadable ${key}, starting from an empty store.`, error);
      }
      /* Written by a newer build: usable in memory, never written back by this one. */
      readOnly = raw !== null && typeof raw === "object" && raw.schema > SCHEMA;
      try {
        return normalize(migrate(raw, blank, migrations));
      } catch (error) {
        console.warn(`TBD: ${key} could not be repaired, starting from an empty store.`, error);
        return normalize(blank());
      }
    }

    function persist() {
      if (readOnly) return; // never downgrade newer data
      try {
        storage.setItem(key, JSON.stringify(db));
      } catch (error) {
        writeFailed = true;
        console.warn("TBD: could not write to storage, changes stay in this session.", error);
      }
    }

    function commit() {
      persist();
      for (const listener of listeners) listener(db);
    }

    return {
      get: () => db,
      readOnly: () => readOnly,
      blocked: () => writeFailed,
      update(mutate) {
        mutate(db);
        commit();
      },
      /* Like update(), but listeners stay asleep: the caller has already applied
         this change to the DOM itself (see the checkbox handler in bindLists). */
      updateQuiet(mutate) {
        const result = mutate(db);
        persist();
        return result;
      },
      patch(values) {
        Object.assign(db, values);
        commit();
      },
      subscribe(listener) {
        listeners.add(listener);
        return () => listeners.delete(listener);
      },
      reload() {
        db = boot();
        for (const listener of listeners) listener(db);
      },
    };
  }

  /* archivedAt === null means active. An item is hidden while its checklist is
     archived (whole list hidden); items archived before their checklist keep a
     lower archivedAt, so they return only with the checklist (task 5). */
  function blankDB() {
    return { schema: SCHEMA, checklists: [] };
  }

  function makeChecklist() {
    return { id: uid(), title: "", open: true, createdAt: Date.now(), updatedAt: null, archivedAt: null, items: [] };
  }

  function makeItem() {
    return { id: uid(), text: "", done: false, createdAt: Date.now(), updatedAt: null, archivedAt: null };
  }

  function validId(value, ids) {
    const id = asText(value);
    if (id && !ids.has(id)) return id;
    return uid();
  }

  function normalizeItem(raw, ids) {
    if (raw === null || typeof raw !== "object") return null;
    const id = validId(raw.id, ids);
    ids.add(id);
    return {
      id,
      text: asText(raw.text),
      done: raw.done === true,
      createdAt: asStamp(raw.createdAt),
      updatedAt: asStamp(raw.updatedAt),
      archivedAt: asStamp(raw.archivedAt),
    };
  }

  function normalizeChecklist(raw, ids) {
    if (raw === null || typeof raw !== "object") return null;
    const id = validId(raw.id, ids);
    ids.add(id);
    const checklist = {
      id,
      title: asText(raw.title),
      open: raw.open !== false,
      createdAt: asStamp(raw.createdAt),
      updatedAt: asStamp(raw.updatedAt),
      archivedAt: asStamp(raw.archivedAt),
      items: [],
    };
    if (Array.isArray(raw.items)) {
      for (const rawItem of raw.items) {
        const item = normalizeItem(rawItem, ids);
        if (item) checklist.items.push(item);
      }
    }
    return checklist;
  }

  /* Stored data is untrusted: rebuild the shape, drop what is not an entity. */
  function normalizeDB(raw) {
    const db = blankDB();
    const ids = new Set();
    if (raw !== null && typeof raw === "object" && Array.isArray(raw.checklists)) {
      for (const rawChecklist of raw.checklists) {
        const checklist = normalizeChecklist(rawChecklist, ids);
        if (checklist) db.checklists.push(checklist);
      }
    }
    return db;
  }

  };

  function castSetting(name, value) {
    const spec = SETTING_SPECS[name];
    if (!spec) return value;
    let next = asText(value);
    if (spec.numeric && next !== "all") next = Number(value);
    if (spec.values.includes(next)) return next;
    return spec.default;
  }

  function blankSettings() {
    const out = { schema: SCHEMA };
    for (const name of Object.keys(SETTING_SPECS)) out[name] = SETTING_SPECS[name].default;
    return out;
  }

  function normalizeSettings(raw) {
    const source = raw !== null && typeof raw === "object" ? raw : {};

    for (const name of Object.keys(SETTING_SPECS)) out[name] = castSetting(name, source[name]);

    language: { auto: "langAuto" }, // the other 11 name themselves, see LANGUAGE_NAMES
  };

  /* Current language, then English, then the key itself; %1…%9 come from args. */
  function t(key, args) {
    const text = STRINGS[root.lang]?.[key] ?? STRINGS.en[key] ?? key;
    if (!args) return text;
    return text.replace(/%(\d)/g, (match, index) => args[Number(index) - 1] ?? match);
  }

  /* The markup keeps English text as its default and points at the dictionary with
     data-i18n (text), data-i18n-label (label + tooltip) and data-i18n-aria (label). */
  let shownLang = "";
  function applyStrings() {
    if (root.lang === shownLang) return; // captions only move with the language
    shownLang = root.lang;
    for (const node of doc.querySelectorAll("[data-i18n]")) node.textContent = t(node.dataset.i18n);
    for (const node of doc.querySelectorAll("[data-i18n-label]")) {
      node.setAttribute("aria-label", t(node.dataset.i18nLabel));
      node.title = t(node.dataset.i18nLabel);
    }
    for (const node of doc.querySelectorAll("[data-i18n-aria]")) node.setAttribute("aria-label", t(node.dataset.i18nAria));
    for (const [name, select] of Object.entries(selects)) {
      const keys = OPTION_KEYS[name];
      select.replaceChildren(...SETTING_SPECS[name].values.map((value) => el("option", {
        value: String(value),
        text: keys?.[value] ? t(keys[value]) : LANGUAGE_NAMES[value] ?? String(value),
      })));
    }
  }

  /* ------------------------------------------------------- pagination */

  /* One page of a list: what to show plus the page number clamped to what the
     data allows — the store shrinks between renders whenever anything is removed. */
  function paginate(list, page, size) {
    const pages = size === "all" ? 1 : Math.max(1, Math.ceil(list.length / size));
    const current = Math.min(Math.max(1, Math.trunc(page) || 1), pages);
    const from = size === "all" ? 0 : (current - 1) * size;
    return { current, pages, shown: size === "all" ? list : list.slice(from, from + size) };
  }

  /* The page an entity at one end of its list is found on — a newly created one, or one
     just moved to the top or the bottom — so the user is never left on a page without
     it: page 1 for "above all", the last page for "below all". */
  function pageForPosition(count, position) {
    const size = settings().pageSize;
    if (position !== "bottom" || size === "all") return 1;
    return Math.ceil(count / size);
  }

  /* landmark=false renders the pager as a named group, not a nav: two checklists
     sharing a title would give screen readers two identically-named navs. */
  function pagerNode(key, label, page, landmark = true) {
    const button = (dir, text) => el("button", {
      class: "iconbtn", type: "button", "data-act": "page", "data-dir": String(dir),
      disabled: dir < 0 ? page.current <= 1 : page.current >= page.pages,
      /* The page number rides along in the name: after a page change focus lands on
         this button, and its name is all a screen reader gets to announce. */
      "aria-label": `${text}, ${t("pageInfo", [page.current, page.pages])}`,
      title: text,
    }, icon(dir < 0 ? "chevron-left" : "chevron-right"));
    return el(landmark ? "nav" : "div", { class: "pager", role: landmark ? null : "group", "data-pager": String(key), "aria-label": label },
      button(-1, t("prevPage")),
      el("span", { class: "pager-info", text: t("pageInfo", [page.current, page.pages]) }),
      button(1, t("nextPage")));
  }

  /* ----------------------------------------------------------- render */

  /* An icon button of a row: "+", the pencil, the 3-dot menu, save. */
  const iconButton = (act, label, glyph) => el("button", {
    class: "iconbtn", type: "button", "data-act": act, "aria-label": label, title: label,
  }, icon(glyph));

  function editorNode(edit, value, label) {
    /* edit.value carries what has been typed but not saved yet: a settings change
       from the other window rebuilds this field, and the store knows nothing of it. */
    const input = el("input", {
      class: "editor", type: "text", value: edit.value ?? value, maxlength: "4000", enterkeyhint: "done",
      spellcheck: "false", autocomplete: "off", "aria-label": label,
    });
    edit.node = input; // the live editor node: a stale blur commit checks itself against this
    input.addEventListener("input", () => { edit.value = input.value; });
    input.addEventListener("keydown", (event) => {
      if (event.isComposing) return; // Enter commits an IME candidate (zh/ja), not the text
      if (event.key === "Enter") {
        event.preventDefault();
        endEdit(edit, input.value, false, true);
      } else if (event.key === "Escape") {
        event.preventDefault();
        endEdit(edit, "", true, false);
      }
    });
    /* The click that moved focus away was aimed at the DOM from before the save.
       Committing after it has landed keeps that click from missing its button.
       endEdit ignores the second call when both the click and the timer fire. */
    input.addEventListener("blur", () => {
      const commit = () => {
        doc.removeEventListener("click", commit, true);
        /* A re-render rebuilds this field (a settings change, even from the other
           window) and only Chrome fires blur when it removes the focused node: a
           commit from a dead node must not save half-typed text and close the live editor. */
        if (edit.node !== input) return;
        endEdit(edit, input.value, false, false);
      };
      doc.addEventListener("click", commit, { capture: true, once: true });
      setTimeout(commit, 600); // blur without a click (Tab, re-render); slack for a slow synthesized tap
    });
    /* The save icon is the edit field's own commit: for anyone who would rather press
       something than press Enter. */
    return el("div", { class: "edit-wrap" }, input, iconButton("save-edit", t("save"), "check-lg"));
  }

  const editingFor = (kind, id) => (ui.editing && ui.editing.kind === kind && ui.editing.id === id ? ui.editing : null);
  const freshItemFor = (id) => (ui.editing && ui.editing.fresh && ui.editing.kind === "item" && ui.editing.parentId === id ? ui.editing : null);

  const allDone = (checklist) => checklist.items.length > 0 && checklist.items.every((item) => item.done);

  function checklistHeading(checklist) {
    const edit = editingFor("checklist", checklist.id);
    if (edit) return editorNode(edit, checklist.title, t("checklistTitle"));
    const muted = allDone(checklist);
    /* The arrow keeps its own tooltip: with a cut-off name a click on the name
       opens the full text, so the arrow is what opens and closes the card. */
    const chevron = el("i", {
      class: `bi bi-chevron-${checklist.open ? "up" : "right"}`, "aria-hidden": "true", title: t("toggleList"),
    });
    const name = checklist.title || t("untitled");
    const title = el("span", { class: ["cl-title", muted && "is-muted"], text: name });
    return el("button", {
      class: "cl-toggle",
      type: "button",
      "data-act": "toggle",
      "aria-expanded": checklist.open ? "true" : "false",
      title: name,
    }, chevron, title);
  }

  function itemRow(item) {
    const edit = editingFor("item", item.id);
    if (edit) return el("li", { class: "item", "data-id": item.id }, editorNode(edit, item.text, t("itemText")));
    const name = item.text || t("untitled");
    const box = el("input", { type: "checkbox", checked: item.done, "aria-label": name });
    const text = el("span", { class: "item-text", title: name, text: name });
    /* The menu button sits beside the label, never inside it: a click on it must not
       tick the item on the way to the dialog. */
    return el("li", { class: ["item", item.done && "is-done"], "data-id": item.id },
      el("label", { class: "item-row" }, box, text),
      iconButton("menu", `${t("actions")}: ${name}`, "three-dots-vertical"));
  }

  /* A brand-new item shows here as an editor row before it exists in the store. */
  function visibleItems(checklist) {
    const items = checklist.items.filter((item) => item.archivedAt === null);
    const edit = freshItemFor(checklist.id);
    if (edit) {
      if (settings().itemPosition === "top") items.unshift(edit.entity);
      else items.push(edit.entity);
    }
    return items;
  }

  /* Returns the nodes of one open checklist: its items, then the pager when there is one. */
  function checklistBody(checklist) {
    const items = visibleItems(checklist);
    if (!items.length) return [el("p", { class: "cl-empty", text: t("noItems") })];
    /* A brand-new item is drawn before it exists: keep following its page, so typing
       on from the last row of a page never hides the field being typed in. */
    const wanted = freshItemFor(checklist.id)
      ? pageForPosition(items.length, settings().itemPosition)
      : ui.pages.items[checklist.id] ?? 1;
    const page = paginate(items, wanted, settings().pageSize);
    ui.pages.items[checklist.id] = page.current;
    const nodes = [el("ul", { class: "items" }, page.shown.map(itemRow))];
    /* Named after its checklist: "Item pages" alone would not say which list it pages. */
    if (page.pages > 1) nodes.push(pagerNode(checklist.id, `${t("itemPages")}: ${checklist.title || t("untitled")}`, page, false));
    return nodes;
  }

  function checklistNode(checklist) {
    /* Pencil, "+", 3-dot menu. All of them step aside while the title is being typed:
       the head is a field then, and a half-made checklist is not in the store yet. */
    const actions = editingFor("checklist", checklist.id) ? [] : [
      iconButton("edit", t("edit"), "pencil"),
      checklist.open ? iconButton("add-item", t("addItem"), "plus-lg") : null,
      iconButton("menu", `${t("actions")}: ${checklist.title || t("untitled")}`, "three-dots-vertical"),
    ];
    const head = el("div", { class: "cl-head" }, el("h2", { class: "cl-heading" }, checklistHeading(checklist)), actions);
    return el("section", { class: ["cl", checklist.open && "is-open"], "data-id": checklist.id },
      head, checklist.open ? checklistBody(checklist) : null);
  }

  function emptyState() {
    const title = el("p", { class: "empty-title", text: t("emptyTitle") });
    const hint = el("p", { class: "empty-hint", text: t("emptyHint") });
    return el("div", { class: "empty" }, title, hint);
  }

  /* Re-rendering swaps nodes, so remember what had focus and put it back. The pager
     is rebuilt too: its buttons are remembered by list + direction. */
  function captureFocus() {
    const active = doc.activeElement;
    if (!active || !listsEl.contains(active)) return null;
    const pager = active.closest("[data-pager]");
    if (pager) return { pager: pager.dataset.pager, dir: active.dataset.dir };
    const holder = active.closest("[data-id]");
    if (!holder) return null;
    return { id: holder.dataset.id, checkbox: active.matches('input[type="checkbox"]') };
  }

  function restoreFocus(target) {
    if (!target) return;
    /* Putting focus back must never move the screen: restoring it into a card that
       just collapsed out of view would drag the page to it (a stuck header closing
       jumped to the top). Page changes do their own scrolling after the render. */
    const options = { preventScroll: true };
    if (target.pager) {
      const nav = listsEl.querySelector(`[data-pager="${CSS.escape(target.pager)}"]`);
      const buttons = nav ? [...nav.querySelectorAll("button")] : [];
      const node = buttons.find((button) => button.dataset.dir === target.dir && !button.disabled)
        || buttons.find((button) => !button.disabled); // the wanted one hit a page edge
      if (node) node.focus(options);
      else mainEl.focus(options); // the list shrank to one page: keep the keyboard in the page
      return;
    }
    const holder = listsEl.querySelector(`[data-id="${CSS.escape(target.id)}"]`);
    if (!holder) {
      mainEl.focus(options); // its row is gone: keep the keyboard in the page, not in <body>
      return;
    }
    const node = target.checkbox ? holder.querySelector('input[type="checkbox"]') : holder.querySelector("button, input");
    if (node) node.focus(options);
  }

  function renderLists() {
    const previous = captureFocus();
    const checklists = activeChecklists();
    const edit = ui.editing;
    if (edit && edit.fresh && edit.kind === "checklist") {
      /* A brand-new checklist: drawn at its settings position, but not stored yet. */
      if (settings().checklistPosition === "bottom") checklists.push(edit.entity);
      else checklists.unshift(edit.entity);
      // Same as for a new item: jump to the page the editor sits on, then scroll to it.
      ui.pages.checklists = pageForPosition(checklists.length, settings().checklistPosition);
    }
    const page = paginate(checklists, ui.pages.checklists, settings().pageSize);
    ui.pages.checklists = page.current;
    const nodes = page.shown.length ? page.shown.map(checklistNode) : [emptyState()];
    if (page.pages > 1) nodes.push(pagerNode("checklists", t("checklistPages"), page));
    listsEl.replaceChildren(...nodes);
    if (ui.focusEditor) {
      ui.focusEditor = false;
      ui.focusAfter = null; // this render goes to the field, not to the row a dialog asked for
      const input = $(".editor", listsEl);
      if (input) {
        input.focus();
        input.select();
        return;
      }
    }
    /* A dialog that closed over a row asks for the focus back; a plain render puts it
       where it was before the lists were rebuilt. */
    restoreFocus(ui.focusAfter || previous);
    ui.focusAfter = null;
  }

  function renderToolbar() {
    const checklists = activeChecklists();
    const open = checklists.filter((checklist) => checklist.open).length;
    const focused = [expandBtn, collapseBtn].find((btn) => doc.activeElement === btn);
    expandBtn.disabled = open === checklists.length;
    collapseBtn.disabled = open === 0;
    /* Disabling the focused button drops the keyboard to <body>; hand it to the sibling. */
    if (focused && focused.disabled) (focused === expandBtn ? collapseBtn : expandBtn).focus();
  }

  function syncSettingsForm() {
    for (const [name, select] of Object.entries(selects)) select.value = String(settings()[name]);
  }

  /* Without a visible line, changes that silently never reach storage would just vanish. */
  function renderStorageWarning() {
    let msg = "";
    if (data.readOnly() || settingsStore.readOnly()) msg = t("dataNewer");
    else if (memoryOnly || data.blocked() || settingsStore.blocked()) msg = t("storageBlocked");
    storageWarnEl.textContent = msg;
    storageWarnEl.hidden = !msg;
  }

  /* Landing after a page change: checklists from their top, items with the pager
     they clicked kept at the bottom of the screen, so nobody is left mid-list. */
  function scrollAfterRender() {
    const key = ui.scrolledTo;
    if (!key) return;
    ui.scrolledTo = null;
    /* Three kinds of landing point: the whole list from its top, a single checklist
       card from its top ("card:<id>", used by to top / to bottom), or the end of a
       page, where its pager sits. A list on one page has no pager: aim at the card. */
    const card = key.startsWith("card:");
    const id = card ? key.slice(5) : key;
    const find = (what) => listsEl.querySelector(`[${what}="${CSS.escape(id)}"]`);
    const node = id === "checklists" ? listsEl : find(card ? "data-id" : "data-pager") || find("data-id");
    if (!node) return;
    const toEnd = !card && id !== "checklists";
    node.scrollIntoView({ block: toEnd ? "end" : "start", behavior: motionQuery.matches ? "auto" : "smooth" });
  }

  function render() {
    applyStrings();
    renderLists();
    renderToolbar();
    syncSettingsForm();
    renderStorageWarning();
    scrollAfterRender();
  }

  /* --------------------------------------------------------- appearance */

  function applyTheme() {
    const mode = settings().theme;
    let dark;
    if (mode === "dark") dark = true;
    else if (mode === "light") dark = false;
    else dark = darkQuery.matches;
    root.dataset.theme = dark ? "dark" : "light";
    // One source for the color: the --bg token of the theme just switched to.
    $('meta[name="theme-color"]').content = getComputedStyle(root).getPropertyValue("--bg").trim();
  }

  function applyLanguage() {
    const wanted = settings().language;
    if (wanted !== "auto") {
      root.lang = wanted;
      return;
    }
    const tags = (window.navigator.languages || []).concat(window.navigator.language || []);
    for (const tag of tags) {
      const code = String(tag).toLowerCase().split("-")[0];
      if (LANGS.includes(code)) {
        root.lang = code;
        return;
      }
    }
    root.lang = "en";
  }

  /* ----------------------------------------------------------- actions */

  /* A brand-new entity lives in memory until its first text, so an abandoned
     "+" leaves nothing behind — not even after a reload. */
  function addChecklist() {
    const entity = makeChecklist();
    ui.editing = { kind: "checklist", id: entity.id, fresh: true, entity };
    ui.focusEditor = true;
    render();
  }

  function addItem(checklistId) {
    const checklist = db().checklists.find((row) => row.id === checklistId);
    if (!checklist) return; // e.g. a new checklist abandoned a moment ago
    const entity = makeItem();
    ui.editing = { kind: "item", id: entity.id, fresh: true, parentId: checklistId, entity };
    ui.focusEditor = true;
    render();
  }

  function toggleChecklist(checklistId) {
    data.update((store) => {
      const checklist = store.checklists.find((row) => row.id === checklistId);
      if (!checklist) return;
      checklist.open = !checklist.open;
      checklist.updatedAt = Date.now();
    });
  }

  /* Quiet on purpose: the click handler ticks the box and swaps the classes in
     place, so marking done does not pay for a full re-render. Pagination is safe
     here: pages are cut by what exists, not by what is done, so the row stays. */
  function toggleItem(itemId) {
    return data.updateQuiet((store) => {
      for (const checklist of store.checklists) {
        const item = checklist.items.find((row) => row.id === itemId);
        if (item) {
          item.done = !item.done;
          item.updatedAt = Date.now();
          return { item, checklist };
        }
      }
      return null;
    });
  }

  function setAllOpen(open) {
    data.update((store) => {
      const stamp = Date.now();
      for (const checklist of store.checklists) {
        if (checklist.archivedAt !== null || checklist.open === open) continue;
        checklist.open = open;
        checklist.updatedAt = stamp;
      }
    });
  }

  function locate(store, edit) {
    if (edit.kind === "checklist") {
      return { list: store.checklists, index: store.checklists.findIndex((row) => row.id === edit.id) };
    }
    for (const checklist of store.checklists) {
      const index = checklist.items.findIndex((row) => row.id === edit.id);
      if (index !== -1) return { list: checklist.items, index, checklistId: checklist.id };
    }
    return { list: null, index: -1 };
  }

  function insertFresh(edit, text) {
    const entity = edit.entity;
    entity[edit.kind === "checklist" ? "title" : "text"] = text;
    entity.updatedAt = Date.now();
    data.update((store) => {
      if (edit.kind === "checklist") {
        if (settings().checklistPosition === "bottom") store.checklists.push(entity);
        else store.checklists.unshift(entity);
        return;
      }
      const checklist = store.checklists.find((row) => row.id === edit.parentId);
      if (!checklist) return; // its checklist disappeared in another tab
      if (settings().itemPosition === "top") checklist.items.unshift(entity);
      else checklist.items.push(entity);
    });
  }

  /* Enter/blur save, Escape discards. Enter on a brand-new item opens the next
     one right away, so a whole list can be typed without reaching for "+". */
  function endEdit(edit, value, discard, keep) {
    if (edit.settled) return; // the deferred blur save of an already-closed editor
    edit.settled = true;
    if (ui.editing === edit) ui.editing = null;
    /* The other window wrote something while this field was open: adopt its data
       first, so the text just typed lands on top of it instead of overwriting it. */
    if (staleData) {
      staleData = false;
      data.reload();
    }
    if (discard) {
      render(); // Escape cancels: the stored text is neither read nor overwritten
      return;
    }
    const text = value.trim();
    if (edit.fresh) {
      if (!text) {
        render(); // nothing was ever stored, the editor simply goes away
        return;
      }
      if (keep && edit.kind === "item") {
        const next = makeItem();
        ui.editing = { kind: "item", id: next.id, fresh: true, parentId: edit.parentId, entity: next };
        ui.focusEditor = true;
      }
      insertFresh(edit, text);
      return;
    }
    data.update((store) => {
      const { list, index } = locate(store, edit);
      if (list && index !== -1) {
        const entity = list[index];
        entity[edit.kind === "checklist" ? "title" : "text"] = text;
        entity.updatedAt = Date.now();
        return;
      }
      /* Another window deleted this row while the field was open. Nothing typed here is
         thrown away: it becomes an entry of the same list — an emptied field stores
         nothing. shortcut: when that list is gone too the text has nowhere to live and
         the editor simply closes. */
      if (!text) return;
      if (edit.kind === "checklist") store.checklists.push({ ...makeChecklist(), title: text, updatedAt: Date.now() });
      else {
        const checklist = store.checklists.find((row) => row.id === edit.parentId);
        if (checklist) checklist.items.push({ ...makeItem(), text, updatedAt: Date.now() });
      }
    });
  }

  /* The record itself, or null: another window can delete it while a dialog is open. */
  function entityOf(kind, id) {
    const { list, index } = locate(db(), { kind, id });
    return index === -1 ? null : list[index];
  }

  /* The name an entity is referred to in dialogs and in screen-reader labels; "" when
     the entity is gone, which every caller here checks before showing anything. */
  function entityName(kind, id) {
    const entity = entityOf(kind, id);
    return entity ? entity[kind === "checklist" ? "title" : "text"] || t("untitled") : "";
  }

  /* Inline editing of something that already exists. Entry points: swipe right (both
     kinds), double click (items), the pencil (checklists) and F2 (keyboard only). */
  function startEdit(kind, id) {
    if (ui.editing) return; // one editor at a time: never drop the text being typed
    if (!entityOf(kind, id)) return; // the row is gone (another window); an editor with no row would hang
    /* Which list the item lives in, remembered: if another window deletes the row while
       this field is open, what is typed still goes back where it belongs. */
    const parentId = kind === "item" ? locate(db(), { kind, id }).checklistId : null;
    ui.editing = { kind, id, parentId };
    ui.focusEditor = true;
    render();
  }

  /* The save icon commits exactly what Enter commits. */
  function saveEdit() {
    const edit = ui.editing;
    if (edit) endEdit(edit, edit.node ? edit.node.value : "", false, false);
  }

  function archiveEntity(kind, id) {
    if (!entityOf(kind, id)) return; // deleted in another window while its dialog was open
    ui.focusAfter = { id };
    data.update((store) => {
      const { list, index } = locate(store, { kind, id });
      if (list && index !== -1) list[index].archivedAt = Date.now();
    });
  }

  /* Deleting a checklist drops the whole record, items included: archived ones live
     inside it, so nothing of a deleted checklist is left behind (task 5). */
  function deleteEntity(kind, id) {
    if (!entityOf(kind, id)) return;
    ui.focusAfter = { id };
    data.update((store) => {
      const { list, index } = locate(store, { kind, id });
      if (!list || index === -1) return;
      list.splice(index, 1);
      if (kind === "checklist") delete ui.pages.items[id]; // its page counter is gone with it
    });
  }

  /* To top / to bottom inside the entity's own list, then show the page it moved to.
     The destination is worked out before the move — moving changes no counts — so the
     page and the scroll target are already in place when the store renders. */
  function moveTo(kind, id, bottom) {
    if (!entityOf(kind, id)) return;
    const position = bottom ? "bottom" : "top";
    let target;
    if (kind === "checklist") {
      target = { key: `card:${id}`, page: pageForPosition(activeChecklists().length, position) };
    } else {
      const checklist = db().checklists.find((row) => row.items.some((item) => item.id === id));
      if (!checklist) return;
      const count = checklist.items.filter((item) => item.archivedAt === null).length;
      /* At the bottom, land on the end of the page (its pager, so the last rows are on
         screen); at the top, on the card itself. */
      target = {
        key: bottom ? checklist.id : `card:${checklist.id}`,
        page: pageForPosition(count, position),
        checklistId: checklist.id,
      };
    }
    if (kind === "checklist") ui.pages.checklists = target.page;
    else ui.pages.items[target.checklistId] = target.page;
    ui.scrolledTo = target.key;
    ui.focusAfter = { id };
    data.update((store) => {
      const { list, index } = locate(store, { kind, id });
      if (!list || index === -1) return;
      const [entity] = list.splice(index, 1);
      if (bottom) list.push(entity);
      else list.unshift(entity);
    });
  }

  /* ------------------------------------------------------------ dialogs */

  function showDialog(dialog, focusNode) {
    if (typeof dialog.showModal === "function") {
      dialog.showModal();
    } else {
      dialog.setAttribute("open", ""); // old Safari: visible, non-modal
      dialog.scrollIntoView({ block: "center" });
    }
    /* showModal hands focus to the first button it finds, which leaves a long text
       opened at its end: with no node of its own the dialog keeps the focus and the
       text is read from the top. */
    (focusNode || dialog).focus({ preventScroll: true });
    dialog.scrollTop = 0;
  }

  function openNote(title, body) {
    $("#note-title").textContent = title;
    $("#note-body").textContent = body;
    showDialog(noteDialog);
  }

  /* One confirmation for everything destructive — archive and delete. The stored
     action runs only once the dialog has closed, so focus goes back to a row that is
     still on the screen at that moment. */
  let confirmAction = null;

  function askConfirm(title, body, onOk) {
    confirmAction = onOk;
    $("#confirm-title").textContent = title;
    $("#confirm-body").textContent = body;
    $("#confirm-ok").textContent = title; // the verb of the action: "Archive", "Delete"
    showDialog(confirmDlg, $("#confirm-cancel")); // Cancel holds focus, so Enter never destroys
  }

  /* The 3-dot menu: a dialog like every other modal here, so it behaves the same on a
     phone, in a narrow window and under a screen reader, and Tab cannot leak out of it. */
  function menuRow(glyph, label, action) {
    const btn = el("button", { class: "menu-item", type: "button" }, icon(glyph), el("span", { text: label }));
    btn.addEventListener("click", () => {
      menuDialog.close(); // first close, then act: focus goes back to the row the menu came from
      action();
    });
    return btn;
  }

  function openMenu(kind, id) {
    if (!entityOf(kind, id)) return; // its row was deleted in another window
    $("#menu-subject").textContent = entityName(kind, id);
    /* Bulk mode joins this list in task 4. */
    menuActionsEl.replaceChildren(
      menuRow("archive", t("archiveAction"), () => askArchive(kind, id)),
      menuRow("trash", t("delete"), () => askDelete(kind, id)),
      el("div", { class: "sep" }),
      menuRow("arrow-bar-up", t("toTop"), () => moveTo(kind, id, false)),
      menuRow("arrow-bar-down", t("toBottom"), () => moveTo(kind, id, true)),
    );
    showDialog(menuDialog);
  }

  /* shortcut: the archive screen is task 5, so the confirmation says where the record
     went and that it cannot be read back yet — the Archive button says the same. */
  function askArchive(kind, id) {
    if (!entityOf(kind, id)) return; // its row was deleted in another window
    const body = t(kind === "checklist" ? "archiveChecklistBody" : "archiveItemBody", [entityName(kind, id)]);
    askConfirm(t("archiveAction"), body, () => archiveEntity(kind, id));
  }

  function askDelete(kind, id) {
    if (!entityOf(kind, id)) return;
    const body = t(kind === "checklist" ? "deleteChecklistBody" : "deleteItemBody", [entityName(kind, id)]);
    askConfirm(t("delete"), body, () => deleteEntity(kind, id));
  }

  /* ------------------------------------------------------------ wiring */

  /* Settings stays an anchored dropdown rather than a <dialog> like the windows above:
     spec.md asks for a panel pinned to the gear, and it carries the same contract by
     hand — focus stays inside it, Escape and a click outside close it, focus returns. */
  function setSettingsOpen(open) {
    ui.settingsOpen = open;
    settingsMenu.hidden = !open;
    settingsBtn.setAttribute("aria-expanded", open ? "true" : "false");
    /* aria-controls only while the menu is open: pointing it at a hidden node trips axe. */
    if (open) settingsBtn.setAttribute("aria-controls", "settings");
    else settingsBtn.removeAttribute("aria-controls");
    if (open) selects.theme.focus();
  }

  function bindHeader() {
    $("#btn-add").addEventListener("click", () => addChecklist());
    settingsBtn.addEventListener("click", () => setSettingsOpen(!ui.settingsOpen));
    $("#btn-help").addEventListener("click", () => openNote(t("help"), t("helpBody")));
    $("#btn-archive").addEventListener("click", () => {
      setSettingsOpen(false);
      // shortcut: the archive screen is task 5; until then the button says so.
      openNote(t("archive"), t("archiveSoon"));
    });
    /* The open menu is a dialog: Tab must circle inside it, not leak to the header —
       listener on the document, because focus can escape to body via a click on a gap. */
    doc.addEventListener("keydown", (event) => {
      if (event.key !== "Tab" || !ui.settingsOpen) return;
      const nodes = [...settingsMenu.querySelectorAll("select, button")];
      const first = nodes[0];
      const last = nodes[nodes.length - 1];
      if (!settingsMenu.contains(doc.activeElement)) {
        event.preventDefault(); // focus slipped out (gear, gap click): pull it back in
        (event.shiftKey ? last : first).focus();
        return;
      }
      if (!event.shiftKey && doc.activeElement === last) {
        event.preventDefault();
        first.focus();
      } else if (event.shiftKey && doc.activeElement === first) {
        event.preventDefault();
        last.focus();
      }
    });
    doc.addEventListener("click", (event) => {
      if (!ui.settingsOpen || event.target.closest("#settings, #btn-settings")) return;
      setSettingsOpen(false);
    });
    doc.addEventListener("keydown", (event) => {
      if (event.key !== "Escape" || !ui.settingsOpen) return;
      setSettingsOpen(false);
      settingsBtn.focus();
    });
  }

  function bindToolbar() {
    expandBtn.addEventListener("click", () => setAllOpen(true));
    collapseBtn.addEventListener("click", () => setAllOpen(false));
  }

  function bindDialogs() {
    $("#menu-cancel").addEventListener("click", () => menuDialog.close());
    $("#confirm-cancel").addEventListener("click", () => {
      confirmAction = null;
      confirmDlg.close();
    });
    $("#confirm-ok").addEventListener("click", () => {
      const action = confirmAction;
      confirmAction = null;
      confirmDlg.close();
      if (action) action();
    });
    confirmDlg.addEventListener("cancel", () => { confirmAction = null; }); // Esc means Cancel
  }

  /* What a press asked to reveal, measured while the node is certainly on screen. */
  let cutPress = null;

  /* A gesture that fired owns the click its pointer release produces — without this a
     swipe would also tick the item or fold the checklist under it. Such a click is one
     on the swiped row that follows right away; a deliberate tap on that same row a
     moment later (its save icon, its menu) still gets through. */
  let swallowedClick = null;

  function consumeSwipeClick(event) {
    if (!swallowedClick) return false;
    const { kind, entityId, at } = swallowedClick;
    swallowedClick = null;
    if (Date.now() - at > ECHO_MS) return false;
    const holder = event.target.closest("[data-id]");
    if (!holder || holder.dataset.id !== entityId || rowKind(holder) !== kind) return false;
    cutPress = null; // the press that became a swipe never asks for full text
    event.preventDefault(); // a click on an item's label ticks its checkbox without asking us
    return true;
  }

  /* Cut-off text: this click asks for the whole of it, so it must not also tick
     the item or fold the checklist. Nothing to reveal when nothing is hidden. */
  function revealCutText(event) {
    const reveal = cutPress && cutPress.node === event.target ? cutPress : null;
    cutPress = null;
    if (!reveal) return false;
    event.preventDefault();
    /* The press landed on text, which cannot hold focus: put the keyboard on the
       row's own control first, so closing the dialog hands it back there instead
       of dropping it at the top of the lists. */
    const back = reveal.node.closest("[data-id]")?.querySelector("button, input");
    back?.focus({ preventScroll: true });
    openNote(t("fullText"), reveal.text);
    return true;
  }

  /* Returns true when the click was a tick: it must not also flip a page or fold a list. */
  function tickItem(event) {
    const box = event.target.closest('input[type="checkbox"]');
    if (!box) return false;
    const row = box.closest("[data-id]");
    if (!row) return true; // a box outside any row: nothing else must react, as before the split
    const changed = toggleItem(row.dataset.id);
    if (changed) {
      if (!listsEl.contains(row)) {
        render(); // this very click's blur-commit rebuilt the list: show the just-saved state
      } else {
        /* The browser already ticked the box and only classes follow, so set
           them in place instead of re-rendering every list (the hot path). */
        row.classList.toggle("is-done", changed.item.done);
        const title = row.closest(".cl")?.querySelector(".cl-title");
        if (title) title.classList.toggle("is-muted", allDone(changed.checklist));
        if (data.blocked()) renderStorageWarning(); // a write failure must still get its line
      }
    }
    return true;
  }

  /* What a click on a control of a row does, by its data-act. Every one of them takes
     the kind of the row and its id, so no branch has to work out which it is. */
  const ROW_ACTIONS = {
    toggle: (kind, id) => toggleChecklist(id),
    "add-item": (kind, id) => addItem(id),
    edit: (kind, id) => startEdit(kind, id),
    menu: (kind, id) => openMenu(kind, id),
    "save-edit": () => saveEdit(),
  };

  const rowKind = (node) => (node.matches(".item") ? "item" : "checklist");

  /* ------------------------------------------------------------ gestures */

  const SWIPE_MIN = 44; // px sideways before a swipe is worth acting on…
  const SWIPE_RATIO = 1.4; // …and it must beat the vertical travel by this much
  const SWIPE_SHOW = 8; // px of sideways travel before the row starts following
  const SWIPE_MAX = 120; // how far a row visually travels; the gesture keeps going
  const ECHO_MS = 300; // a click this soon after a swipe is the swipe's own echo

  let swipe = null; // the press being tracked, null while idle

  /* Travel worth acting on, as -1 or 1: far enough sideways and clearly more sideways
     than up or down; 0 for anything else, including a swipe pulled back to the start. */
  const swipeDir = (dx, dy) =>
    (Math.abs(dx) >= SWIPE_MIN && Math.abs(dx) >= Math.abs(dy) * SWIPE_RATIO ? Math.sign(dx) : 0);

  /* A gesture starts on a row's own surface, never on a control the user is already
     operating: a checkbox, a toolbar button of the row (pencil, +, the 3 dots), the edit
     field, the pager arrows. The row's own text stays a gesture surface, so does the
     checklist title, which is a button of its own (folding it is a press, not a drag). */
  function gestureRow(node) {
    if (node.closest("input, select, .iconbtn, .edit-wrap, [data-pager]")) return null;
    const item = node.closest(".item");
    if (item) return { kind: "item", entityId: item.dataset.id, node: item };
    const head = node.closest(".cl-head");
    return head ? { kind: "checklist", entityId: head.closest(".cl").dataset.id, node: head } : null;
  }

  function dropSwipe() {
    if (!swipe) return;
    swipe.node.classList.remove("is-swiping", "swipe-edit", "swipe-archive");
    swipe.node.style.transform = ""; // back where it came from, eased by the row's own transition
    swipe = null;
  }

  function bindGestures() {
    /* Capture phase, so it runs before a press of our own below: any new press ends the
       one before it, including a release we never saw (off the window) — a press on the
       header, the panel or a dialog must not leave a row waiting for it. */
    doc.addEventListener("pointerdown", dropSwipe, true);

    listsEl.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" && event.button !== 0) return;
      const row = gestureRow(event.target);
      if (row) {
        swipe = {
          ...row, x: event.clientX, y: event.clientY, pointerId: event.pointerId,
          dx: 0, dy: 0, shown: false, armed: false,
        };
      }
    });

    listsEl.addEventListener("pointermove", (event) => {
      if (!swipe || event.pointerId !== swipe.pointerId) return;
      if (!swipe.node.isConnected) return dropSwipe(); // something rebuilt the lists under the finger
      swipe.dx = event.clientX - swipe.x;
      swipe.dy = event.clientY - swipe.y;
      if (Math.abs(swipe.dy) > SWIPE_MIN && Math.abs(swipe.dy) > Math.abs(swipe.dx)) {
        return dropSwipe(); // scrolling the page wins over a gesture
      }
      if (!swipe.shown) {
        if (Math.abs(swipe.dx) < SWIPE_SHOW || Math.abs(swipe.dx) < Math.abs(swipe.dy) * SWIPE_RATIO) return;
        swipe.shown = true; // the row starts following; a click is still a click at this travel
      }
      if (!swipe.armed && swipeDir(swipe.dx, swipe.dy)) {
        /* Past this distance the gesture owns the pointer: keep its events even when it
           drifts off the row, and drop the text selection the drag started. Capturing any
           earlier would take the click of a slightly shaky tap away from its checkbox. */
        swipe.armed = true;
        try { listsEl.setPointerCapture(event.pointerId); } catch (_error) { /* pointer already gone */ }
        doc.getSelection()?.removeAllRanges();
      }
      /* The row follows the whole way, back and forth: pulling towards the start pulls
         the row back, so the user sees a gesture being given up. */
      const dir = Math.sign(swipe.dx);
      swipe.node.classList.add("is-swiping");
      /* toggled, never only added — the finger can cross over to the other side */
      swipe.node.classList.toggle("swipe-edit", dir > 0);
      swipe.node.classList.toggle("swipe-archive", dir < 0);
      swipe.node.style.transform = `translateX(${dir * Math.min(Math.abs(swipe.dx), SWIPE_MAX)}px)`;
    });

    /* On the document, not on the lists: released past the edge of a card on a wide
       screen the gesture still has to end, and decide, here. */
    doc.addEventListener("pointerup", (event) => {
      if (!swipe || event.pointerId !== swipe.pointerId) return;
      const { dx, dy, kind, entityId } = swipe;
      dropSwipe();
      /* Decided by where the pointer ended up: a swipe pulled back under the threshold
         is a gesture the user gave up, and nothing happens. */
      const dir = swipeDir(dx, dy);
      if (!dir) return; // a plain tap: the click handler does its usual job
      event.preventDefault(); // no click for the swipe, so the row is not also ticked or folded
      swallowedClick = { kind, entityId, at: Date.now() }; // sent anyway by some browsers
      if (dir > 0) startEdit(kind, entityId);
      else askArchive(kind, entityId);
    });

    doc.addEventListener("pointercancel", (event) => {
      if (swipe && event.pointerId === swipe.pointerId) dropSwipe();
    });
  }

  function bindLists() {
    /* Measured on press, not on click: this very click can first commit an open
       editor, and a rebuilt node measures 0 — that would read as "nothing hidden"
       and fold the list instead of showing the text the user asked for. */
    listsEl.addEventListener("pointerdown", (event) => {
      const cut = event.target.closest(".item-text, .cl-title");
      cutPress = cut && cut.scrollWidth > cut.clientWidth + 1 ? { node: cut, text: cut.textContent } : null;
    });
    /* Click, not change: a click already in flight while the list re-renders
       still reaches this handler; the change event it fires would not. */
    listsEl.addEventListener("click", (event) => {
      if (consumeSwipeClick(event)) return;
      if (revealCutText(event)) return;
      if (tickItem(event)) return;
      const trigger = event.target.closest("[data-act]");
      if (!trigger) return;
      if (trigger.dataset.act === "page") {
        changePage(trigger.closest("[data-pager]").dataset.pager, Number(trigger.dataset.dir));
        return; // the pager belongs to a list, not to a card
      }
      const holder = trigger.closest("[data-id]");
      if (!holder) return;
      const action = ROW_ACTIONS[trigger.dataset.act];
      if (action) action(rowKind(holder), holder.dataset.id);
    });
    /* Double click edits an item: the mouse entry point on a row. A cut-off item is the
       exception — its first click already opened the full text, and a modal dialog lets
       no second click through to the row, so the double click never happens there. */
    listsEl.addEventListener("dblclick", (event) => {
      const row = event.target.closest(".item");
      if (row && !event.target.matches("input, button")) startEdit("item", row.dataset.id);
    });
    /* Keyboard parity (WCAG 2.1.1): no pointerdown preceded this, so measure on Enter.
       Cut-off item text opens in full; a checklist heading keeps Enter for expand/
       collapse — its title is edited with F2 and read in full by the pencil's own field. */
    listsEl.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || !event.target.matches('input[type="checkbox"]')) return;
      const text = event.target.closest(".item")?.querySelector(".item-text");
      if (text && text.scrollWidth > text.clientWidth + 1) {
        event.preventDefault();
        openNote(t("fullText"), text.textContent);
      }
    });
    /* F2 is the keyboard twin of the swipe and of the double click (WCAG 2.1.1):
       without it, editing a row would need a pointer. */
    listsEl.addEventListener("keydown", (event) => {
      if (event.key !== "F2") return;
      const holder = event.target.closest("[data-id]");
      if (!holder) return;
      event.preventDefault();
      startEdit(rowKind(holder), holder.dataset.id);
    });
  }

  /* The <option>s themselves are built by applyStrings: they carry translated text. */
  function bindSettings() {
    for (const [name, select] of Object.entries(selects)) {
      select.addEventListener("change", () => settingsStore.patch({ [name]: castSetting(name, select.value) }));
    }
  }

  function changePage(key, direction) {
    if (key === "checklists") ui.pages.checklists += direction;
    else ui.pages.items[key] = (ui.pages.items[key] ?? 1) + direction;
    ui.scrolledTo = key; // clamped by render(), which then scrolls to the new page
    render();
  }

  function init() {
    bindHeader();
    bindToolbar();
    bindDialogs();
    bindGestures();
    bindLists();
    bindSettings();
    /* Every setting reaches the screen through render(): page size and language
       change what is drawn, not just how it looks. */
    settingsStore.subscribe(() => {
      applyTheme();
      applyLanguage();
      render();
    });
    data.subscribe(render);
    darkQuery.addEventListener("change", () => {
      if (settings().theme === "system") applyTheme();
    });
    /* Keep two open tabs in sync (fires for the other tabs only). */
    window.addEventListener("storage", (event) => {
      /* Reloading now would rebuild the lists and destroy the open editor, losing
         the text being typed: remember it and adopt the change at commit time. */
      if (event.key === KEYS.data) {
        if (ui.editing) staleData = true;
        else data.reload();
      } else if (event.key === KEYS.settings) settingsStore.reload();
    });
    /* The sticky checklist header sits under the app header, whose height depends on
       the safe-area insets of the device: measure it instead of guessing. Exact value,
       not rounded: any rounding either leaves a hairline of lists showing through
       under the header or hides a slice of the stuck head behind it. */
    const measureTopbar = () => root.style.setProperty("--topbar-h", `${topbarEl.getBoundingClientRect().height}px`);
    if (window.ResizeObserver) new ResizeObserver(measureTopbar).observe(topbarEl);
    else measureTopbar(); // Safari before 13.4: measured once, no live update
    applyTheme();
    applyLanguage();
    render();
  }

  init();
})();
</script>
</body>
</html>
