/* ---------- row gestures: long-press drag + swipe ---------- */

let gesture = null;
let drag = null;
let suppressClick = false;
let pointerY = 0;
let scrollRaf = 0;
let autoScrolling = false;

function rowHandle(target) {
  if (!target || !target.closest) {
    return null;
  }
  if (target.closest(".row-edit")) {
    return null;
  }
  const handle = target.closest(".card__head, .item");
  if (!handle) return null;
  const isItem = handle.classList.contains("item");
  const row = isItem ? handle : handle.closest(".card");
  if (!row || !row.dataset.id) {
    return null;
  }
  const mover = handle.querySelector(".card__row, .item__row");
  if (!mover) return null;
  return { handle, mover, row, kind: isItem ? "item" : "list", id: row.dataset.id };
}

function rowById(kind, id) {
  return document.querySelector(`#lists [data-kind="${kind}"][data-id="${CSS.escape(id)}"]`);
}

function onRowDown(event) {
  if (drag || modalOpen()) {
    return;
  }
  if (event.pointerType === "mouse" && event.button !== 0) {
    return;
  }
  const hit = rowHandle(event.target);
  if (!hit) return;
  pointerY = event.clientY;
  gesture = {
    ...hit,
    x0: event.clientX,
    y0: event.clientY,
    mode: "pending",
    timer: setTimeout(startDrag, GESTURE.press),
  };
  if (event.pointerType !== "mouse") {
    document.documentElement.classList.add("is-dragging");
    document.getSelection()?.removeAllRanges();
  }
  window.addEventListener("pointermove", onRowMove);
  window.addEventListener("pointerup", onRowUp);
  window.addEventListener("pointercancel", onRowUp);
}

function endRowListeners() {
  document.documentElement.classList.remove("is-dragging");
  window.removeEventListener("pointermove", onRowMove);
  window.removeEventListener("pointerup", onRowUp);
  window.removeEventListener("pointercancel", onRowUp);
}

function onRowMove(event) {
  pointerY = event.clientY;
  if (!gesture) return;
  const dx = event.clientX - gesture.x0;
  const dy = event.clientY - gesture.y0;
  if (gesture.mode === "drag") {
    updateDrag(event.clientX, event.clientY);
    return;
  }
  if (gesture.mode === "swipe") {
    paintSwipe(dx);
    return;
  }
  if (Math.abs(dx) > GESTURE.swipeMin && Math.abs(dx) > GESTURE.ratio * Math.abs(dy)) {
    gesture.mode = "swipe";
    clearTimeout(gesture.timer);
    paintSwipe(dx);
    return;
  }
  if (Math.max(Math.abs(dx), Math.abs(dy)) > GESTURE.slop) {
    clearTimeout(gesture.timer);
    if (Math.abs(dy) >= Math.abs(dx)) {
      endGesture();
    }
  }
}

function onRowUp() {
  endRowListeners();
  if (!gesture) return;
  if (gesture.mode === "drag") {
    suppressNextClick();
    endDrag(true);
    flushSave();
  } else if (gesture.mode === "swipe") {
    suppressNextClick();
    finishSwipe();
  }
  endGesture();
}

function endGesture() {
  if (gesture) clearTimeout(gesture.timer);
  gesture = null;
  endRowListeners();
}

function rubber(dx) {
  const over = Math.abs(dx) - GESTURE.trigger;
  if (over <= 0) return dx;
  return Math.sign(dx) * (GESTURE.trigger + over * 0.35);
}

function suppressNextClick() {
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 250);
}

function paintSwipe(dx) {
  const mover = gesture.mover;
  gesture.lastDx = dx;
  mover.style.transition = "none";
  mover.style.transform = `translateX(${rubber(dx)}px)`;
  const progress = clamp(Math.abs(dx) / GESTURE.trigger, 0, 1);
  for (const bg of gesture.handle.querySelectorAll(".swipe-bg")) {
    const rightSide = bg.classList.contains("swipe-bg--right");
    bg.style.opacity = String(dx > 0 === rightSide ? progress : 0);
  }
}

function finishSwipe() {
  const current = gesture;
  const dx = current.lastDx || 0;
  current.mover.style.transition = "";
  current.mover.style.transform = "";
  for (const bg of current.handle.querySelectorAll(".swipe-bg")) {
    bg.style.opacity = "0";
  }
  if (Math.abs(dx) < GESTURE.trigger) {
    return;
  }
  if (dx > 0) {
    startEdit(current.kind, current.id);
    return;
  }
  ask(current.kind, [current.id], "archive", current.handle);
}

/* ---------- drag ---------- */

function visibleRows(container) {
  return [...container.children].filter((node) => node !== (drag && drag.gap) && !node.classList.contains("is-drag-src"));
}

function indexAt(container, y) {
  const rows = visibleRows(container);
  let index = 0;
  for (const row of rows) {
    const rect = row.getBoundingClientRect();
    if (y < rect.top + rect.height / 2) {
      break;
    }
    index += 1;
  }
  return index;
}

function placeGap() {
  if (!drag || !drag.container) {
    return;
  }
  const rows = visibleRows(drag.container);
  const ref = rows[clamp(drag.index, 0, rows.length)];
  if (ref) drag.container.insertBefore(drag.gap, ref);
  else drag.container.append(drag.gap);
}

function applyDragState() {
  if (!drag) return;
  for (const id of drag.ids) {
    const row = rowById(drag.kind, id);
    if (row) row.classList.add("is-drag-src");
  }
  placeGap();
}

function targetContainer(kind, y) {
  if (kind === "list") {
    return byId("lists");
  }
  for (const card of document.querySelectorAll("#lists .card")) {
    const rect = card.getBoundingClientRect();
    if (y < rect.top || y > rect.bottom) {
      continue;
    }
    return card.classList.contains("is-open") ? card.querySelector(".items") : null;
  }
  // Off every card: the open body whose middle is nearest.
  let best = null;
  let bestDistance = Infinity;
  for (const body of document.querySelectorAll("#lists .card.is-open .items")) {
    const rect = body.getBoundingClientRect();
    const distance = Math.abs(y - (rect.top + rect.height / 2));
    if (distance < bestDistance) {
      bestDistance = distance;
      best = body;
    }
  }
  return best;
}

/* The aim leaves the held target only past hoverPad, so hand jitter cannot reset the hold. */
function collapsedHeadAt(y) {
  const held = drag.hoverId && rowById("list", drag.hoverId);
  const head = held && held.querySelector(":scope > .card__head");
  if (head) {
    const rect = head.getBoundingClientRect();
    if (y >= rect.top - GESTURE.hoverPad && y <= rect.bottom + GESTURE.hoverPad) {
      return head;
    }
  }
  for (const other of document.querySelectorAll("#lists .card:not(.is-open) > .card__head")) {
    const rect = other.getBoundingClientRect();
    if (y >= rect.top && y <= rect.bottom) {
      return other;
    }
  }
  return null;
}

// The clone sits at `position: fixed; top: 0`, so its centre is pure arithmetic: no layout read.
function cloneCenter() {
  return drag.y - drag.dy + drag.cloneHalf;
}

/* Reads before writes: interleaving costs one relayout per pass. */
function retarget() {
  const cy = cloneCenter();
  const hovered = drag.kind === "item" && !autoScrolling ? collapsedHeadAt(cy) : null;
  const container = targetContainer(drag.kind, cy);
  const index = container && !hovered ? indexAt(container, cy) : drag.index;
  moveClone();
  handleHover(hovered);
  if (!container || (drag.container === container && drag.index === index)) {
    return;
  }
  drag.container = container;
  drag.index = index;
  placeGap();
}

function clearCollapsedTarget() {
  if (!drag.collapsedId) return;
  const old = rowById("list", drag.collapsedId);
  if (old) old.classList.remove("is-drop-hover");
  drag.collapsedId = null;
  drag.gap.classList.remove("is-standby");
}

function handleHover(head) {
  if (drag.kind !== "item") {
    return;
  }
  const id = head ? head.parentElement.dataset.id : null;
  if (drag.hoverId === id) {
    return;
  }
  clearTimeout(drag.hoverTimer);
  clearCollapsedTarget();
  drag.hoverId = id;
  if (id) {
    drag.collapsedId = id;
    drag.gap.classList.add("is-standby");
    head.parentElement.classList.add("is-drop-hover");
    drag.hoverTimer = setTimeout(() => expandForDrop(id), GESTURE.hover);
  }
}

function expandForDrop(id) {
  const cl = findList(id);
  if (!drag || !cl || cl.expanded) {
    return;
  }
  drag.hoverId = null;
  clearCollapsedTarget();
  cl.expanded = true;
  markDirty("list", id);
  // A rebuild would destroy the row under the finger, and Chrome answers that with pointercancel.
  queueSave();
  repaintRow("list", id);
  const body = document.querySelector(`#lists [data-id="${CSS.escape(id)}"] .items`);
  if (!body) {
    retarget();
    return;
  }
  drag.container = body;
  drag.index = indexAt(body, cloneCenter());
  placeGap();
}

function startDrag() {
  const hit = gesture;
  if (!hit) return;
  hit.mode = "drag";
  const bulk = state.ui.bulk;
  const ids = bulk.kind === hit.kind && bulk.ids.includes(hit.id) ? [...bulk.ids] : [hit.id];
  // In state order, not tap order: this is the order moveGroup re-inserts, so the ghost matches the drop.
  const picked = new Set(ids);
  const source = hit.kind === "list" ? state.checklists : state.items;
  const rows = source.filter((x) => picked.has(x.id)).map((x) => rowById(hit.kind, x.id)).filter(Boolean);
  if (!rows.length) return;
  navigator.vibrate?.(10);
  // The grab offset comes from the ghosted head itself: a card rect drifts once the sticky head parks under the topbar.
  const rect = hit.handle.getBoundingClientRect();
  const clone = el("div", "drag-clone");
  for (const row of rows) {
    clone.append(dragCopy(row));
  }
  document.body.append(clone);
  const gap = el("div", "drop-gap");
  gap.style.height = `${clone.offsetHeight + gapPad(rows)}px`;
  rows[0].before(gap);
  drag = {
    kind: hit.kind,
    ids,
    clone,
    gap,
    dx: hit.x0 - rect.left,
    dy: hit.y0 - rect.top,
    x: hit.x0,
    y: hit.y0,
    cloneHalf: clone.offsetHeight / 2,
    raf: 0,
    container: rows[0].parentElement,
    index: 0,
    hoverId: null,
    hoverTimer: 0,
    collapsedId: null,
  };
  for (const row of rows) {
    row.classList.add("is-drag-src");
  }
  document.documentElement.classList.add("is-dragging");
  document.getSelection()?.removeAllRanges();
  retarget();
  startAutoScroll();
}

// A list drags as a closed card: a tall ghost lets the sticky head slip and aims far below the finger.
function dragCopy(row) {
  const copy = row.cloneNode(true);
  copy.style.width = `${row.offsetWidth}px`;
  if (copy.classList.contains("card")) {
    copy.classList.remove("is-open");
    copy.querySelector(".card__body").remove();
  }
  return copy;
}

function gapPad(rows) {
  if (rows.length < 2) {
    return 0;
  }
  const gap = parseFloat(getComputedStyle(rows[0].parentElement).rowGap) || 0;
  return gap * (rows.length - 1);
}

function moveClone() {
  drag.clone.style.transform = `translate(${drag.x - drag.dx}px, ${drag.y - drag.dy}px) scale(1.03) rotate(1.5deg)`;
}

function updateDrag(x, y) {
  if (!drag) return;
  drag.x = x;
  drag.y = y;
  if (!drag.raf) drag.raf = requestAnimationFrame(dragFrame);
}

function dragFrame() {
  if (!drag) return;
  drag.raf = 0;
  retarget();
}

// The id of the live row after ("next") or before ("prev") the drop marker; dragged rows are skipped.
function siblingId(gap, dir) {
  const key = dir === "next" ? "nextElementSibling" : "previousElementSibling";
  let node = gap[key];
  while (node && node.classList.contains("is-drag-src")) {
    node = node[key];
  }
  return node && node.dataset ? node.dataset.id ?? null : null;
}

function dropItemsInto(ids, checklistId, refId) {
  const picked = new Set(ids);
  const group = state.items.filter((item) => picked.has(item.id));
  const touched = new Set(group.map((item) => item.checklistId));
  const rest = state.items.filter((item) => !picked.has(item.id));
  const live = rest.filter((item) => item.checklistId === checklistId && !item.archived);
  const at = refId ? rest.findIndex((item) => item.id === refId) : -1;
  const index = at === -1 ? joinIndex(rest, live, true) : at;
  for (const item of group) {
    item.checklistId = checklistId;
    markDirty("item", item.id);
  }
  state.items = moveGroup(state.items, ids, index);
  const target = findList(checklistId);
  if (target) {
    target.expanded = true;
    markDirty("list", checklistId);
  }
  touched.add(checklistId);
  for (const id of touched) markOrder(id);
}

function endDrag(apply) {
  const current = drag;
  if (!current) return;
  if (current.raf) {
    // The drop must land where the last pointermove pointed, not where the previous frame said.
    cancelAnimationFrame(current.raf);
    current.raf = 0;
    retarget();
  }
  drag = null;
  document.documentElement.classList.remove("is-dragging");
  clearTimeout(current.hoverTimer);
  // Dropped before the hold filled: nothing else takes the progress bar off the target head.
  rowById("list", current.collapsedId)?.classList.remove("is-drop-hover");
  const kind = current.kind;
  const ids = current.ids;
  const refId = siblingId(current.gap, "next");
  const prevId = siblingId(current.gap, "prev");
  const targetCard = current.container ? current.container.closest(".card") : null;
  const checklistId = targetCard ? targetCard.dataset.id : null;
  current.clone.remove();
  current.gap.remove();
  stopAutoScroll();
  if (!apply) {
    render();
    return;
  }
  if (kind === "list") {
    state.checklists = moveGroup(state.checklists, ids, refIndex(state.checklists, ids, refId, prevId));
    markOrder("lists");
  } else if (current.collapsedId) {
    dropItemsInto(ids, current.collapsedId, null);
  } else if (checklistId) {
    dropItemsInto(ids, checklistId, refId);
  }
  commit();
}

function ramp(k) {
  return 1 + Math.round(9 * clamp(k, 0, 1));
}

function startAutoScroll() {
  if (scrollRaf) return;
  const step = () => {
    if (!drag && !panelDrag) {
      scrollRaf = 0;
      return;
    }
    const height = innerHeight;
    let pixels = 0;
    if (pointerY < GESTURE.edge) {
      pixels = -ramp(pointerY / GESTURE.edge);
    } else if (pointerY > height - GESTURE.edge) {
      pixels = ramp((pointerY - (height - GESTURE.edge)) / GESTURE.edge);
    }
    const before = scrollY;
    if (pixels !== 0) {
      scrollBy(0, pixels);
    }
    const wasScrolling = autoScrolling;
    autoScrolling = scrollY !== before;
    if (drag && (autoScrolling || wasScrolling)) {
      retarget();
    }
    scrollRaf = requestAnimationFrame(step);
  };
  scrollRaf = requestAnimationFrame(step);
}

function stopAutoScroll() {
  if (scrollRaf) {
    cancelAnimationFrame(scrollRaf);
    scrollRaf = 0;
  }
  autoScrolling = false;
}

document.addEventListener("touchmove", (event) => {
  if (drag || panelDrag) {
    event.preventDefault();
  }
}, { passive: false });

/* ---------- minipanel ---------- */

let panelDrag = null;
let panelGhost = null;
/* Set during a panel drag and briefly after: the click that ends it must not open the menu. */
let panelSuppress = false;

function cssVarPx(name) {
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || 0;
}

function cssBottomInset() {
  return parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
}

function panelCeiling(height, min) {
  return Math.max(min, innerHeight - height - Math.max(GESTURE.gap, cssBottomInset()));
}

// A band of zero height leaves the panel nowhere to sit and its far end past the screen edge.
function panelFits(height) {
  const [min, max] = panelTopRange(height);
  return max > min;
}

// Vertical band the panel may occupy: below the sticky topbar, above the bottom safe area.
function panelTopRange(height) {
  const min = Math.round(document.querySelector(".topbar").getBoundingClientRect().bottom) + GESTURE.gap;
  return [min, panelCeiling(height, min)];
}

/* The pill as collapsed: the grip is always the first child, so the band the
   drag anchor is scaled against never changes with the panel's real height. */
function collapsedHeight() {
  const panel = byId("panel");
  const grip = panel.firstElementChild;
  if (!grip) {
    return panel.offsetHeight;
  }
  const style = getComputedStyle(panel);
  return grip.offsetHeight
    + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom)
    + parseFloat(style.borderTopWidth) + parseFloat(style.borderBottomWidth);
}

/* `pct` is a fraction of the collapsed band; a taller panel is clamped into its own band,
   so the grip only moves when there is genuinely no room left for it. */
function panelTop(pct, height, base) {
  const [min, baseMax] = panelTopRange(base);
  return clamp(Math.round(min + clamp(pct, 0, 1) * (baseMax - min)), min, panelCeiling(height, min));
}

function panelFraction(top, base) {
  const [min, max] = panelTopRange(base);
  if (!(max > min) || !Number.isFinite(top)) {
    return 0;
  }
  return clamp((top - min) / (max - min), 0, 1);
}

/* The docks [left, right] a panel of `width` rests on: beside the content column when it fits,
   the safe-area edges otherwise. Ordered, and never past the safe area. */
function panelDocks(width) {
  const safeLeft = Math.round(cssVarPx("--safe-left"));
  const safeRight = Math.round(innerWidth - width - cssVarPx("--safe-right"));
  const wrap = document.querySelector(".wrap").getBoundingClientRect();
  const docks = wrap.left >= width + GESTURE.gap * 2
    ? [Math.max(safeLeft, Math.round(wrap.left - width - GESTURE.gap)), Math.min(safeRight, Math.round(wrap.right + GESTURE.gap))]
    : [safeLeft, safeRight];
  return [Math.min(...docks), Math.max(...docks)];
}

function panelX(side, docks) {
  return side === "left" ? docks[0] : docks[1];
}

// Row mode is decided on the unrowed height: the row layout hides the height it is about.
function panelLiesDown(panel) {
  panel.classList.remove("is-row");
  return !panelFits(panel.offsetHeight);
}

function positionPanel() {
  const panel = byId("panel");
  if (panelDrag) return;
  const row = panel.classList.toggle("is-row", panelLiesDown(panel));
  panel.setAttribute("aria-orientation", row ? "horizontal" : "vertical");
  for (const sep of panel.querySelectorAll(".panel__sep")) {
    sep.setAttribute("aria-orientation", row ? "vertical" : "horizontal");
  }
  const width = panel.offsetWidth;
  const height = panel.offsetHeight;
  panel.style.left = `${panelX(state.ui.panel.side, panelDocks(width))}px`;
  panel.style.top = `${panelTop(state.ui.panel.topPct, height, collapsedHeight())}px`;
}

function snapSide(center, width, docks) {
  return sideFor(center, docks[0] + width / 2, docks[1] + width / 2, state.ui.panel.side);
}

// Peel past the threshold, re-glue at half of it: the gap is wider than GESTURE.slop, so jitter cannot oscillate it.
function detached(desired, dock, wasDetached) {
  const dist = Math.abs(desired - dock);
  return wasDetached ? dist >= GESTURE.detach / 2 : dist >= GESTURE.detach;
}

// Switch docks only past 33% of the span from the current one.
function sideFor(center, left, right, side) {
  const trigger = (right - left) * 0.33;
  if (side === "left") {
    return center - left >= trigger ? "right" : "left";
  }
  return right - center >= trigger ? "left" : "right";
}

function showGhost(left, top, width, height) {
  const ghost = panelGhost ?? el("div", "panel-ghost");
  panelGhost = ghost;
  if (!ghost.isConnected) document.body.append(ghost);
  ghost.hidden = false;
  ghost.style.width = `${width}px`;
  ghost.style.height = `${height}px`;
  ghost.style.left = `${left}px`;
  ghost.style.top = `${top}px`;
}

function hideGhost() {
  if (panelGhost) panelGhost.hidden = true;
}

function onPanelDown(event) {
  if (panelDrag || modalOpen()) {
    return;
  }
  if (event.pointerType === "mouse" && event.button !== 0) {
    return;
  }
  const rect = byId("panel").getBoundingClientRect();
  const origin = { x: event.clientX, y: event.clientY, left: rect.left, top: rect.top };
  const move = (e) => {
    pointerY = e.clientY;
    if (!panelDrag && (Math.abs(e.clientX - origin.x) > GESTURE.slop || Math.abs(e.clientY - origin.y) > GESTURE.slop)) {
      beginPanelDrag(e, origin);
    }
    if (panelDrag) movePanelDrag(e);
  };
  const up = () => {
    if (panelDrag) endPanelDrag();
    stop();
  };
  const stop = () => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("pointercancel", up);
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
}

function beginPanelDrag(event, origin) {
  const panel = byId("panel");
  panelDrag = {
    dx: event.clientX - origin.left,
    dy: event.clientY - origin.top,
    width: panel.offsetWidth,
    height: panel.offsetHeight,
    detached: false,
  };
  panelSuppress = true;
  panel.classList.add("is-dragging");
  document.documentElement.classList.add("is-dragging");
  document.getSelection()?.removeAllRanges();
  startAutoScroll();
}

function movePanelDrag(event) {
  const panel = byId("panel");
  const [minTop, maxTop] = panelTopRange(panelDrag.height);
  // Outward of a dock there is nothing to catch the panel, so the docks are the bounds.
  const docks = panelDocks(panelDrag.width);
  const desired = clamp(event.clientX - panelDrag.dx, docks[0], docks[1]);
  const dock = panelX(state.ui.panel.side, docks);
  panelDrag.detached = detached(desired, dock, panelDrag.detached);
  const top = clamp(event.clientY - panelDrag.dy, minTop, maxTop);
  const left = panelDrag.detached ? desired : dock;
  panel.style.left = `${left}px`;
  panel.style.top = `${top}px`;
  const side = snapSide(left + panelDrag.width / 2, panelDrag.width, docks);
  showGhost(panelX(side, docks), top, panelDrag.width, panelDrag.height);
}

function endPanelDrag() {
  const panel = byId("panel");
  const rect = panel.getBoundingClientRect();
  state.ui.panel.side = snapSide(rect.left + rect.width / 2, rect.width, panelDocks(rect.width));
  state.ui.panel.topPct = panelFraction(rect.top, collapsedHeight());
  panelDrag = null;
  panel.classList.remove("is-dragging");
  document.documentElement.classList.remove("is-dragging");
  hideGhost();
  stopAutoScroll();
  markUi();
  flushSave();
  positionPanel();
  setTimeout(() => { panelSuppress = false; }, 250);
}

/* ---------- actions ---------- */

function startEdit(kind, id) {
  state.ui.editing = { kind, id };
  commit();
}

function onRowAct(act, kind, id, row, trigger) {
  if (act === "toggle") {
    const cl = findList(id);
    if (cl) {
      cl.expanded = !cl.expanded;
      markDirty("list", id);
      queueSave();
      repaintRow("list", id);
    }
    return;
  }
  if (act === "pick") {
    togglePick(kind, id);
    return;
  }
  if (act === "toggle-done") {
    const item = findItem(id);
    if (item) {
      item.done = !item.done;
      markDirty("item", id);
      queueSave();
      repaintRow("item", id);
    }
    return;
  }
  if (act === "edit") {
    startEdit(kind, id);
    return;
  }
  if (act === "add-item") {
    addItem(id);
    return;
  }
  if (act === "menu") {
    openEntityMenu(kind, id, trigger);
    return;
  }
  if (act === "save") {
    const editing = state.ui.editing;
    const input = row.querySelector(".row-edit input");
    if (editing && input) {
      commitText(editing.kind, editing.id, input.value);
    }
  }
}

function onPanelAct(act, button) {
  const bulk = state.ui.bulk;
  if (act === "panel-toggle") {
    state.ui.panel.collapsed = !state.ui.panel.collapsed;
    commit();
    return;
  }
  if (act === "expand-all") {
    setExpandedAll(true);
    return;
  }
  if (act === "collapse-all") {
    setExpandedAll(false);
    return;
  }
  if (act === "bulk-cancel") {
    cancelBulk();
    return;
  }
  if (!bulk.ids.length) {
    return;
  }
  if (act === "bulk-top") {
    moveTo(bulk.kind, bulk.ids, "top");
    return;
  }
  if (act === "bulk-bottom") {
    moveTo(bulk.kind, bulk.ids, "bottom");
    return;
  }
  if (act === "bulk-archive") {
    ask(bulk.kind, [...bulk.ids], "archive", button);
    return;
  }
  if (act === "bulk-delete") {
    ask(bulk.kind, [...bulk.ids], "delete", button);
  }
}

/* ---------- wiring ---------- */

function onListClick(event) {
  if (suppressClick) return;
  const button = event.target.closest("[data-act]");
  if (!button) return;
  const row = button.closest("[data-id]");
  if (!row) return;
  onRowAct(button.dataset.act, row.dataset.kind, row.dataset.id, row, button);
}

function onListDblClick(event) {
  const text = event.target.closest(".item__text");
  if (!text) return;
  const row = text.closest("[data-id]");
  if (row) startEdit("item", row.dataset.id);
}

/* Set when Enter already committed: the browser still fires a trailing focusout for the
   replaced input, and by then `editing` may point at the fresh row, whose text is empty. */
let blurSuppress = false;

function onListKeyDown(event) {
  const input = event.target;
  if (!input.classList || !input.classList.contains("input")) {
    return;
  }
  if (event.key === "Enter") {
    event.preventDefault();
    blurSuppress = true;
    const editing = state.ui.editing;
    const named = input.value.trim() !== "";
    commitText(editing.kind, editing.id, input.value);
    if (!named) return;
    // Enter keeps the typing flow going: a fresh empty input opens right away.
    if (editing.kind === "item") {
      addItem(findItem(editing.id).checklistId);
    } else {
      const cl = findList(editing.id);
      if (cl && withoutArchived(state.items, cl.id).length === 0) {
        addItem(cl.id);
      }
    }
    return;
  }
  if (event.key === "Escape") {
    event.preventDefault();
    cancelEdit();
  }
}

function onListBlur(event) {
  if (blurSuppress) {
    blurSuppress = false;
    return;
  }
  const input = event.target;
  // A detached node's blur is a rebuild artifact, not a user commit.
  if (!input.isConnected) return;
  if (input.classList && input.classList.contains("input") && state.ui.editing) {
    commitText(state.ui.editing.kind, state.ui.editing.id, input.value);
  }
}

function onPanelClick(event) {
  if (panelSuppress) return;
  const button = event.target.closest("[data-act]");
  if (button) onPanelAct(button.dataset.act, button);
}

function onKey(event) {
  if (event.key !== "Escape") {
    return;
  }
  if (drag) {
    endDrag(false);
    return;
  }
  closeModal();
}

let resizeTimer = 0;

function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    // No render(): a rebuild would destroy the focused editor, and mobile keyboards fire resize.
    positionPanel();
    positionAnchored();
  }, 120);
}

function bind() {
  byId("btn-add").addEventListener("click", addChecklist);
  byId("btn-settings").addEventListener("click", toggleSettings);
  byId("btn-demo").hidden = !demo;
  byId("btn-demo").addEventListener("click", askExitDemo);
  byId("btn-help").addEventListener("click", openHelp);
  byId("banner-close").addEventListener("click", hideToast);
  byId("page-prev").addEventListener("click", () => {
    state.ui.page -= 1;
    commit();
  });
  byId("page-next").addEventListener("click", () => {
    state.ui.page += 1;
    commit();
  });
  const lists = byId("lists");
  lists.addEventListener("click", onListClick);
  lists.addEventListener("dblclick", onListDblClick);
  lists.addEventListener("keydown", onListKeyDown);
  lists.addEventListener("focusout", onListBlur);
  lists.addEventListener("pointerdown", onRowDown);
  if (channel) {
    channel.onmessage = (event) => {
      if (event.data === tabId) {
        return;
      }
      externalWrite = true;
      maybeReload();
    };
  }
  const panel = byId("panel");
  panel.addEventListener("click", onPanelClick);
  panel.addEventListener("pointerdown", onPanelDown);
  // No long-press menu over a running row gesture, row drag or panel drag.
  document.addEventListener("contextmenu", (event) => {
    if (gesture || drag || panelDrag) {
      event.preventDefault();
    }
  });
  document.addEventListener("keydown", onKey);
  addEventListener("resize", onResize);
  dark.addEventListener("change", render);
  wide.addEventListener("change", closePopovers);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
      flushSave();
    }
  });
  // Hidden already flushed; only a still-pending save is worth serializing twice on close.
  addEventListener("pagehide", () => {
    if (saveTimer) {
      flushSave();
    }
  });
}

async function boot() {
  document.documentElement.style.setProperty("--hover-ms", `${GESTURE.hover}ms`);
  loadIcons();
  // Best effort: the browser still decides whether this origin keeps its data past eviction.
  navigator.storage?.persist?.().catch(() => {});
  state = await load();
  bind();
  render();
  if (storageBroken) showToast(t("storage_error"));
}

boot();

window.__tbd = {
  /* Empties the stores rather than deleting the database, which other open tabs would block. */
  async reset() {
    stopSaving = true;
    try {
      if (db) {
        await clearStores(db);
      }
    } catch {
      // storage unavailable: nothing to clear
    } finally {
      location.reload();
    }
  },
};
</script>
</body>
</html>
